# Pre-commit hook orchestration for dharma_swarm.
#
# Keep this file limited to checks whose entrypoints exist on origin/main.
#
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
# Bypass:    SKIP=<id> git commit ...   (only with justification in message)

minimum_pre_commit_version: "3.6.0"
fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Test hygiene gate (Rules 3 + 5) — Semgrep can't scan tests/ so we
  # use a small Python script instead. Currently warn-only because the
  # known offender tests/test_full_loop.py:343 has not been fixed yet.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-test-hygiene
        name: dharma test hygiene (rule 3 + 5)
        entry: scripts/governance/run_python_with_repo_env.sh scripts/governance/check_test_hygiene.py --warn-only
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dharma-contract-tests
        name: dharma contract tests
        entry: scripts/governance/run_pytest_with_repo_env.sh -q tests/test_contracts_scaffold.py tests/test_operator_core_contracts.py tests/test_runtime_contract.py tests/test_runtime_contract_adapters.py --tb=line
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dharma-uplift-guards
        name: dharma uplift guards
        entry: scripts/governance/run_python_with_repo_env.sh scripts/uplift_guards/run_pre_commit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dharma-forge-bypass
        name: dharma forge bypass guard
        entry: scripts/governance/run_python_with_repo_env.sh scripts/governance/check_forge_bypass.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dharma-docops-integrity
        name: dharma docops integrity
        entry: scripts/governance/run_python_with_repo_env.sh scripts/docops/check_docops_integrity.py --counts-advisory
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dharma-hygiene-integrity
        name: dharma hygiene integrity
        entry: scripts/governance/run_python_with_repo_env.sh scripts/governance/hygiene/check_hygiene_integrity.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dharma-manifest-check
        name: dharma manifest check (ACTIVE_SURFACE_MANIFEST ↔ repo reality)
        entry: scripts/governance/run_python_with_repo_env.sh tools/manifest_check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Gitleaks — secret scanning on staged content.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  # ---------------------------------------------------------------------------
  # Semgrep — production local config only (no registry fetch on commit; CI does that).
  # Phase 1 enforces only proof-of-life + the curated security pack.
  # Phase 4 expands `.semgrep/dharma-anti-slop.yml` with 10 rules.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: semgrep-local
        name: semgrep (production .semgrep rules, warn-only in Phase 1)
        # Phase 1 is warn-only so the install does not block on the 4
        # pre-existing real findings. CI (Phase 2) runs in strict mode;
        # Phase 4 promotes anti-slop rules to ERROR locally as well.
        entry: scripts/governance/run_semgrep_with_ca.sh --config .semgrep --quiet --metrics=off
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Whitespace / EOF / large-file hygiene.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        # Terminal frame fixtures intentionally preserve trailing blank rows so
        # byte-for-byte captures retain their exact 24/30/40-row geometry.
        exclude: '(?:\.(md|svg|json)$|^terminal/tests/golden/)'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-yaml
        exclude: '^\.semgrep/tests/'
      - id: check-toml
