# Pre-commit hook orchestration for dharma_swarm.
#
# Wraps the existing `scripts/uplift_guards/run_pre_commit.py` (kernel
# integrity, secrets, autonomous-destruction, hotpath, Shakti warrant,
# mismatch registry)
# alongside new gitleaks and semgrep gates.
#
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
# Bypass:    SKIP=<id> git commit ...   (only with justification in message)

minimum_pre_commit_version: "3.6.0"
fail_fast: false

repos:
  # ---------------------------------------------------------------------------
  # Contract tests — verify the interface mismatch registry stays green.
  # Was previously the first step of the legacy bash pre-commit; pulled into
  # the framework so we don't run it twice via migration mode.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-contract-tests
        name: dharma current contract tests
        entry: pytest tests/test_contracts_scaffold.py tests/test_operator_core_contracts.py tests/test_runtime_contract.py tests/test_runtime_contract_adapters.py -q --tb=line
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Existing dharma_swarm uplift guards — single Python entrypoint covers
  # kernel SHA, secrets scan, autonomous tripwires, hotpath ack, staged Shakti
  # warrant, mismatch reg.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-uplift-guards
        name: dharma uplift guards (kernel, secrets, hotpath, shakti, mismatch)
        entry: python3 scripts/uplift_guards/run_pre_commit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Prompt-packet provenance — first ratchet is warn-only. This runs at
  # commit-msg so it can inspect `Packet-Id: <prompt_hash>` lines and compare
  # them to staged hot/governance/risky source changes.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-packet-provenance
        name: dharma packet provenance (prompt lane Packet-Id; warn-only)
        entry: python3 scripts/governance/check_packet_provenance.py --warn-only
        language: system
        stages: [commit-msg]

  # ---------------------------------------------------------------------------
  # Test hygiene gate (Rules 3 + 5) — Semgrep can't scan tests/ so we
  # use a small Python script instead. Currently warn-only because the
  # known offender tests/test_full_loop.py:343 has not been fixed yet.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-test-hygiene
        name: dharma test hygiene (rule 3 + 5)
        entry: python3 scripts/governance/check_test_hygiene.py --warn-only
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Gitleaks — secret scanning on staged content.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)

  # ---------------------------------------------------------------------------
  # Semgrep — local config only (no registry fetch on commit; CI does that).
  # Phase 1 enforces only proof-of-life + the curated security pack.
  # Phase 4 expands `.semgrep/dharma-anti-slop.yml` with 10 rules.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: semgrep-local
        name: semgrep (.semgrep/ local rules, warn-only in Phase 1)
        # Phase 1 is warn-only so the install does not block on the 4
        # pre-existing real findings. CI (Phase 2) runs in strict mode;
        # Phase 4 promotes anti-slop rules to ERROR locally as well.
        entry: scripts/governance/run_semgrep_with_ca.sh --config .semgrep --quiet --metrics=off
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Whitespace / EOF / large-file hygiene.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.(md|svg|json)$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-yaml
        exclude: '^\.semgrep/tests/'
      - id: check-toml

  # ---------------------------------------------------------------------------
  # Tier-A code-quality gates (added 2026-05-09) — all warn-only initially.
  # Promote to error after baselines stabilize. See pyproject.toml [tool.*]
  # blocks and `make quality` for full invocation.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-vulture
        name: vulture (Python dead code; warn-only)
        entry: bash -c 'python3 -m vulture dharma_swarm/ .vulture_whitelist.py --min-confidence 90 || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: dharma-radon-cc
        name: radon CC (cyclomatic complexity flag C+; warn-only)
        entry: bash -c 'python3 -m radon cc dharma_swarm/ -nc -a --min C || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: dharma-bandit
        name: bandit (security; warn-only)
        entry: bash -c 'python3 -m bandit -r dharma_swarm/ -ll -q || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: dharma-mypy
        name: mypy (type check; warn-only)
        entry: bash -c 'python3 -m mypy dharma_swarm/ --ignore-missing-imports --no-error-summary || true'
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
      - id: dharma-fallow
        name: fallow (dashboard TS quality; warn-only)
        entry: bash -c 'cd dashboard && npx --yes fallow check || true'
        language: system
        pass_filenames: false
        files: ^dashboard/.*\.(ts|tsx|js|jsx)$
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Layer 7 cross-language hygiene (added 2026-05-09) — all warn-only.
  # typos: spelling in code + docs (config: _typos.toml)
  # shellcheck: shell-script linting
  # shfmt: shell-script formatting
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: dharma-typos
        name: typos (spell-check; warn-only)
        entry: bash -c 'typos dharma_swarm/ scripts/ docs/ || true'
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: dharma-shellcheck
        name: shellcheck (shell scripts; warn-only)
        entry: bash -c 'shellcheck $0 "$@" || true'
        language: system
        files: \.(sh|bash)$
        exclude: ^(node_modules|\.venv|terminal/node_modules)/
        stages: [pre-commit]
      - id: dharma-shfmt
        name: shfmt (shell formatting diff; warn-only)
        entry: bash -c 'shfmt -d -i 2 -ci $0 "$@" || true'
        language: system
        files: \.(sh|bash)$
        exclude: ^(node_modules|\.venv|terminal/node_modules)/
        stages: [pre-commit]
