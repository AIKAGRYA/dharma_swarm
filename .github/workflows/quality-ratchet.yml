name: quality-ratchet

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-ratchet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-ratchet:
    name: Quality ratchet - repo-wide fitness function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install ratchet tool dependency
        run: python -m pip install "ruff==0.15.16"

      - name: Run quality ratchet
        run: python3 scripts/governance/hygiene/ratchet.py --json
