name: quality-ratchet

# Makes the GLOBAL one-way quality ratchet load-bearing. The detector and
# baselines already shipped (scripts/governance/hygiene/ratchet.py +
# docs/governance/hygiene/ratchet_baselines.json) and `make quality-ratchet`
# ran only by hand, so whole-tree drift went ungated while the touched-file
# delta-ratchet grandfathered pre-existing debt. This workflow runs the global
# ratchet on PRs, main, merge queue, and weekly, with a baseline-freshness gate.

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
    # DELIBERATELY UNFILTERED — this workflow publishes a CONTRACTED check name
    # ('Quality ratchet - repo-wide fitness function' in docs/governance/CI_TRUTH_CONTRACT.json).
    #
    # A workflow-level `paths:` filter makes the workflow not run at all, so no
    # check appears in the rollup, and ci_truth.classify_check(None) returns
    # MISSING. PASS_CONCLUSIONS (ci_truth.py:20) contains SKIPPED but NOT
    # MISSING, so evaluate_rollup sets verdict = DEGRADED and the CLI exits 3 —
    # permanently, on every docs-only and dependency-only PR. The operator
    # report then cannot tell "advisory gate broken" from "advisory gate not
    # applicable", which is the whole value of the report.
    #
    # Per-JOB filtering (as tests.yml does) is the correct answer here: the job
    # reports `skipped`, and SKIPPED counts as PASS. The `changes` job below
    # classifies the diff; the ratchet job skips (not MISSING) when no Python
    # or hygiene inputs moved. Filtering at the workflow level is still forbidden.
  merge_group:
  push:
    branches: [main]
  schedule:
    # Weekly sweep catches drift on main even when no PR touched it.
    - cron: "31 13 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-ratchet-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality_ratchet: ${{ steps.classify.outputs.quality_ratchet }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/classify_changed_paths.py

  quality-ratchet:
    name: Quality ratchet - repo-wide fitness function
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.quality_ratchet != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install ratchet tool dependency
        run: python -m pip install "ruff==0.15.16"

      - name: Select merge-base baseline ref
        id: refs
        # On a PR or merge queue, grade counters against the baseline as it
        # existed at the merge-base of the PR base and HEAD, so a diff that
        # edits ratchet_baselines.json cannot raise its own ceiling. On a
        # direct push or schedule to main there is no PR base; the working
        # tree IS the merged reality, so no merge-base flag is passed.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run quality ratchet
        # Exit 1 = counter regression; exit 2 = broken measurement or stale
        # baseline. Both block because unmeasured or stale quality debt is an
        # open gate.
        run: |
          set -euo pipefail
          BASE="${{ steps.refs.outputs.base }}"
          if [ -n "$BASE" ]; then
            python3 scripts/governance/hygiene/ratchet.py --json \
              --max-baseline-age-days 45 --baseline-merge-base-of "$BASE"
          else
            python3 scripts/governance/hygiene/ratchet.py --json \
              --max-baseline-age-days 45
          fi
