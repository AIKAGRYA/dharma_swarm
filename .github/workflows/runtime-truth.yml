name: runtime-truth

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: runtime-truth-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-truth:
    name: Runtime Truth Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Runtime truth invariant gate
        env:
          TINY_ROUTER_BACKEND: heuristic
          DHARMA_EVOLUTION_SHADOW: "1"
          DGC_AUTONOMY_LEVEL: "0"
        run: make runtime-truth-ci
