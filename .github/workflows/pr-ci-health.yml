name: pr-ci-health

# Durable hourly PR CI-health backstop.
#
# This is the *mechanical* safety net that runs even when no agent session is
# alive (the in-session `/pr-ci-health` loop dies with its ephemeral container).
# A YAML job cannot reason, so it only does non-destructive / low-risk healing:
#
#   1. report  — triage every open PR via scripts/governance/pr_ci_health.py and
#                refresh a single tracking issue + the run summary.
#   2. rerun   — re-run failed workflow runs for PRs whose only failures are
#                transient infra flakes (e.g. the CodeQL default-setup umbrella
#                status that completes in seconds while `codeql / python` passes).
#   3. rebase  — rebase conflict-free behind-main PR branches onto origin/main
#                via scripts/governance/pr_ci_safe_rebase.py (fail-closed:
#                count-bound explicit file pages, current+previous filenames,
#                same-repo/head-SHA/race/lease binding). Session Entry packet
#                branches are skipped; owner append-only reseal is required.
#                PUSH IS FAIL-CLOSED: pushes made with the default github.token
#                never trigger workflows, so a bot-rebased head gets ZERO check
#                runs and the PR strands (ci_never_ran). The rebase push only
#                happens when the operator-configured PR_CI_HEALTH_PUSH_TOKEN
#                secret (preferred: fine-grained PAT, contents:write on this
#                repo only) or the already-provisioned MERGEMASTERMIKE_PAT is
#                present — PAT pushes DO trigger workflows. Without either
#                trusted secret, the rebase is skipped and the PR is labeled
#                `ci-stranded-rebase-skipped` instead of being silently
#                stranded.
#
# The heavier, judgement-bearing fixes (Coherence-Delta body fields, Fourfold
# Shakti Warrant causes, real test/lint failures) are handled by the agent
# playbook at .claude/commands/pr-ci-health.md. This workflow never merges a PR.

on:
  schedule:
    - cron: "0 * * * *"
  # Rebase on the event that actually strands PRs. Every merge to main puts
  # every other open PR behind; with "require branches up to date" on, those
  # PRs cannot merge (and armed auto-merge cannot fire) until something
  # rebases them. On the hourly cron alone that wait was up to 59 minutes,
  # so the operator hand-tapped "Update branch" on each PR instead — which
  # restarts full CI on all of them, every time. Reacting to the merge
  # itself closes that window to ~1 minute and the queue drains unattended.
  # Runs in `rebase` mode only: triage feeds the rebase step, while the
  # tracking-issue upsert and flake-rerun sweeps stay on the hourly pass.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "report | rerun | rebase | all"
        default: "all"

concurrency:
  group: pr-ci-health
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  triage-and-heal:
    name: PR CI-health triage + mechanical heal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MODE: ${{ github.event.inputs.mode || (github.event_name == 'push' && 'rebase' || 'all') }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # pr_ci_safe_rebase.py pushes via `git push origin`, which uses the
          # credentials this checkout persists. github.token pushes never
          # trigger workflows (rebased heads strand with zero check runs), so
          # Prefer the dedicated least-privilege token. MERGEMASTERMIKE_PAT is
          # an existing PAT already used by this repo to trigger workflows and
          # is the recovery fallback while the dedicated token is provisioned.
          # The selected credential's actual repository push authority is
          # validated below; secret presence alone never authorizes a rebase.
          token: ${{ secrets.PR_CI_HEALTH_PUSH_TOKEN || secrets.MERGEMASTERMIKE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate trusted rebase push authority
        if: env.MODE == 'all' || env.MODE == 'rebase'
        env:
          PUSH_TOKEN: ${{ secrets.PR_CI_HEALTH_PUSH_TOKEN || secrets.MERGEMASTERMIKE_PAT }}
        run: |
          set -euo pipefail
          has_push_token=false
          if [ -n "${PUSH_TOKEN:-}" ]; then
            push_allowed="$(GH_TOKEN="$PUSH_TOKEN" gh api "repos/$REPO" \
              --jq '.permissions.push // false' 2>/dev/null || true)"
            if [ "$push_allowed" = "true" ]; then
              has_push_token=true
              echo "Trusted PR CI-health credential has repository push authority."
            else
              echo "::warning::Configured PR CI-health credential does not prove repository push authority; rebase remains fail-closed."
            fi
          else
            echo "::notice::No trusted PR CI-health credential configured; rebase remains fail-closed."
          fi
          echo "HAS_PUSH_TOKEN=$has_push_token" >> "$GITHUB_ENV"

      - name: Triage open PRs
        run: |
          set -euo pipefail
          python3 scripts/governance/pr_ci_health.py --repo "$REPO" --json > triage.json
          python3 scripts/governance/pr_ci_health.py --repo "$REPO" > triage.md
          {
            echo "## PR CI-Health triage"
            echo
            cat triage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert tracking issue
        if: env.MODE == 'all' || env.MODE == 'report'
        run: |
          set -euo pipefail
          title="PR CI-Health triage (auto)"
          body="$(printf '_Auto-updated by the hourly pr-ci-health workflow. Run: %s_\n\n' "${GITHUB_RUN_ID}"; cat triage.md)"
          num="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number,title \
                 --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$REPO" --body "$body"
            echo "updated issue #$num"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Re-run transient infra failures
        if: env.MODE == 'all' || env.MODE == 'rerun'
        continue-on-error: true
        run: |
          set -uo pipefail
          # PRs whose categories include transient_infra (and not a real failure).
          mapfile -t prs < <(jq -r '.[] | select(.categories | index("transient_infra")) | select(.categories | index("real_test_lint") | not) | .number' triage.json)
          for pr in "${prs[@]:-}"; do
            [ -z "$pr" ] && continue
            sha="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
            echo "PR #$pr ($sha): re-running failed workflow runs"
            for run_id in $(gh api "repos/$REPO/actions/runs?head_sha=$sha&status=failure&per_page=20" --jq '.workflow_runs[].id'); do
              gh run rerun "$run_id" --repo "$REPO" --failed || echo "  rerun $run_id skipped"
            done
          done

      - name: Rebase conflict-free behind-main branches
        if: env.MODE == 'all' || env.MODE == 'rebase'
        continue-on-error: true
        env:
          # HAS_PUSH_TOKEN is written to GITHUB_ENV only after the selected
          # credential proves repository push authority via the GitHub API.
          # github.token pushes do not trigger workflows and remain ineligible.
          STRAND_LABEL: ci-stranded-rebase-skipped
        run: |
          set -uo pipefail
          git config user.name "pr-ci-health-bot"
          git config user.email "pr-ci-health-bot@users.noreply.github.com"
          # Main fetch/config only. PR-head mutation is owned exclusively by
          # scripts/governance/pr_ci_safe_rebase.py after fail-closed guards:
          # explicit per_page/page file enumeration (not --paginate alone),
          # filename + previous_filename packet checks, same-repo + head SHA
          # race re-reads, PR-number ref fetch, and explicit force-with-lease.
          git fetch origin main
          if [ "$HAS_PUSH_TOKEN" != "true" ]; then
            echo "No authorized trusted PR CI-health push token is available: rebase pushes are DISABLED (fail-closed)."
            echo "A github.token push never triggers workflows; the rebased head would strand with zero check runs."
            gh label create "$STRAND_LABEL" --repo "$REPO" \
              --description "pr-ci-health skipped an auto-rebase: no configured credential proved push authority" \
              --color "D93F0B" 2>/dev/null || true
          fi
          # Select on behind_by (the compare API's authoritative count), NOT
          # on mergeable_state. mergeable_state is a SINGLE value with a
          # precedence order in which "blocked" (a required check missing or
          # failing) outranks "behind" — so a PR that is both behind main and
          # waiting on CI reports "blocked", and this pass skipped it. On this
          # repo nearly every behind-main PR is simultaneously blocked or
          # unstable, which is why the auto-rebase reported success while the
          # operator still had to press "Update branch" by hand on every PR.
          # Conflicted branches are excluded: a rebase cannot resolve them.
          mapfile -t prs < <(jq -r '.[] | select(.categories | index("behind_main")) | select(.categories | index("merge_conflict") | not) | "\(.number)\t\(.head)\t\(.base)"' triage.json)
          for line in "${prs[@]:-}"; do
            [ -z "$line" ] && continue
            pr="$(echo "$line" | cut -f1)"; head="$(echo "$line" | cut -f2)"; base="$(echo "$line" | cut -f3)"
            if [ "$base" != "main" ]; then
              echo "PR #$pr base=$base (not main); skipping auto-rebase"
              continue
            fi
            if [ "$head" = "chore/docops-autorefresh" ]; then
              # The rolling DocOps reconcile lane is generated content whose
              # branch docops-reconcile-main.yml owns; behind-main is its
              # normal state and any force-push here (either token) fights
              # that workflow's ownership of the branch.
              echo "PR #$pr head=$head is the rolling DocOps lane; skipping auto-rebase"
              continue
            fi
            if [ "$HAS_PUSH_TOKEN" != "true" ]; then
              # FAIL-CLOSED: no push token, no push. Label + comment once so
              # the stranding is visible instead of silent (the 2026-07-20
              # 23:27Z rebase wave stranded 14 open PRs with zero check runs).
              echo "PR #$pr: SKIPPING auto-rebase (fail-closed; no trusted push token)"
              if gh api "repos/$REPO/issues/$pr" --jq '.labels[].name' | grep -qxF "$STRAND_LABEL"; then
                echo "PR #$pr: already labeled $STRAND_LABEL"
              else
                gh api -X POST "repos/$REPO/issues/$pr/labels" -f "labels[]=$STRAND_LABEL" \
                  || echo "PR #$pr: labeling failed"
                gh pr comment "$pr" --repo "$REPO" --body "pr-ci-health: this PR is behind \`main\`, but the hourly auto-rebase was **skipped (fail-closed)**. No configured trusted credential currently proves repository push authority, and a rebase pushed with the default \`GITHUB_TOKEN\` never triggers workflows — the rebased head would have zero check runs (\`ci_never_ran\`). Rebase manually (any author/PAT push re-triggers CI), or configure a contents-write \`PR_CI_HEALTH_PUSH_TOKEN\`." \
                  || echo "PR #$pr: comment failed"
              fi
              continue
            fi
            # Guard + rebase + restore: never inline PR-head fetch/rebase/push.
            # The push inside the helper uses the checkout-persisted
            # trusted PAT selected above, so the rebased head triggers CI.
            python3 scripts/governance/pr_ci_safe_rebase.py \
              --repo "$REPO" \
              --pr "$pr" \
              --expected-base "$base" \
              --expected-head "$head" || {
              echo "PR #$pr: safe-rebase helper exited nonzero; no success assumed — inspect helper output"
              continue
            }
          done
