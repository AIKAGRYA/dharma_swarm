name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "promote/**", "governance/**"]
    # DELIBERATELY UNFILTERED — this workflow publishes a CONTRACTED check name
    # ('codeql / python' in docs/governance/CI_TRUTH_CONTRACT.json).
    #
    # A workflow-level `paths:` filter makes the workflow not run at all, so no
    # check appears in the rollup, and ci_truth.classify_check(None) returns
    # MISSING. PASS_CONCLUSIONS (ci_truth.py:20) contains SKIPPED but NOT
    # MISSING, so evaluate_rollup sets verdict = DEGRADED and the CLI exits 3 —
    # permanently, on every docs-only and dependency-only PR. The operator
    # report then cannot tell "advisory gate broken" from "advisory gate not
    # applicable", which is the whole value of the report.
    #
    # Per-JOB filtering (as tests.yml does) is the correct answer here: the job
    # reports `skipped`, and SKIPPED counts as PASS. That needs a classifier job
    # in this workflow and a contract entry for its check name; it is deliberate
    # follow-up, not done here. Filtering it back at the workflow level is not
    # the fix and is blocked by test_workflow_path_filters.py.
  merge_group:
  schedule:
    # Sunday 09:00 UTC (Mon 17:00 GMT+8) — weekly variant analysis
    - cron: '0 9 * * 0'

# Run no more than one CodeQL analysis per ref at a time.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: codeql / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fee9466b8957867761f2d78f922ab084e3e2dd17 # v3
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds higher-precision queries; `security-and-quality`
          # adds maintainability queries. Stick with extended for now.
          queries: security-extended
          # Phase 1 install: do NOT fail the build on findings yet.
          # Findings stream into the Security tab; ratchet to fail-on-high
          # in a follow-up PR after a 2-week observation window.
          config: |
            paths-ignore:
              - migration_delta
              - dharma_swarm_old
              - foundations
              - reports
              - results
              - experiments
              - transcripts
              - "**/.audit-screens"
              - "**/__pycache__"
              - "**/*.min.js"
              - dashboard/.next
              - dashboard/node_modules

      - name: Autobuild
        uses: github/codeql-action/autobuild@fee9466b8957867761f2d78f922ab084e3e2dd17 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fee9466b8957867761f2d78f922ab084e3e2dd17 # v3
        with:
          category: "/language:${{ matrix.language }}"
          # Findings flow into the Security tab even when this step exits 0.
          upload: always
