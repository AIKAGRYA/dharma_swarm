name: cache-token-guard

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
    paths:
      - '.github/workflows/**'
      - 'scripts/governance/check_workflow_cache_token.py'
      - '.github/workflows/cache-token-guard.yml'
  merge_group:

concurrency:
  group: cache-token-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cache-token-guard:
    name: Cache-poisoning and token least-privilege guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run cache-token guard
        run: |
          python3 scripts/governance/check_workflow_cache_token.py
