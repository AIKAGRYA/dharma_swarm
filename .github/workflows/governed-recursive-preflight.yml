name: governed-recursive-preflight

on:
  pull_request:
    branches: [main]

concurrency:
  group: governed-recursive-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  prod-preflight:
    name: Governed recursive + MemoryKernel preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run governed recursive preflight
        env:
          TINY_ROUTER_BACKEND: heuristic
          DHARMA_EVOLUTION_SHADOW: "1"
          DGC_AUTONOMY_LEVEL: "0"
        run: |
          python scripts/prod_preflight.py --repo-root . --quick

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-preflight-report
          path: reports/prod_preflight/latest.json
