name: kernel-tests

on:
  pull_request:
    paths:
      - "packages/telos-kernel/**"
      - "kernel/manifest.yaml"
      - "dharma_swarm/merkle_log.py"
      - ".github/workflows/kernel-tests.yml"
  push:
    branches: [main]

jobs:
  pytest:
    name: kernel pytest + hypothesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/telos-kernel
          pip install pytest pytest-timeout hypothesis pydantic pyyaml cryptography icontract
      - name: Run kernel tests
        run: |
          pytest packages/telos-kernel/telos_kernel/tests \
            -q --tb=short --timeout=120 \
            --ignore=packages/telos-kernel/telos_kernel/tests/test_nagini.py \
            --ignore=packages/telos-kernel/telos_kernel/tests/test_crosshair.py
      - name: Verify legacy shim
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_legacy_shim.py -q
