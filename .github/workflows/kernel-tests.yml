name: kernel-tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/telos-kernel/**"
      - "kernel/manifest.yaml"
      - "dharma_swarm/merkle_log.py"
      - ".github/workflows/kernel-tests.yml"
  push:
    branches: [main]

jobs:
  pytest:
    name: kernel pytest + hypothesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install kernel package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/telos-kernel
          pip install pytest pytest-timeout hypothesis pydantic pyyaml cryptography icontract
      - name: Run kernel tests
        run: |
          pytest packages/telos-kernel/telos_kernel/tests \
            -q --tb=short --timeout=120 \
            --ignore=packages/telos-kernel/telos_kernel/tests/test_crosshair.py
      - name: Verify legacy shim
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_legacy_shim.py -q

  lean:
    name: crisp-open Lean proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build with Lean and re-check the environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: packages/telos-kernel/formal/crisp_open/lean
          auto-config: false
          build: true
          test: false
          lint: false
          leanchecker: true
          use-mathlib-cache: false
          use-github-cache: false
      - name: Count proof escapes and audit theorem dependencies
        run: bash packages/telos-kernel/formal/crisp_open/lean/verify.sh
