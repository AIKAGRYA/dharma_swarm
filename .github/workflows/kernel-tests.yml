name: kernel-tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "packages/telos-kernel/**"
      - "kernel/manifest.yaml"
      - "dharma_swarm/merkle_log.py"
      - ".github/workflows/kernel-tests.yml"
  push:
    branches: [main]

jobs:
  pytest:
    name: kernel pytest + hypothesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install kernel package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/telos-kernel
          pip install pytest pytest-timeout hypothesis pydantic pyyaml cryptography icontract
      - name: Run kernel tests
        run: |
          pytest packages/telos-kernel/telos_kernel/tests \
            -q --tb=short --timeout=120 \
            --ignore=packages/telos-kernel/telos_kernel/tests/test_crosshair.py
      - name: Verify legacy shim
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_legacy_shim.py -q

  lean:
    name: crisp-open Lean proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build pinned elan v4.2.1 from source
        env:
          ELAN_SOURCE_SHA: 3d5138e1526a569a23901b8ee559032793cf445e
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          git clone --filter=blob:none https://github.com/leanprover/elan.git "$RUNNER_TEMP/elan-src"
          git -C "$RUNNER_TEMP/elan-src" checkout --detach "$ELAN_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/elan-src" rev-parse HEAD)" = "$ELAN_SOURCE_SHA"
          cargo build \
            --locked \
            --release \
            --manifest-path "$RUNNER_TEMP/elan-src/Cargo.toml" \
            --bin elan-init
          "$RUNNER_TEMP/elan-src/target/release/elan-init" \
            -y \
            --no-modify-path \
            --default-toolchain none
          "$HOME/.elan/bin/elan" --version
          test "$("$HOME/.elan/bin/elan" --version | awk '{print $2}')" = "4.2.1"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile, count proof escapes, and audit theorem dependencies
        run: |
          set -euo pipefail
          cd packages/telos-kernel/formal/crisp_open/lean
          elan show
          lean --version
          lake --version
          bash verify.sh
