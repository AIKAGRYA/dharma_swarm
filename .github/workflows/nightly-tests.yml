name: nightly-tests

# Nightly full-suite lane (dive_test_depth.md section 4a). PR CI (tests.yml)
# runs with -x and marker excludes for speed; this lane exists to surface the
# FULL failure mass every night: no -x, no marker excludes, slow/docker/
# browser tests included, flake damping via nightly-only reruns.

on:
  schedule:
    - cron: "30 19 * * *" # 03:30 Bali (UTC+8), after the 03:00 deep_sleep
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.2"

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Quarantine gate (issue, expiry, 15-entry cap)
        run: python3 scripts/governance/check_quarantine.py

      - name: Hermetic install (lockfile drift fails)
        run: |
          python -m pip install --upgrade "uv==${UV_VERSION}"
          uv lock --check
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install playwright
          .venv/bin/playwright install --with-deps chromium

      - name: Run full suite (no -x, no marker excludes)
        env:
          # Stub keys so provider init doesn't crash (same as tests.yml).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-stub' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-stub' }}
          TINY_ROUTER_BACKEND: heuristic
          DHARMA_EVOLUTION_SHADOW: "1"
          DGC_AUTONOMY_LEVEL: "0"
        run: |
          # pipefail so pytest's exit code (not tee's) determines the step
          # result; +e around the pipeline so the count tail still prints on
          # failure before re-exiting with pytest's real status.
          set -o pipefail
          DESELECT=$(python scripts/governance/check_quarantine.py --emit-deselect)
          set +e
          # $DESELECT expands to zero or more --deselect=<id> args (no spaces
          # inside an arg), so unquoted word-splitting is intended here.
          python -m pytest tests/ -q --tb=short \
            --timeout=120 \
            --reruns 2 --only-rerun "(AssertionError|TimeoutError|ConnectionError)" \
            $DESELECT \
            --junitxml=nightly.xml \
            2>&1 | tee nightly_output.txt
          status=${PIPESTATUS[0]}
          set -e
          tail -3 nightly_output.txt
          exit "$status"

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-full-suite
          path: |
            nightly.xml
            nightly_output.txt

  coverage-advisory:
    # Advisory only — measures the dive's three hot targets against their
    # dedicated test files and reports percentages in the job summary. No
    # thresholds yet; the per-package ratchet comes later (dive section 4c).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Hermetic install (lockfile drift fails)
        run: |
          python -m pip install --upgrade "uv==${UV_VERSION}"
          uv lock --check
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Measure hot-target coverage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-stub' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-stub' }}
          TINY_ROUTER_BACKEND: heuristic
          DHARMA_EVOLUTION_SHADOW: "1"
          DGC_AUTONOMY_LEVEL: "0"
        run: |
          # Exit codes are captured and surfaced in the summary instead of
          # failing the step: this job is advisory, and a red test (e.g. the
          # known council event-loop bug) must not hide the coverage numbers.
          set +e
          python -m pytest tests/test_a2a*.py tests/test_nats_*.py -q --tb=line --timeout=120 \
            --cov=dharma_swarm.a2a --cov-branch \
            --cov-report=json:cov_a2a.json --cov-report=term
          echo "a2a $?" >> cov_exit_codes.txt
          python -m pytest tests/test_vector_store.py -q --tb=line --timeout=120 \
            --cov=dharma_swarm.vector_store --cov=dharma_swarm.vector_fallback_guard --cov-branch \
            --cov-report=json:cov_vector.json --cov-report=term
          echo "vector $?" >> cov_exit_codes.txt
          python -m pytest tests/test_model_council_e2e.py -q --tb=line --timeout=120 \
            --cov=dharma_swarm.model_council_e2e --cov-branch \
            --cov-report=json:cov_council.json --cov-report=term
          echo "council $?" >> cov_exit_codes.txt
          exit 0

      - name: Write coverage summary
        run: |
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          def pct(value):
              return f"{value:.1f}%" if value is not None else "n/a"

          def totals_pct(path):
              try:
                  return json.loads(Path(path).read_text())["totals"]["percent_covered"]
              except (OSError, KeyError, ValueError):
                  return None

          def file_pct(path, suffix):
              try:
                  files = json.loads(Path(path).read_text())["files"]
              except (OSError, KeyError, ValueError):
                  return None
              for name, data in files.items():
                  if name.endswith(suffix):
                      return data["summary"]["percent_covered"]
              return None

          exit_codes = {}
          try:
              for line in Path("cov_exit_codes.txt").read_text().splitlines():
                  name, _, code = line.partition(" ")
                  exit_codes[name] = code
          except OSError:
              pass

          rows = [
              ("dharma_swarm/a2a (package, branch)", totals_pct("cov_a2a.json"), "tests/test_a2a*.py", exit_codes.get("a2a", "?")),
              ("vector_store.py (branch)", file_pct("cov_vector.json", "vector_store.py"), "tests/test_vector_store.py", exit_codes.get("vector", "?")),
              ("vector_fallback_guard.py (branch)", file_pct("cov_vector.json", "vector_fallback_guard.py"), "tests/test_vector_store.py", exit_codes.get("vector", "?")),
              ("model_council_e2e.py (branch)", file_pct("cov_council.json", "model_council_e2e.py"), "tests/test_model_council_e2e.py", exit_codes.get("council", "?")),
          ]

          lines = [
              "## Hot-target coverage (advisory)",
              "",
              "Dedicated-test-file measurements per dive_test_depth.md section 3.",
              "No thresholds enforced yet; the ratchet lands per section 4c.",
              "",
              "| Target | Coverage | Test scope | pytest exit |",
              "|---|---|---|---|",
          ]
          for name, value, scope, code in rows:
              lines.append(f"| {name} | {pct(value)} | {scope} | {code} |")
          lines.append("")
          lines.append("A nonzero pytest exit means failing tests in that scope; "
                       "coverage is still measured over the tests that ran.")

          out = "\n".join(lines) + "\n"
          print(out)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(out)
          EOF

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-coverage-advisory
          path: |
            cov_a2a.json
            cov_vector.json
            cov_council.json
            cov_exit_codes.txt
