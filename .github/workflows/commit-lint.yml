name: commit-lint

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:

concurrency:
  group: commit-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scan-messages:
    name: scan PR commit messages
    runs-on: ubuntu-latest
    # On merge_group batches there is no PR context (body, head/base
    # SHAs); these PR-shaped validations already passed on the PR run
    # before the PR entered the queue. Skipped = satisfied for required
    # checks, so the queue is not blocked.
    if: github.event_name != 'merge_group'
    timeout-minutes: 5
    steps:
      - name: Checkout (with PR head)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Forbidden message patterns (Rule 7 — no LF5 whole-file restore)
        # Whole-file restores from LF5 worktree to main come with commit
        # messages like "restore from lf5", "wholesale restore", etc.
        # If you need to bring code in from LF5, do it as an explicit
        # promotion slice with a real diff and rationale.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          msgs=$(git log --format="%H%n%s%n---END---" "${base}".."${head}")
          echo "$msgs" | grep -iE "(wholesale restore|restore from lf5|whole.?file restore|copy entire from lf5|sync all from lf5)" && {
            echo "::error::Forbidden commit-message pattern (Rule 7)."
            echo "If you need to bring code in from LF5, open a narrow"
            echo "promotion slice PR with an explicit diff and rationale."
            exit 1
          }
          echo "Commit messages clean for Rule 7."

      - name: Conventional commit hint (advisory)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          subjects=$(git log --format="%s" "${base}".."${head}")
          while IFS= read -r line; do
            if ! echo "$line" | grep -qE "^(feat|fix|chore|docs|test|refactor|perf|ci|build|style)(\([^)]+\))?(!)?: "; then
              echo "::warning::Commit subject not in conventional form: '$line'"
            fi
          done <<< "$subjects"

  phase0-triple-check-ephemeral:
    name: independent Phase 0 triple-check (ephemeral)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENROUTER_API_KEY: sk-or-stub
      ANTHROPIC_API_KEY: sk-ant-stub
      TINY_ROUTER_BACKEND: heuristic
      DHARMA_EVOLUTION_SHADOW: "1"
      DGC_AUTONOMY_LEVEL: "0"
      AGENTOPS_REPORT_ROOT: ${{ runner.temp }}/dharma-agentops-triple-check
      DHARMA_OPS_DIR: ${{ runner.temp }}/dharma-ops-triple-check
      TMPDIR: ${{ runner.temp }}/dharma-tmp-triple-check
    steps:
      - name: Checkout audit controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          fetch-depth: 1

      - name: Checkout exact integrated candidate with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: e4b74411c21efa47c635b29517a8798e99d0e77c
          path: target
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run independent Phase 0 triple-check
        shell: bash
        run: |
          set -uo pipefail
          umask 022
          mkdir -p "$TMPDIR" "$AGENTOPS_REPORT_ROOT" "$DHARMA_OPS_DIR" "$GITHUB_WORKSPACE/triple-check-artifacts"
          unset PYTHONPATH
          python "$GITHUB_WORKSPACE/controller/scripts/governance/phase0_triple_check_ephemeral.py" \
            --repo "$GITHUB_WORKSPACE/target" \
            --out "$GITHUB_WORKSPACE/triple-check-artifacts" \
            --target-sha e4b74411c21efa47c635b29517a8798e99d0e77c \
            --base-sha e891baa59baab3815d3de44806ff3137d33cd321

      - name: Upload raw verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: titanium-phase0-triple-check-${{ github.run_id }}
          path: triple-check-artifacts/
          if-no-files-found: error
          retention-days: 7
