name: hardening-lane

# Loop lane (loop-closure-2026-06): capped, draft-only hardening runs.
# PR-E of the walking-mode loop-closure plan (operator ruling 2026-07-29).
#
# Caps live HERE, not in any prompt: timeout-minutes bounds the run,
# LANE_MAX_* bound the agent and the diff, one target per run, and the
# kill-switch guard halts the lane before any work. Output is only ever a
# draft PR labeled mike-watch + walk-ready entering the §5 review pipeline.
# Receipts are artifacts + step summary — never committed (CLAUDE.md:
# runtime receipts never enter git).

on:
  schedule:
    - cron: "0 18 * * 1,3,5"  # Mon/Wed/Fri 18:00 UTC = 03:00 JST overnight
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: hardening-lane
  cancel-in-progress: false

jobs:
  harden:
    name: One capped hardening run
    runs-on: ubuntu-latest
    # Budget: agent 1200s + tests 1500s = 45 min of capped work, inside a
    # 65-minute envelope that leaves margin for checkout, dependency
    # install, and delivery. The old 45-minute job timeout was SHORTER than
    # its own inner budgets (1200 + 1800 = 50 min), so a cap-compliant run
    # could be killed before it wrote its receipt (Codex on PR #1162).
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LANE_MAX_DIFF_LINES: "600"
      LANE_MAX_AGENT_SECONDS: "1200"
      LANE_MAX_TEST_SECONDS: "1500"
      DHARMA_LANE_AGENT_CMD: ${{ secrets.DHARMA_LANE_AGENT_CMD }}
    steps:
      - name: Halt on loop kill-switch
        run: |
          set -euo pipefail
          # Loop kill-switch (docs/ops/loop_control/README.md): file present on
          # the loop-control branch => HALT (exit 1, red-while-halted); absent
          # (404 on file or branch) => proceed; any other error => fail closed.
          url="repos/${GH_REPO}/contents/docs/ops/loop_control/KILLSWITCH?ref=loop-control"
          if response="$(gh api "$url" 2>&1)"; then
            echo "HALTED BY KILLSWITCH (docs/ops/loop_control/KILLSWITCH on loop-control)" >&2
            echo "## 🔴 HALTED BY KILLSWITCH — no lane run" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif echo "$response" | grep -qiE "HTTP 404|\"status\": *\"404\"|Not Found|No commit found"; then
            echo "kill-switch absent; proceeding"
          else
            echo "kill-switch state UNKNOWN — failing closed: $response" >&2
            exit 1
          fi

      - name: Checkout default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Overlay operator-ingested tasks (read-only, outside the worktree)
        run: |
          set -euo pipefail
          # PR-F ingestion writes mailbox tasks to the loop-tasks branch. The
          # lane must READ them without the overlay ever becoming part of the
          # change set it measures and commits: checking them into the
          # worktree left tracked mailbox files modified, so `git reset` only
          # unstaged them and the driver still counted them against the diff
          # cap and committed them into the draft (Greptile on PR #1162).
          # Materializing the overlay OUTSIDE the repo removes the class of
          # bug entirely — no worktree path can leak into a commit.
          mkdir -p "${RUNNER_TEMP}/lane-mailbox/tasks"
          if git fetch origin loop-tasks 2>/dev/null; then
            git archive origin/loop-tasks roaming_mailbox/tasks 2>/dev/null \
              | tar -x -C "${RUNNER_TEMP}/lane-mailbox" --strip-components=1 \
              || echo "loop-tasks carries no mailbox tasks yet"
          else
            echo "no loop-tasks branch yet"
          fi
          echo "LANE_MAILBOX_ROOT=${RUNNER_TEMP}/lane-mailbox" >> "$GITHUB_ENV"
          # Fail closed if anything did land in the worktree despite the above.
          if ! git diff --quiet -- roaming_mailbox/ 2>/dev/null; then
            echo "::error::mailbox overlay contaminated the worktree" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Without this the lane reached `make test-fast` on a bare runner,
          # pytest failed at collection, and EVERY agent diff was recorded
          # TESTS_RED — the lane could never deliver anything (Codex on
          # PR #1162).
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the lane
        run: |
          set -uo pipefail
          git config user.name "hardening-lane"
          git config user.email "hardening-lane@users.noreply.github.com"
          # Capture the exit status: PUSH_FAILED / PR_CREATE_FAILED write a
          # useful receipt and then return 1, and `set -e` used to abort the
          # step before that receipt reached the summary — exactly the runs
          # where it matters most (Codex on PR #1162).
          set +e
          python3 scripts/runtime/hardening_lane.py \
            --repo "${GH_REPO}" \
            --receipt "${RUNNER_TEMP}/hardening_lane_receipt.json"
          lane_exit="$?"
          set -e
          {
            echo "## Hardening lane receipt"
            echo '```json'
            cat "${RUNNER_TEMP}/hardening_lane_receipt.json" 2>/dev/null \
              || echo '{"status": "NO_RECEIPT_WRITTEN"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${lane_exit}"

      - name: Upload receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-lane-receipt
          path: ${{ runner.temp }}/hardening_lane_receipt.json
          if-no-files-found: warn
