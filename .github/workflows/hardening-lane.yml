name: hardening-lane

# Loop lane (loop-closure-2026-06): capped, draft-only hardening runs.
# PR-E of the walking-mode loop-closure plan (operator ruling 2026-07-29).
#
# TWO JOBS, TWO TRUST LEVELS. This is the whole design, and it is expressed
# in the `permissions:` blocks below rather than in any guard:
#
#   propose  — runs the agent and the tests. `contents: read` only, and
#              `persist-credentials: false`, so there is no repository write
#              credential anywhere in the job for an agent to reach, race,
#              or redirect. Output: a git bundle holding exactly one commit.
#   deliver  — verifies that bundle against origin and pushes it. Separate
#              runner, fresh checkout, never runs agent code, never runs the
#              test suite, never checks out the candidate tree, never stages.
#
# PR #1162 tried to do both in one job and could not be made safe: with the
# agent and the push sharing a UID and a checkout, `credential.helper` and
# `url.<base>.insteadOf` are multi-valued, so `git -c` APPENDS rather than
# overrides and a hostile entry survives every in-process guard. Greptile
# demonstrated a real push to an attacker repository through the full guard
# set. Splitting the credential away from the agent dissolves that class
# instead of mitigating it.
#
# Caps live HERE, not in any prompt. Receipts are artifacts + step summary,
# never committed (CLAUDE.md: runtime receipts never enter git).

on:
  schedule:
    - cron: "0 18 * * 1,3,5"  # Mon/Wed/Fri 18:00 UTC = 03:00 JST overnight
  workflow_dispatch:
    inputs:
      dry_run:
        description: "verify the bundle but push nothing"
        type: boolean
        default: false

# Job-level permissions override this floor. Nothing is granted repo-wide.
permissions: {}

concurrency:
  group: hardening-lane
  cancel-in-progress: false

env:
  LANE_MAX_DIFF_LINES: "600"
  LANE_MAX_CHANGED_FILES: "40"
  LANE_MAX_AGENT_SECONDS: "1200"
  LANE_MAX_TEST_SECONDS: "1500"
  LANE_MAX_OPEN_DRAFTS: "1"

jobs:
  propose:
    name: Propose (untrusted — no write credential)
    runs-on: ubuntu-latest
    # Budget: agent 1200s + tests 1500s = 45 min of capped work inside a
    # 65-minute envelope, leaving margin for checkout, install and bundling.
    timeout-minutes: 65
    permissions:
      contents: read   # public repo: worth no more than an anonymous fetch
      actions: read    # nightly-tests run status, for target selection
    outputs:
      status: ${{ steps.lane.outputs.status }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DHARMA_LANE_AGENT_CMD: ${{ secrets.DHARMA_LANE_AGENT_CMD }}
    steps:
      - name: Halt on loop kill-switch
        run: |
          set -euo pipefail
          # Loop kill-switch (docs/ops/loop_control/README.md): file present on
          # the loop-control branch => HALT (exit 1, red-while-halted); absent
          # (404 on file or branch) => proceed; any other error => fail closed.
          url="repos/${GH_REPO}/contents/docs/ops/loop_control/KILLSWITCH?ref=loop-control"
          if response="$(gh api "$url" 2>&1)"; then
            echo "HALTED BY KILLSWITCH (docs/ops/loop_control/KILLSWITCH on loop-control)" >&2
            echo "## 🔴 HALTED BY KILLSWITCH — no lane run" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif echo "$response" | grep -qiE "HTTP 404|\"status\": *\"404\"|Not Found|No commit found"; then
            echo "kill-switch absent; proceeding"
          else
            echo "kill-switch state UNKNOWN — failing closed: $response" >&2
            exit 1
          fi

      - name: Checkout default branch (no persisted credentials)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # The load-bearing line of this job. Without it the checkout writes
          # an auth header into .git/config, and every git command the agent
          # can influence runs with it in scope.
          persist-credentials: false

      - name: Overlay operator-ingested tasks (read-only, outside the worktree)
        run: |
          set -euo pipefail
          # PR-F ingestion writes mailbox tasks to the loop-tasks branch. The
          # lane READS them without the overlay ever entering the change set
          # it measures: materializing outside the repo means no worktree
          # path can leak into the commit.
          mkdir -p "${RUNNER_TEMP}/lane-mailbox/tasks"
          if git fetch origin loop-tasks 2>/dev/null; then
            git archive origin/loop-tasks roaming_mailbox/tasks 2>/dev/null \
              | tar -x -C "${RUNNER_TEMP}/lane-mailbox" --strip-components=1 \
              || echo "loop-tasks carries no mailbox tasks yet"
          else
            echo "no loop-tasks branch yet"
          fi
          echo "LANE_MAILBOX_ROOT=${RUNNER_TEMP}/lane-mailbox" >> "$GITHUB_ENV"
          if ! git diff --quiet -- roaming_mailbox/ 2>/dev/null; then
            echo "::error::mailbox overlay contaminated the worktree" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Without this the lane reaches `make test-fast` on a bare runner,
          # pytest fails at collection, and EVERY agent diff records
          # TESTS_RED — the lane could never deliver anything.
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the proposing phase
        id: lane
        run: |
          set -uo pipefail
          git config user.name "hardening-lane"
          git config user.email "hardening-lane@users.noreply.github.com"
          # Capture the exit status: failure paths write a useful receipt and
          # then return nonzero, and `set -e` would abort before that receipt
          # reached the summary — exactly the runs where it matters most.
          set +e
          python3 scripts/runtime/lane_propose.py \
            --repo "${GH_REPO}" \
            --receipt "${RUNNER_TEMP}/lane_propose_receipt.json" \
            --bundle "${RUNNER_TEMP}/lane_delivery.bundle"
          lane_exit="$?"
          set -e
          {
            echo "## Hardening lane — propose receipt"
            echo '```json'
            cat "${RUNNER_TEMP}/lane_propose_receipt.json" 2>/dev/null \
              || echo '{"status": "NO_RECEIPT_WRITTEN"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${lane_exit}"

      - name: Upload delivery candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-delivery-candidate
          path: |
            ${{ runner.temp }}/lane_delivery.bundle
            ${{ runner.temp }}/lane_propose_receipt.json
          if-no-files-found: warn

  deliver:
    name: Deliver (trusted — verifies, then pushes)
    needs: propose
    if: needs.propose.outputs.status == 'READY_TO_DELIVER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # A FRESH checkout on a FRESH runner. Nothing the proposing job did to
      # its own machine — .git/config, PATH, a surviving descendant, a clean
      # filter — exists here. This is what the split buys, and it is bought
      # by the runner boundary, not by any check below.
      - name: Checkout default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0   # `git bundle verify` needs the prerequisite commits

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download delivery candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: lane-delivery-candidate
          path: ${{ runner.temp }}/candidate

      - name: Verify and deliver
        run: |
          set -uo pipefail
          git config user.name "hardening-lane"
          git config user.email "hardening-lane@users.noreply.github.com"
          set +e
          python3 scripts/runtime/lane_deliver.py \
            --repo "${GH_REPO}" \
            --bundle "${RUNNER_TEMP}/candidate/lane_delivery.bundle" \
            --propose-receipt "${RUNNER_TEMP}/candidate/lane_propose_receipt.json" \
            --receipt "${RUNNER_TEMP}/lane_deliver_receipt.json" \
            --base "${{ github.event.repository.default_branch }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}
          deliver_exit="$?"
          set -e
          {
            echo "## Hardening lane — deliver receipt"
            echo '```json'
            cat "${RUNNER_TEMP}/lane_deliver_receipt.json" 2>/dev/null \
              || echo '{"status": "NO_RECEIPT_WRITTEN"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${deliver_exit}"

      - name: Upload delivery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-deliver-receipt
          path: ${{ runner.temp }}/lane_deliver_receipt.json
          if-no-files-found: warn
