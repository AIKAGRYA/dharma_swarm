name: loop-ratchet-gates

'on':
  push:
    branches: [main, "ratchet/**", "governance/**"]
  pull_request:
    branches: [main, "promote/**", "governance/**", "ratchet/**"]
  merge_group:

concurrency:
  group: loop-ratchet-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  loop-ratchet-gates:
    name: Cybernetic loop ratchet gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dev package
        run: python -m pip install -e ".[dev]"

      - name: Select comparison refs
        id: refs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pytest collection (strict markers)
        run: PYTHONPATH=. python -m pytest --collect-only -q --strict-markers

      - name: Hygiene integrity
        run: PYTHONPATH=. python scripts/governance/hygiene/check_hygiene_integrity.py

      - name: Test hygiene
        run: PYTHONPATH=. python scripts/governance/check_test_hygiene.py

      - name: Module budget
        run: |
          PYTHONPATH=. python scripts/governance/check_module_budget.py \
            --base-ref "${{ steps.refs.outputs.base }}" \
            --head-ref "${{ steps.refs.outputs.head }}"

      - name: Repo xray
        run: PYTHONPATH=. python scripts/repo_xray.py --format json --write /tmp/repo_xray.json

      - name: Governance bundle
        run: make governance-all

      - name: Phase-0 F1 marker strictness ratchet
        id: phase0_f1_marker_strictness
        run: PYTHONPATH=. python -m pytest --collect-only -q --strict-markers

      - name: Phase-0 F2 property collection ratchet
        id: phase0_f2_property_collection
        run: PYTHONPATH=. python scripts/governance/check_property_collection.py

      - name: Phase-0 F3 importorskip allowlist ratchet
        id: phase0_f3_importorskip_allowlist
        run: PYTHONPATH=. python scripts/governance/check_importorskip_allowlist.py
