name: docops-autorefresh

# Self-healing feeder for the DocOps integrity gate.
#
# Problem this solves:
#   The "DocOps integrity gate" (docops.yml) is read-only. It can DETECT that a
#   PR's count-sensitive generated sections (file counts, test_def counts, module
#   counts, etc.) are stale, but it cannot REPAIR them. Because almost any PR that
#   adds or removes a file changes those counts, nearly every PR trips the gate and
#   then sits blocked until someone manually runs `--write-auto-sections` on the
#   branch. That manual step is what let the open-PR backlog grow.
#
# What this does (mechanical, non-judgmental — like pr-ci-health.yml):
#   On a PR, run the EXISTING writer (scripts/docops/check_docops_integrity.py
#   --write-auto-sections). If it rewrote any tracked file, commit the refreshed
#   counts back to the PR head branch with --force-with-lease. The read-only
#   docops gate then re-runs on the new commit and passes, so Merge Master Mike
#   can merge without a human touching counts.
#
# What this does NOT do:
#   - It does not merge anything (MMM owns merges).
#   - It adds no new writer (reuses the existing --write-auto-sections capability;
#     respects Axiom A2 — no duplicate implementations).
#   - It does not touch forks (skips PRs from forked repos, where it cannot push).
#   - It does not edit anything but the auto-generated count sections.

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to refresh (manual run)"
        required: false

concurrency:
  group: docops-autorefresh-${{ github.event.pull_request.number || github.event.inputs.pr || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autorefresh:
    name: DocOps count auto-refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip PRs from forks: GITHUB_TOKEN cannot push to a fork's head branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Check out the PR's head branch (not the merge ref) so we can commit back.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Refresh DocOps auto-generated count sections
        run: |
          set -euo pipefail
          # Reuse the existing writer. This rewrites only the auto-generated
          # count sections in the docs the gate governs.
          python3 scripts/docops/check_docops_integrity.py --write-auto-sections || true

      - name: Commit and push refreshed counts (only if changed)
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "DocOps counts already in sync — nothing to refresh."
            exit 0
          fi
          echo "DocOps counts were stale; committing refresh:"
          git status --porcelain
          git config user.name "docops-autorefresh-bot"
          git config user.email "docops-autorefresh-bot@users.noreply.github.com"
          git add -A
          git commit \
            -m "chore(docops): auto-refresh count-sensitive sections" \
            -m "Mechanical refresh of auto-generated DocOps count sections so the read-only DocOps integrity gate passes. Generated by docops-autorefresh.yml (reuses scripts/docops/check_docops_integrity.py --write-auto-sections). No hand-authored content changed."
          # Push back to the PR head branch. --force-with-lease is safe: if the
          # branch moved since checkout, we abort rather than clobber.
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}" --force-with-lease
