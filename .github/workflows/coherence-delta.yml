name: coherence-delta

on:
  pull_request:
    branches: [main, "promote/**", "governance/**", "codex/**"]
    types: [opened, edited, reopened, synchronize, ready_for_review]

concurrency:
  group: coherence-delta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  coherence-delta:
    name: Coherence Delta PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Coherence Delta fields
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/governance/check_pr_coherence_delta.py
