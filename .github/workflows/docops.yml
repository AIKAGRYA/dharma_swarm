name: docops-integrity

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:
  schedule:
    # Weekly freshness check for docs/docops/assertions.yaml ttl_days.
    - cron: "37 12 * * 1"
  workflow_dispatch:

concurrency:
  group: docops-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  docops-integrity:
    name: DocOps integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run DocOps gate
        run: |
          set -euo pipefail
          mkdir -p reports/docops

          # Generated counts (SOVEREIGN_MANIFEST assertions + AUTO_INVENTORY
          # auto-sections) are advisory on PRs: PRs no longer hand-commit them,
          # and docops-reconcile-main.yml reconciles them after each merge
          # (direct push with the bypass token, else a rolling bot PR). Every
          # other DocOps check (path guards, canonical guard, TTL staleness,
          # auto-section config, doc review) stays strict everywhere.
          #
          # The weekly schedule / manual dispatch run against main is STRICT on
          # counts: it is the floor that catches a rotted reconcile loop. (The
          # pre-2026-07-03 all-advisory version let main's counts stay stale for
          # weeks while the reconcile push was silently rejected 102 times.)
          args=(--report-json reports/docops/check.json)
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            args+=(--counts-advisory)
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            args+=(--changed-from "origin/${GITHUB_BASE_REF}")
          fi

          python3 scripts/docops/check_docops_integrity.py "${args[@]}"
          python3 scripts/governance/hygiene/check_hygiene_integrity.py

      - name: Write non-blocking corpus inventory
        if: always()
        run: |
          mkdir -p reports/docops
          python3 scripts/docops/check_docops_integrity.py \
            --inventory-only \
            --inventory-json reports/docops/corpus_inventory.json \
            --inventory-markdown reports/docops/corpus_inventory.md || true

      - name: Upload DocOps reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docops-reports
          path: reports/docops/
