name: tests

on:
  push:
    branches: [main, v2-gap-closure]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  # Which change classes does this PR touch? The advisory jobs below consult
  # this to skip work the diff cannot affect. `pytest` never does -- it carries
  # the two REQUIRED contexts, and a required check that does not run never
  # reports, which branch protection waits on forever.
  #
  # FAIL OPEN by construction. Every consumer tests `!= 'false'`, so an empty or
  # missing output -- this job failing, timing out, or being skipped -- runs the
  # job anyway. The only reachable failure is running too much.
  changes:
    name: classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.classify.outputs.go }}
      dashboard: ${{ steps.classify.outputs.dashboard }}
      terminal: ${{ steps.classify.outputs.terminal }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/classify_changed_paths.py

  go-adapter-contracts:
    needs: changes
    # Runs the Go harness AND tests/test_go_adapter_contracts.py, so a Python
    # change to the bridge must run it too.
    if: >-
      always() && (needs.changes.outputs.go != 'false'
      || needs.changes.outputs.python != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # One patch-level policy for every Go lane (WP-0H). Keep in lockstep
          # with go-evidence-ingestor; tests/test_polyglot_ci_contract.py
          # enforces the alignment and the go.mod compatibility.
          go-version: "1.26.3"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Go adapter contract harness
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOFLAGS: "-mod=readonly"
        run: make go-ci

      - name: Run adapter contract pytest wrapper
        run: python -m pytest -q tests/test_go_adapter_contracts.py

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The old step ran the full ruleset with `|| true` — a dead gate that
      # could never fail (2026-07-06 audit, C8). Correctness rules now BLOCK
      # (real bugs: syntax errors, undefined names). The full style ruleset
      # (237 pre-existing findings as of 2026-07-07) is deliberately NOT run
      # here: an advisory step inside this required job is the FALSE-GREEN
      # pattern check_ci_parity.py rejects, and a permanently-red optional
      # check is alarm fatigue. Burn the backlog down locally via
      # `ruff check dharma_swarm/ --select=E,F,W --ignore=E501,W291,W293`,
      # then widen this gate's --select.
      - name: Lint (ruff — blocking correctness rules)
        run: |
          pip install ruff
          ruff check dharma_swarm/ --select=E9,F63,F7,F82

      - name: Run tests (fast, no network)
        env:
          # Provide stub keys so provider init doesn't crash
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-stub' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-stub' }}
          TINY_ROUTER_BACKEND: heuristic
          DHARMA_EVOLUTION_SHADOW: "1"
          DGC_AUTONOMY_LEVEL: "0"
        run: |
          # pipefail so pytest's exit code (not tee's) determines the step
          # result. Without this, `pytest ... | tee` always exits 0 under the
          # default `bash -e {0}` shell and test failures never fail CI.
          # +e around the pipeline lets us still surface the count tail on
          # failure before re-exiting with pytest's real status.
          set -o pipefail
          set +e
          python -m pytest tests/ -q --tb=short \
            --timeout=30 \
            -m "not slow and not docker and not network" \
            2>&1 | tee pytest_output.txt
          status=${PIPESTATUS[0]}
          set -e
          # Surface pass/fail counts even on failure.
          tail -3 pytest_output.txt
          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: pytest_output.txt

  guardian-syntax-check:
    needs: changes
    if: always() && needs.changes.outputs.python != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Syntax check all modules (AUDITOR role)
        run: |
          python3 -c "
          import ast
          from pathlib import Path
          errors = []
          excluded = {'__pycache__', '.git', '.mypy_cache', '.pytest_cache', '.ruff_cache', '.tox', '.venv', 'build', 'dist', 'node_modules'}
          files = [
              f for f in sorted(Path('dharma_swarm').rglob('*.py'))
              if not any(part in excluded for part in f.parts)
          ]
          for f in files:
              try:
                  ast.parse(f.read_text())
              except SyntaxError as e:
                  errors.append(f'{f}:{e.lineno}: {e.msg}')
          if errors:
              print('SYNTAX ERRORS:')
              for e in errors:
                  print(f'  {e}')
              raise SystemExit(1)
          print(f'OK: {len(files)} files, 0 syntax errors')
          "

      - name: Check critical module imports
        # Fail-closed guardian import-smoke (AI-N1). Optional deps are
        # allowlisted by NAME from the dependency manifest, never by a
        # substring of the exception text; a missing critical module fails.
        run: python3 scripts/governance/guardian_import_smoke.py

  go-evidence-ingestor:
    needs: changes
    if: >-
      always() && (needs.changes.outputs.go != 'false'
      || needs.changes.outputs.python != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.3"

      - name: Run Go evidence sense-organ gates
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOFLAGS: "-mod=readonly"
        run: make go-ci

  dashboard:
    needs: changes
    if: always() && needs.changes.outputs.dashboard != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Exact Node pin (WP-0H): the dashboard manifest declares no engines
          # range, so the workflow is the version authority. Bump deliberately;
          # tests/test_polyglot_ci_contract.py rejects a floating major.
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        run: npm ci --legacy-peer-deps

      - name: Lint dashboard
        run: npm run lint -- --quiet

      - name: Build dashboard
        run: npm run build

  terminal:
    needs: changes
    if: always() && needs.changes.outputs.terminal != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The terminal cold-boot tests spawn `python3 -m
      # dharma_swarm.terminal_bridge`; without an importable dharma_swarm the
      # bridge dies, the app reports degraded instead of booting, and the
      # behavioral tests fail. Runtime deps (textual et al.) come from the
      # base extra.
      - name: Install terminal bridge (Python side)
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.20.2"

      # Pinned installer, no unpinned curl|bash. The exact bun version must
      # match the packageManager pin in terminal/package.json;
      # tests/test_polyglot_ci_contract.py enforces the lockstep.
      - name: Install pinned Bun
        run: npm install -g bun@1.3.11

      - name: Install terminal deps (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck terminal
        run: bun run typecheck

      - name: Run terminal behavioral tests
        run: bun test

  gauntlet-tier1:
    needs: changes
    if: always() && needs.changes.outputs.python != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run Gauntlet Tier 1 (correctness checks — no network, no LLM)
        env:
          TINY_ROUTER_BACKEND: heuristic
          DHARMA_EVOLUTION_SHADOW: "1"
          DGC_AUTONOMY_LEVEL: "0"
        run: |
          # Only run deterministic telos gate + internal correctness checks
          python3 -c "
          import asyncio, json, sys
          sys.path.insert(0, '.')
          sys.path.insert(0, 'benchmarks')

          async def main():
              from gauntlet import _t1_telos_gate_enforced, _t1_stigmergy_roundtrip
              results = await asyncio.gather(_t1_telos_gate_enforced(), _t1_stigmergy_roundtrip())
              failed = [r for r in results if not r.passed]
              for r in results:
                  status = 'PASS' if r.passed else 'FAIL'
                  print(f'  [{status}] {r.name}: {r.composite:.2f}')
                  if r.failure_mode:
                      print(f'    Failure: {r.failure_mode}')
              if failed:
                  print(f'GAUNTLET TIER 1 FAILED: {len(failed)}/{len(results)} tasks')
                  sys.exit(1)
              else:
                  print(f'GAUNTLET TIER 1 PASSED: {len(results)}/{len(results)} tasks')

          asyncio.run(main())
          "
