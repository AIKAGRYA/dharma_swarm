name: kernel-import-boundary

on:
  pull_request:
    paths:
      - "packages/telos-kernel/**"
      - "kernel/manifest.yaml"
      - ".github/workflows/kernel-import-boundary.yml"
  push:
    branches: [main]

jobs:
  boundary:
    name: TCB import & AST boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel package
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/telos-kernel
          pip install pytest pytest-timeout hypothesis
      - name: Run import-boundary tests
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_import_boundary.py -q
      - name: Run TCB LOC ceiling
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_tcb_loc.py -q -s
      - name: Run anti-metaphor check
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_no_metaphor_gates.py -q
