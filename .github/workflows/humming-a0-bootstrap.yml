name: humming-a0-bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: humming-a0-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/humming-v2-a0-portfolio-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: codex/humming-v2-a0-portfolio-admission
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Confine tool state outside checkout
        run: |
          set -euo pipefail
          bootstrap="${RUNNER_TEMP}/humming-a0"
          mkdir -p "${bootstrap}"/{pycache,xdg,ruff,pip,hypothesis,ops,package-source}
          printf '%s\n' \
            "PYTHONPYCACHEPREFIX=${bootstrap}/pycache" \
            "XDG_CACHE_HOME=${bootstrap}/xdg" \
            "RUFF_CACHE_DIR=${bootstrap}/ruff" \
            "PIP_CACHE_DIR=${bootstrap}/pip" \
            "HYPOTHESIS_STORAGE_DIRECTORY=${bootstrap}/hypothesis" \
            "DHARMA_OPS_DIR=${bootstrap}/ops" \
            >> "${GITHUB_ENV}"

      - name: Install exact-base package and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          install_source="${RUNNER_TEMP}/humming-a0/package-source"
          git archive --format=tar HEAD^^ | tar -xf - -C "${install_source}"
          python -m pip install "${install_source}[dev]"

      - name: Verify untouched current-main session boundary
        run: |
          set -euo pipefail
          git status --short
          test "$(git rev-parse HEAD^^)" = "e1c5dffda158b9f2590567880b8278ee44437e87"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "e1c5dffda158b9f2590567880b8278ee44437e87"
          base_worktree="${RUNNER_TEMP}/humming-a0-base"
          git worktree add --detach "${base_worktree}" HEAD^^
          (
            cd "${base_worktree}"
            make onboard
            make organism-status
            if grep -Eq '^[[:space:]]*orient:' Makefile; then make orient; fi
          )
          git worktree remove "${base_worktree}"

      - name: Execute exact A0 admission transform
        env:
          HUMMING_A0_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/governance/humming_a0_bootstrap.py
          python scripts/governance/humming_a0_bootstrap.py

      - name: Regenerate governed projections
        run: |
          set -euo pipefail
          python scripts/governance/render_active_track_includes.py
          python scripts/docops/check_docops_integrity.py --write-auto-sections --write-manifest-counts

      - name: Run A0 governance evidence
        run: |
          set -euo pipefail
          python scripts/governance/check_track_status.py
          python scripts/governance/render_active_track_includes.py --check
          python scripts/docops/check_docops_integrity.py
          python -m pytest -q \
            tests/test_active_track_governance.py \
            tests/test_track_portfolio.py \
            tests/test_track_closure_rigor.py \
            tests/test_claim_evidence_binding.py \
            tests/test_docops_integrity.py
          git diff --check

      - name: Enforce final bootstrap scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'docs/governance/ACTIVE_TRACK.yaml',
              'CLAUDE.md',
              'docs/governance/SOVEREIGN_MANIFEST.md',
              'docs/docops/AUTO_INVENTORY.md',
              'docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          missing = sorted({
              'docs/governance/ACTIVE_TRACK.yaml',
              'docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md',
          } - changed)
          if unexpected or missing:
              raise SystemExit(
                  f'bootstrap scope mismatch: unexpected={unexpected} missing={missing}'
              )
          print('A0 bootstrap scope:', *sorted(changed), sep='\n- ')
          PY

      - name: Commit and publish generated A0 governance state
        run: |
          set -euo pipefail
          git config user.name 'humming-a0-bootstrap[bot]'
          git config user.email 'humming-a0-bootstrap[bot]@users.noreply.github.com'
          git add -- \
            docs/governance/ACTIVE_TRACK.yaml \
            CLAUDE.md \
            docs/governance/SOVEREIGN_MANIFEST.md \
            docs/docops/AUTO_INVENTORY.md \
            docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md
          git diff --cached --check
          git commit -m 'governance(humming): admit V2 P0 surfaces across existing tracks [impact-checked]'
          git push origin HEAD:codex/humming-v2-a0-portfolio-admission
