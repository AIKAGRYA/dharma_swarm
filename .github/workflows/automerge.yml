name: automerge

# Fully automated merge lane for clean bot PRs and simple human PRs.
#
# When a PR carries the `automerge` or `bot-pr` label, this workflow watches
# for the moment ALL status checks are green and no review requests changes,
# then dispatches the existing Merge Master Mike router
# (codex-mention-router.yml) with merge_when_clean=true.
#
# Guard rails:
#   - Mike's deterministic gate still runs required CI, fourfold-warrant,
#     unresolved review threads, and reviewer receipts before auto-merge is armed.
#   - Advisory governance signals (Coherence Delta / ACTIVE_TRACK) are ignored
#     by this raw green-check filter; they continue to report in CI Truth.
#   - This workflow never merges directly; it only asks Mike.
#   - Draft PRs and PRs with CHANGES_REQUESTED are never dispatched.
#   - One dispatch per readiness fingerprint, so later reviews/receipt comments
#     can re-dispatch the same head SHA if Mike previously blocked.
#
# Opting in:
#   gh pr edit <N> --add-label automerge      # human PRs
#   Bot lanes should label their PRs `bot-pr` at creation time.
#
# Auto-enrollment (no manual labeling needed):
#   PRs authored by bots (login ends in `[bot]`, is_bot, or `Copilot`) and PRs
#   whose title carries an automation marker (`[automated]` / `[auto]`) are
#   automatically given the `bot-pr` label by the enroll step below, so they
#   enter this lane without anyone remembering to label them. Remove the label
#   to opt a PR out.

on:
  pull_request:
    types: [opened, reopened, labeled, ready_for_review]
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "45 * * * *"  # hourly sweep: catches anything the events missed
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate (optional; default = sweep all labeled PRs)"
        required: false

concurrency:
  group: automerge
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  evaluate:
    name: Evaluate and dispatch auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # PAT (contents+PR+actions write) used ONLY to dispatch the router
      # workflow. A run triggered by the built-in GITHUB_TOKEN cannot create
      # a new workflow run, so the router dispatch below silently no-ops and
      # Mike's merge arm never fires. Falls back to GITHUB_TOKEN when unset
      # (dispatch stays a no-op until the MIKE_PAT secret is added).
      MIKE_PAT: ${{ secrets.MIKE_PAT }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number || github.event.inputs.pr || '' }}
      CHECK_SUITE_SHA: ${{ github.event.check_suite.head_sha || '' }}
    steps:
      - name: Auto-enroll bot and automated PRs
        run: |
          set -euo pipefail
          # Apply `bot-pr` to every open PR that is bot-authored or carries an
          # automation marker in its title but has no opt-in label yet, so the
          # lane engages without manual labeling. Drafts are still never
          # dispatched (step below), and removing the label opts a PR out
          # permanently for that evaluation pass.
          gh pr list --repo "$GH_REPO" --state open --limit 200 \
            --json number,title,labels,author \
            --jq '.[]
              | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr") | not)
              | select(
                  (.author.is_bot == true)
                  or (.author.login | test("\\[bot\\]$"))
                  or (.author.login == "Copilot")
                  or (.title | ascii_downcase | test("\\[automated\\]|\\[auto\\]"))
                )
              | .number' > /tmp/enroll.txt || true
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "Auto-enrolling #${pr} with bot-pr label"
            gh pr edit "$pr" --repo "$GH_REPO" --add-label bot-pr || true
          done < /tmp/enroll.txt

          # D4 (track merge-master-mike-d4): engage Mike on EVERY open non-draft
          # PR that has no lane label yet, via `mike-watch`. Unlike `bot-pr`,
          # mike-watch does NOT waive the reviewer quorum — it only makes Mike
          # run the deterministic gate and post status (arm-don't-merge). This is
          # the proactive-coverage half of always-on Mike; remove the label to
          # opt a PR out.
          gh label create mike-watch --repo "$GH_REPO" \
            --color BFD4F2 \
            --description "Mike evaluates + gates this PR (no auto-merge, no reviewer waiver)" \
            >/dev/null 2>&1 || true
          gh pr list --repo "$GH_REPO" --state open --limit 200 \
            --json number,isDraft,labels \
            --jq '.[]
              | select(.isDraft | not)
              | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-watch") | not)
              | .number' > /tmp/watch.txt || true
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "Auto-enrolling #${pr} with mike-watch label"
            gh pr edit "$pr" --repo "$GH_REPO" --add-label mike-watch || true
          done < /tmp/watch.txt

      - name: Build candidate PR list
        id: candidates
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR}" ]; then
            echo "${EVENT_PR}" > /tmp/candidates.txt
          elif [ -n "${CHECK_SUITE_SHA}" ]; then
            # check_suite carries no PR context when the suite belongs to a
            # branch; resolve open PRs by head SHA.
            gh pr list --repo "$GH_REPO" --state open --limit 200 \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"${CHECK_SUITE_SHA}\") | .number" \
              > /tmp/candidates.txt
          else
            # Scheduled sweep: every open PR carrying a lane label
            # (automerge / bot-pr = unattended; mike-watch = gate+status only).
            gh pr list --repo "$GH_REPO" --state open --limit 200 \
              --json number,labels \
              --jq '.[] | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-watch")) | .number' \
              > /tmp/candidates.txt
          fi
          echo "Candidates:"
          cat /tmp/candidates.txt || true

      - name: Evaluate candidates and dispatch Mike
        run: |
          set -euo pipefail
          dispatched=0
          skipped=0
          summary="## Automerge Lane\n\n"

          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            view="$(gh pr view "$pr" --repo "$GH_REPO" \
              --json number,isDraft,labels,reviewDecision,headRefOid,mergeable,statusCheckRollup,comments,latestReviews)"

            # 1. Lane label required. automerge/bot-pr => unattended auto-merge;
            #    mike-watch => Mike gates and posts status but never auto-merges
            #    (the operator arms it by adding `automerge` or commenting @mike).
            labeled="$(echo "$view" | jq -r '.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-watch")')"
            if [ "$labeled" != "true" ]; then
              skipped=$((skipped + 1)); continue
            fi
            merge_when_clean="$(echo "$view" | jq -r 'if (.labels | map(.name) | any(. == "automerge" or . == "bot-pr")) then "true" else "false" end')"

            # 2. Never drafts, never CHANGES_REQUESTED
            is_draft="$(echo "$view" | jq -r '.isDraft')"
            decision="$(echo "$view" | jq -r '.reviewDecision // ""')"
            if [ "$is_draft" = "true" ] || [ "$decision" = "CHANGES_REQUESTED" ]; then
              summary+="- #${pr}: skipped (draft=${is_draft}, reviewDecision=${decision})\n"
              skipped=$((skipped + 1)); continue
            fi

            # 3. Required checks must be completed and green. Ignore this
            #    workflow plus governance checks that are advisory signals.
            not_green="$(echo "$view" | jq -r '
              [ .statusCheckRollup[]?
                | select((.name // .context // .workflowName // "") | test("automerge") | not)
                | select((.name // .context // .workflowName // "")
                    | IN("ACTIVE_TRACK governance gate", "active-track-governance",
                         "Coherence Delta PR body", "coherence-delta") | not)
                | select(
                    ((.status // "COMPLETED") != "COMPLETED")
                    or (((.conclusion // .state // "") | ascii_upcase)
                        | IN("SUCCESS","NEUTRAL","SKIPPED","") | not)
                  )
              ] | length')"
            if [ "$not_green" != "0" ]; then
              summary+="- #${pr}: skipped (${not_green} checks not green/completed)\n"
              skipped=$((skipped + 1)); continue
            fi

            # 4. One dispatch per readiness fingerprint. Mike may block on
            #    reviewer receipts or unresolved threads that arrive after
            #    checks first turn green; include review/comment/check counts
            #    so those later state changes can re-dispatch this head SHA.
            sha="$(echo "$view" | jq -r '.headRefOid')"
            ready_key="$(echo "$view" | jq -r '
              [
                .headRefOid,
                (.reviewDecision // ""),
                ([.statusCheckRollup[]?] | length | tostring),
                ([.comments[]?] | length | tostring),
                ([.latestReviews[]?] | length | tostring)
              ] | join(":")')"
            # Include the merge intent so flipping mike-watch -> automerge (or
            # back) re-dispatches instead of being deduped on an unchanged SHA.
            ready_key="${ready_key}:mwc=${merge_when_clean}"
            marker="<!-- automerge-dispatch:${ready_key} -->"
            already="$(echo "$view" | jq -r --arg m "$marker" \
              '[.comments[]? | select(.body | startswith($m))] | length')"
            if [ "$already" != "0" ]; then
              summary+="- #${pr}: already dispatched for readiness key ${ready_key}\n"
              skipped=$((skipped + 1)); continue
            fi

            # 5. Hand off to Merge Master Mike (full deterministic gate runs
            #    there; auto-merge is armed only when merge_when_clean=true).
            #    Dispatch with MIKE_PAT so the router run is actually created;
            #    a GITHUB_TOKEN-triggered workflow_dispatch does not spawn one.
            GH_TOKEN="${MIKE_PAT:-$GH_TOKEN}" gh workflow run codex-mention-router.yml --repo "$GH_REPO" \
              -f pr="$pr" -f merge_when_clean="${merge_when_clean}"
            if [ "${merge_when_clean}" = "true" ]; then
              mode_line="dispatched **Merge Master Mike** with \`merge_when_clean: true\` (will auto-merge once the gate is clean)"
            else
              mode_line="dispatched **Merge Master Mike** in \`mike-watch\` mode (\`merge_when_clean: false\`): Mike runs the full gate and posts status but will NOT auto-merge — add the \`automerge\` label or comment \`@mike merge\` to arm it"
            fi
            gh pr comment "$pr" --repo "$GH_REPO" --body "${marker}
          ## 🟢 Automerge lane engaged

          All status checks are green and no review requests changes, so the
          automerge lane ${mode_line} for head \`${sha}\`.

          Mike still runs the full deterministic gate (fourfold-warrant,
          reviewer receipts, unresolved threads, and required CI before any
          merge is armed. Coherence Delta / ACTIVE_TRACK remain advisory. This dispatch marker is keyed to readiness state
          \`${ready_key}\`; later review/comment/check changes can dispatch
          again for the same head SHA. Remove the \`automerge\`/\`bot-pr\`/\`mike-watch\`
          label to leave this lane." || true
            summary+="- #${pr}: **dispatched** Mike (merge_when_clean=${merge_when_clean}) for readiness key ${ready_key}\n"
            dispatched=$((dispatched + 1))
          done < /tmp/candidates.txt

          summary+="\n**Summary:** ${dispatched} dispatched, ${skipped} skipped\n"
          echo -e "$summary" >> "$GITHUB_STEP_SUMMARY"
