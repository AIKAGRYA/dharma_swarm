name: automerge

# Evidence-dispatch lane for clean bot PRs and simple human PRs.
#
# When a PR carries the `automerge` or `bot-pr` label, this workflow watches
# for the moment ALL status checks are green and no review requests changes,
# then dispatches the existing Merge Master Mike router
# (codex-mention-router.yml) with merge_when_clean=true.
#
# Guard rails:
#   - Mike's deterministic gate still runs required CI, typed policy evidence,
#     unresolved review threads, and reviewer receipts.
#   - Safe P0 cannot construct authenticated MergeAuthorized or a server-side
#     base-CAS proof, so this lane does not currently actuate merges.
#   - The green filter loads the expected branch-protection required set from
#     scripts/governance/ci_parity_manifest.json. A missing, malformed, empty,
#     or duplicate required set fails the job closed.
#   - A required check that has not reported on the head SHA is NOT green, and
#     no other reporting check is exempted as advisory.
#   - Large or hot-path PRs are always demoted to gate-and-status (mike-watch
#     behavior). This dispatcher cannot construct operator authority from a
#     mutable label or aggregate review state.
#   - This workflow never merges directly; it only asks Mike.
#   - Draft PRs and PRs with CHANGES_REQUESTED are never dispatched.
#   - One dispatch per readiness fingerprint, so later reviews/receipt comments
#     can re-dispatch the same head SHA if Mike previously blocked.
#
# Opting in:
#   gh pr edit <N> --add-label automerge      # human PRs
#   Bot lanes should label their PRs `bot-pr` at creation time.
#
# Auto-enrollment (no manual labeling needed):
#   PRs authored by real bot accounts (login ends in `[bot]`, is_bot, or
#   `Copilot`) are automatically given the `bot-pr` label by the enroll step
#   below. Title markers (`[automated]` / `[auto]`) do not grant `bot-pr`, and
#   no lane label grants reviewer or merge authority. Title-marked agent PRs
#   still get `mike-watch` coverage from the D4 step. Apply `mike-disabled` for
#   a durable operator opt-out.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, synchronize, ready_for_review, converted_to_draft, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    # Required checks have no safe generic completion event here. A bounded
    # de-stamped sweep keeps CI-green latency under ten minutes.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate (optional; default = sweep all labeled PRs)"
        required: false

concurrency:
  # PR/review events serialize only against the same PR. A targeted manual
  # dispatch shares that shard; untargeted sweeps share an event-name shard.
  # Superseded evaluations cancel instead of building an unbounded queue.
  group: automerge-${{ github.event.pull_request.number || github.event.inputs.pr || github.event_name }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  evaluate:
    name: Evaluate and dispatch auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      # Unattended-merge ceiling: above this many changed files, or touching a
      # hot path from this narrow dispatcher list, the lane remains
      # gate-and-status. The downstream v3 tier policy is the authoritative
      # classifier for workflow/governance/security and other operator-only
      # surfaces; this inline list is only an early demotion optimization.
      MAX_UNATTENDED_FILES: "25"
      HOT_PATHS: ".pre-commit-config.yaml,api/main.py,api/routers/chat.py,api/ws.py,dharma_swarm/agent_runner.py,dharma_swarm/dgc_cli.py,dharma_swarm/orchestrator.py,dharma_swarm/runtime_state.py,dharma_swarm/swarm.py,dharma_swarm/telic_seam.py"
      OPT_OUT_LABEL: "mike-disabled"
      # PAT (contents+PR+actions write) used ONLY to dispatch the router
      # workflow. A run triggered by the built-in GITHUB_TOKEN cannot create
      # a new workflow run, so the router dispatch below silently no-ops and
      # Mike's merge arm never fires. Falls back to GITHUB_TOKEN when unset.
      # Secret is named MERGEMASTERMIKE_PAT (not MIKE_PAT) in this repo --
      # verified via `gh secret list`; a prior fix (#756) referenced the
      # wrong name and shipped an inert no-op.
      MIKE_PAT: ${{ secrets.MERGEMASTERMIKE_PAT }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PR: ${{ github.event.pull_request.number || github.event.inputs.pr || '' }}
    steps:
      - name: Halt on loop kill-switch
        run: |
          set -euo pipefail
          # Loop kill-switch (docs/ops/loop_control/README.md): file present on
          # the loop-control branch => HALT (exit 1, red-while-halted); absent
          # (404 on file or branch) => proceed; any other error => fail closed.
          url="repos/${GH_REPO}/contents/docs/ops/loop_control/KILLSWITCH?ref=loop-control"
          if response="$(gh api "$url" 2>&1)"; then
            echo "HALTED BY KILLSWITCH (docs/ops/loop_control/KILLSWITCH on loop-control)" >&2
            echo "## 🔴 HALTED BY KILLSWITCH — no evaluation, no dispatch" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif echo "$response" | grep -qiE "HTTP 404|\"status\": *\"404\"|Not Found|No commit found"; then
            echo "kill-switch absent; proceeding"
          else
            echo "kill-switch state UNKNOWN — failing closed: $response" >&2
            exit 1
          fi

      # Load policy data from the trusted default branch, never candidate PR
      # code: this privileged job carries write permissions and a dispatch PAT.
      - name: Checkout trusted automerge policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Load manifest-driven required contexts
        id: required_contexts
        run: |
          set -euo pipefail
          required_checks="$(jq -ce '
            if type != "object" or .schema != "ci-parity-guard/v1" then
              error("CI parity manifest schema must be ci-parity-guard/v1")
            elif (.required_contexts | type) != "array" or (.required_contexts | length) == 0 then
              error("CI parity manifest required_contexts must be a non-empty array")
            elif any(.required_contexts[];
              try (
                (.context | type) != "string"
                or (.context | test("^\\s*$"))
                or (.context != (.context | sub("^\\s+"; "") | sub("\\s+$"; "")))
              ) catch true
            ) then
              error("CI parity manifest contexts must be non-blank trimmed strings")
            elif ([.required_contexts[].context] | length)
              != ([.required_contexts[].context] | unique | length) then
              error("CI parity manifest required contexts must be unique")
            else
              [.required_contexts[].context]
            end
          ' scripts/governance/ci_parity_manifest.json)"
          echo "required_checks=${required_checks}" >> "$GITHUB_OUTPUT"

      - name: Auto-enroll bot and automated PRs
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Apply `bot-pr` to every open PR that is bot-authored but has no
          # lane label yet. `bot-pr` is routing metadata only and grants no
          # review or merge authority. `mike-disabled` is a durable operator
          # opt-out and is never auto-removed.
          gh pr list --repo "$GH_REPO" --state open --limit 200 \
            --json number,title,labels,author \
            --jq '.[]
              | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-disabled") | not)
              | select(
                  (.author.is_bot == true)
                  or (.author.login | test("\\[bot\\]$"))
                  or (.author.login == "Copilot")
                )
              | .number' > /tmp/enroll.txt || true
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "Auto-enrolling #${pr} with bot-pr label"
            gh pr edit "$pr" --repo "$GH_REPO" --add-label bot-pr || true
          done < /tmp/enroll.txt

          # D4 (track merge-master-mike-d4): engage Mike on EVERY open non-draft
          # PR that has no lane label yet, via `mike-watch`. Unlike `bot-pr`,
          # mike-watch only selects deterministic gate/status evaluation. It
          # grants no reviewer waiver or merge authority. Apply mike-disabled
          # for an explicit durable opt-out.
          gh label create mike-watch --repo "$GH_REPO" \
            --color BFD4F2 \
            --description "Mike evaluates + gates this PR (no auto-merge, no reviewer waiver)" \
            >/dev/null 2>&1 || true
          gh pr list --repo "$GH_REPO" --state open --limit 200 \
            --json number,isDraft,labels \
            --jq '.[]
              | select(.isDraft | not)
              | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-watch" or . == "mike-disabled") | not)
              | .number' > /tmp/watch.txt || true
          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            echo "Auto-enrolling #${pr} with mike-watch label"
            gh pr edit "$pr" --repo "$GH_REPO" --add-label mike-watch || true
          done < /tmp/watch.txt

      - name: Build candidate PR list
        id: candidates
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR}" ]; then
            echo "${EVENT_PR}" > /tmp/candidates.txt
          else
            # Scheduled sweep: every open PR carrying a lane label
            # (automerge / bot-pr = unattended; mike-watch = gate+status only).
            gh pr list --repo "$GH_REPO" --state open --limit 200 \
              --json number,labels \
              --jq '.[] | select(.labels | map(.name) | any(. == "mike-disabled") | not) | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-watch")) | .number' \
              > /tmp/candidates.txt
          fi
          echo "Candidates:"
          cat /tmp/candidates.txt || true

      - name: Evaluate candidates and dispatch Mike
        env:
          REQUIRED_CHECKS_JSON: ${{ steps.required_contexts.outputs.required_checks }}
        run: |
          set -euo pipefail
          dispatched=0
          skipped=0
          summary="## Automerge Lane\n\n"

          while IFS= read -r pr; do
            [ -z "$pr" ] && continue
            view="$(gh pr view "$pr" --repo "$GH_REPO" \
              --json number,title,body,isDraft,labels,reviewDecision,baseRefName,baseRefOid,headRefOid,mergeable,statusCheckRollup,latestReviews)"

            # 1. Lane label required. automerge/bot-pr => unattended auto-merge;
            #    mike-watch => Mike gates and posts status but never auto-merges
            #    (the operator arms it by adding `automerge` or commenting @mike).
            opted_out="$(echo "$view" | jq -r --arg label "$OPT_OUT_LABEL" '.labels | map(.name) | any(. == $label)')"
            labeled="$(echo "$view" | jq -r '.labels | map(.name) | any(. == "automerge" or . == "bot-pr" or . == "mike-watch")')"
            if [ "$opted_out" = "true" ]; then
              summary+="- #${pr}: skipped (explicit ${OPT_OUT_LABEL} operator opt-out)\n"
              skipped=$((skipped + 1)); continue
            fi
            if [ "$labeled" != "true" ]; then
              skipped=$((skipped + 1)); continue
            fi
            merge_when_clean="$(echo "$view" | jq -r 'if (.labels | map(.name) | any(. == "automerge" or . == "bot-pr")) then "true" else "false" end')"

            # 2. Never drafts, never CHANGES_REQUESTED
            is_draft="$(echo "$view" | jq -r '.isDraft')"
            decision="$(echo "$view" | jq -r '.reviewDecision // ""')"
            if [ "$is_draft" = "true" ] || [ "$decision" = "CHANGES_REQUESTED" ]; then
              summary+="- #${pr}: skipped (draft=${is_draft}, reviewDecision=${decision})\n"
              skipped=$((skipped + 1)); continue
            fi

            # 2b. Size / hot-path demotion: large or hot-path PRs always stay
            #     gate-and-status. This workflow has no authority constructor;
            #     exact-head operator warrants are verified inside Mike.
            demotion=""
            if [ "${merge_when_clean}" = "true" ]; then
              changed="$(gh pr view "$pr" --repo "$GH_REPO" --json changedFiles --jq '.changedFiles')"
              gh api "repos/${GH_REPO}/pulls/${pr}/files" --paginate --jq '.[].filename' > /tmp/files.txt
              hot="$(grep -Fx -f <(tr ',' '\n' <<< "$HOT_PATHS") /tmp/files.txt | paste -sd, - || true)"
              if [ "${changed}" -gt "${MAX_UNATTENDED_FILES}" ] || [ -n "${hot}" ]; then
                merge_when_clean=false
                demotion="demoted to gate-and-status: ${changed} files (ceiling ${MAX_UNATTENDED_FILES}), hot paths [${hot:-none}]; this dispatcher cannot arm unattended merge for this risk class"
              fi
            fi

            # 3. Evaluate the manifest-declared required checks on the head SHA
            #    and assert that exact branch-protection set is PRESENT and
            #    green. Other reporting checks remain visible evidence but do
            #    not acquire merge authority merely by existing.
            #    Absence is NOT green (an empty rollup used to read as "all
            #    status checks are green" — the 2026-07-04 incident).
            echo "$view" | jq '
              [ (.statusCheckRollup // []) | to_entries[]
                | .key as $ordinal
                | .value
                | {name: (.name // .context // .workflowName // "unnamed"),
                   observed_at: (.startedAt // .completedAt // ""),
                   ordinal: $ordinal,
                   state: (if ((.status // "COMPLETED") != "COMPLETED") then "PENDING"
                           else (((.conclusion // .state // "") | ascii_upcase)
                                 | if . == "" then "NO_CONCLUSION" else . end) end)}
              ]
              | sort_by(.name, .observed_at, .ordinal)
              | group_by(.name)
              | map(last | del(.observed_at, .ordinal))
            ' > /tmp/checks.json
            missing_required="$(jq -r --argjson req "$REQUIRED_CHECKS_JSON" \
              '($req - [.[].name]) | join(", ")' /tmp/checks.json)"
            required_not_green="$(jq -r --argjson req "$REQUIRED_CHECKS_JSON" '
              [ .[] | select(.name as $name | $req | index($name))
                | select(.state | IN("SUCCESS","NEUTRAL","SKIPPED") | not)
              ] | map("\(.name)=\(.state)") | join(", ")' /tmp/checks.json)"
            if [ -n "$required_not_green" ] || [ -n "$missing_required" ]; then
              summary+="- #${pr}: skipped (required not green: ${required_not_green:-none}; required not reported: ${missing_required:-none})\n"
              skipped=$((skipped + 1)); continue
            fi
            evaluated="$(jq -r '[.[] | "`\(.name)`=\(.state)"] | join(", ")' /tmp/checks.json)"

            # 4. One dispatch per exact gate-input fingerprint. Counts are not
            #    sufficient: fail->success, dismissed->approved, or
            #    unresolved->resolved can preserve a count and used to strand
            #    the PR behind a durable marker. Gather complete thread state
            #    (fail closed on pagination) and hash canonical semantic rows.
            sha="$(echo "$view" | jq -r '.headRefOid')"
            owner="${GH_REPO%%/*}"
            name="${GH_REPO#*/}"
            if ! thread_payload="$(gh api graphql --paginate \
              -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100,after:$endCursor){nodes{id isResolved isOutdated} pageInfo{hasNextPage endCursor}}}}}' \
              -F owner="$owner" -F name="$name" -F number="$pr")"; then
              summary+="- #${pr}: skipped (review-thread query failed)\n"
              skipped=$((skipped + 1)); continue
            fi
            thread_state="$(echo "$thread_payload" | jq -sce \
              'if any(.[]; .data.repository.pullRequest.reviewThreads == null) then
                 error("review-thread state unavailable")
               else [.[].data.repository.pullRequest.reviewThreads.nodes[]
                 | {id,isResolved,isOutdated}] | unique_by(.id) | sort_by(.id) end' \
              2>/dev/null || true)"
            if [ -z "$thread_state" ]; then
              summary+="- #${pr}: skipped (complete review-thread state unavailable)\n"
              skipped=$((skipped + 1)); continue
            fi
            if ! comment_payload="$(gh api \
              "repos/${GH_REPO}/issues/${pr}/comments?per_page=100" \
              --paginate --slurp)"; then
              summary+="- #${pr}: skipped (complete comment state unavailable)\n"
              skipped=$((skipped + 1)); continue
            fi
            comment_state="$(echo "$comment_payload" | jq -ce '
              [ .[][] | {
                id, login:(.user.login // ""), body:(.body // ""),
                created_at:(.created_at // ""), updated_at:(.updated_at // "")
              }] | sort_by(.id)' 2>/dev/null || true)"
            if [ -z "$comment_state" ]; then
              summary+="- #${pr}: skipped (complete comment state malformed)\n"
              skipped=$((skipped + 1)); continue
            fi
            controller_sha="$(git rev-parse HEAD)"
            policy_sha="$(sha256sum scripts/governance/automerge_tier_policy.json | awk '{print $1}')"
            ci_manifest_sha="$(sha256sum scripts/governance/ci_parity_manifest.json | awk '{print $1}')"
            gate_input="$(jq -cn \
              --argjson view "$view" \
              --slurpfile checks /tmp/checks.json \
              --argjson threads "$thread_state" \
              --argjson comments "$comment_state" \
              --arg controller_sha "$controller_sha" \
              --arg policy_sha "$policy_sha" \
              --arg ci_manifest_sha "$ci_manifest_sha" \
              --argjson merge_when_clean "$merge_when_clean" '
              {
                schema: "dharma.automerge_dispatch_input.v2",
                controller_sha: $controller_sha,
                policy_sha256: $policy_sha,
                ci_manifest_sha256: $ci_manifest_sha,
                head_sha: $view.headRefOid,
                base_sha: $view.baseRefOid,
                base_ref: $view.baseRefName,
                title: ($view.title // ""),
                body: ($view.body // ""),
                draft: $view.isDraft,
                mergeable: ($view.mergeable // "UNKNOWN"),
                review_decision: ($view.reviewDecision // ""),
                labels: ([$view.labels[]?.name] | sort),
                checks: ($checks[0] | sort_by(.name,.state)),
                reviews: ([$view.latestReviews[]? | {
                  login: (.author.login // ""),
                  state: (.state // ""),
                  body: (.body // ""),
                  submitted_at: (.submittedAt // "")
                }] | sort_by(.login,.submitted_at,.state,.body)),
                comments: ([$comments[]
                  | select(.body | test("automerge-dispatch|dharma-pr-review-control") | not)]),
                threads: $threads,
                merge_when_clean: $merge_when_clean
              }')"
            ready_key="$(printf '%s' "$gate_input" | sha256sum | awk '{print $1}')"
            marker="<!-- automerge-dispatch:${ready_key} -->"
            already="$(echo "$comment_state" | jq -r --arg m "$marker" \
              '[.[] | select(.login == "github-actions[bot]") | select(.body | startswith($m))] | length')"
            if [ "$already" != "0" ]; then
              summary+="- #${pr}: already dispatched for readiness key ${ready_key}\n"
              skipped=$((skipped + 1)); continue
            fi

            # 5. Hand off to Merge Master Mike (full deterministic gate runs
            #    there; auto-merge is armed only when merge_when_clean=true).
            #    Dispatch with MIKE_PAT so the router run is actually created;
            #    a GITHUB_TOKEN-triggered workflow_dispatch does not spawn one.
            GH_TOKEN="${MIKE_PAT:-$GH_TOKEN}" gh workflow run codex-mention-router.yml --repo "$GH_REPO" \
              -f pr="$pr" -f merge_when_clean="${merge_when_clean}"
            if [ "${merge_when_clean}" = "true" ]; then
              mode_line="dispatched **Merge Master Mike** with \`merge_when_clean: true\` to gather typed current-head authorization evidence; safe-P0 actuation remains disabled until authenticated authority and server-side base-CAS proofs are live"
            else
              mode_line="dispatched **Merge Master Mike** in \`mike-watch\` mode (\`merge_when_clean: false\`): Mike runs the full gate and posts status but will NOT auto-merge"
            fi
            gh pr comment "$pr" --repo "$GH_REPO" --body "${marker}
          ## 🟢 Automerge lane engaged

          Checks evaluated on head \`${sha}\` (every reporting check named;
          required set from \`scripts/governance/ci_parity_manifest.json\`
          \`${REQUIRED_CHECKS_JSON}\` verified present):
          ${evaluated}
          Non-required checks remain visible but do not gain merge authority.
          No review requests changes.
          ${demotion:+**Note:** ${demotion}}
          The automerge lane ${mode_line}.

          Mike still runs the full deterministic gate (typed policy evidence,
          reviewer receipts, unresolved threads, and required CI). This
          dispatch marker is keyed to exact gate-input state
          \`${ready_key}\`; later review/comment/check changes can dispatch
          again for the same head SHA. Apply \`mike-disabled\` for a durable
          operator opt-out." || true
            summary+="- #${pr}: **dispatched** Mike (merge_when_clean=${merge_when_clean}) for readiness key ${ready_key}\n"
            dispatched=$((dispatched + 1))
          done < /tmp/candidates.txt

          summary+="\n**Summary:** ${dispatched} dispatched, ${skipped} skipped\n"
          echo -e "$summary" >> "$GITHUB_STEP_SUMMARY"
