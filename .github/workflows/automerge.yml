name: automerge

# Narrow auto-merge dispatcher for low-risk generated/docs PRs.
#
# This workflow never merges directly. It only dispatches the existing
# Merge Master Mike router with merge_when_clean=true and required_reviewers=none
# after a labeled PR is already green and its changed files are limited to
# docs/report projections. Mike still runs the deterministic gate and then uses
# gh pr merge --auto with head-commit matching.

on:
  pull_request:
    types: [labeled, ready_for_review, synchronize, reopened]
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number; omit to sweep all labeled candidates"
        required: false
        type: string

concurrency:
  group: automerge
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: read

jobs:
  dispatch-docs-low:
    name: Dispatch Mike for docs-low automerge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EVENT_PR: ${{ github.event.pull_request.number || inputs.pr || '' }}
      CHECK_SUITE_SHA: ${{ github.event.check_suite.head_sha || '' }}
    steps:
      - name: Build candidate list
        run: |
          set -euo pipefail
          if [ -n "${EVENT_PR}" ]; then
            printf '%s\n' "${EVENT_PR}" > /tmp/automerge-candidates.txt
          elif [ -n "${CHECK_SUITE_SHA}" ]; then
            gh pr list --repo "${GH_REPO}" --state open --limit 200 \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"${CHECK_SUITE_SHA}\") | .number" \
              > /tmp/automerge-candidates.txt
          else
            gh pr list --repo "${GH_REPO}" --state open --limit 200 \
              --json number,labels \
              --jq '.[] | select(.labels | map(.name) | any(. == "automerge" or . == "bot-pr")) | .number' \
              > /tmp/automerge-candidates.txt
          fi
          sort -nu /tmp/automerge-candidates.txt -o /tmp/automerge-candidates.txt
          cat /tmp/automerge-candidates.txt

      - name: Evaluate candidates and dispatch Mike
        run: |
          set -euo pipefail
          dispatched=0
          skipped=0
          summary="${RUNNER_TEMP}/automerge-summary.md"
          {
            echo "## Automerge Dispatcher"
            echo
          } > "${summary}"

          while IFS= read -r pr; do
            [ -n "${pr}" ] || continue
            view="$(gh pr view "${pr}" --repo "${GH_REPO}" \
              --json number,isDraft,labels,reviewDecision,headRefOid,mergeable,statusCheckRollup,comments,files)"

            labeled="$(printf '%s' "${view}" | jq -r '.labels | map(.name) | any(. == "automerge" or . == "bot-pr")')"
            if [ "${labeled}" != "true" ]; then
              skipped=$((skipped + 1))
              continue
            fi

            is_draft="$(printf '%s' "${view}" | jq -r '.isDraft')"
            decision="$(printf '%s' "${view}" | jq -r '.reviewDecision // ""')"
            mergeable="$(printf '%s' "${view}" | jq -r '.mergeable // "UNKNOWN"')"
            if [ "${is_draft}" = "true" ] || [ "${decision}" = "CHANGES_REQUESTED" ] || [ "${mergeable}" != "MERGEABLE" ]; then
              echo "- #${pr}: skipped (draft=${is_draft}, reviewDecision=${decision}, mergeable=${mergeable})" >> "${summary}"
              skipped=$((skipped + 1))
              continue
            fi

            not_green="$(printf '%s' "${view}" | jq -r '
              [ .statusCheckRollup[]?
                | select((.name // .context // "") | test("automerge") | not)
                | select(
                    ((.status // "COMPLETED") != "COMPLETED")
                    or (((.conclusion // .state // "") | ascii_upcase)
                        | IN("SUCCESS","NEUTRAL","SKIPPED","") | not)
                  )
              ] | length')"
            check_count="$(printf '%s' "${view}" | jq -r '[ .statusCheckRollup[]? | select((.name // .context // "") | test("automerge") | not) ] | length')"
            if [ "${check_count}" = "0" ] || [ "${not_green}" != "0" ]; then
              echo "- #${pr}: skipped (${not_green}/${check_count} checks not green)" >> "${summary}"
              skipped=$((skipped + 1))
              continue
            fi

            file_policy="$(printf '%s' "${view}" | jq -r '
              [ .files[]?.path ] as $paths
              | if ($paths | length) == 0 then "no_files"
                elif any($paths[]; startswith(".github/") or startswith("api/") or startswith("dashboard/") or startswith("dharma_swarm/") or startswith("scripts/") or startswith("tests/") or . == "Makefile" or . == "pyproject.toml") then "hot_path"
                elif all($paths[]; startswith("docs/") or startswith("reports/governance/") or endswith(".md")) then "docs_low"
                else "not_docs_low"
                end')"
            if [ "${file_policy}" != "docs_low" ]; then
              echo "- #${pr}: skipped (file_policy=${file_policy}; use local Mike review)" >> "${summary}"
              skipped=$((skipped + 1))
              continue
            fi

            sha="$(printf '%s' "${view}" | jq -r '.headRefOid')"
            marker="<!-- dharma-automerge-dispatch:${sha} -->"
            already="$(printf '%s' "${view}" | jq -r --arg marker "${marker}" '[.comments[]? | select(.body | startswith($marker))] | length')"
            if [ "${already}" != "0" ]; then
              echo "- #${pr}: already dispatched for ${sha}" >> "${summary}"
              skipped=$((skipped + 1))
              continue
            fi

            gh workflow run codex-mention-router.yml --repo "${GH_REPO}" \
              -f pr="${pr}" \
              -f merge_when_clean=true \
              -f required_reviewers=none

            comment="${RUNNER_TEMP}/automerge-comment-${pr}.md"
            {
              echo "${marker}"
              echo
              echo "## Automerge Dispatcher"
              echo
              echo "This labeled docs-low PR is green, so the dispatcher asked Merge Master Mike to arm GitHub auto-merge for head \`${sha}\`."
              echo
              echo "Mike still runs the deterministic gate and uses head-commit matching before any merge can proceed."
            } > "${comment}"
            gh pr comment "${pr}" --repo "${GH_REPO}" --body-file "${comment}" || true
            echo "- #${pr}: dispatched Mike for docs-low automerge (${sha})" >> "${summary}"
            dispatched=$((dispatched + 1))
          done < /tmp/automerge-candidates.txt

          {
            echo
            echo "Dispatched: ${dispatched}"
            echo "Skipped: ${skipped}"
          } >> "${summary}"
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
