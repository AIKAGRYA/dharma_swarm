name: fourfold-warrant

on:
  pull_request:
    branches: [main, "promote/**", "governance/**", "codex/**"]
    # DELIBERATELY UNFILTERED. This gate grades the WHOLE diff, not a language:
    # check_shakti_warrant.py runs with --diff-scope base, and _path_stats
    # (shakti_warrant.py:243-273) counts docs, config and governance paths as
    # first-class scoring inputs, while _explicit_block_reasons (:379-399)
    # matches block patterns against the request text. A docs-only, dashboard-
    # only or Go-only PR therefore earns a real graded verdict — and a Python
    # filter would delete it for exactly those PRs.
    #
    # Enumerating every file class the warrant grades (**/*.md, **/*.yaml,
    # **/*.json, **/*.ts, **/*.sh, ...) would be a list nobody can prove
    # complete, and a filter that is silently short is worse than no filter:
    # tests/test_workflow_path_filters.py pins this as unfilterable instead.
    # Cost: one extra run per PR. Correct price for a whole-diff gate.
  merge_group:

concurrency:
  group: fourfold-warrant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  fourfold-warrant:
    name: Fourfold Shakti Warrant
    runs-on: ubuntu-latest
    # On merge_group batches there is no PR context (body, head/base
    # SHAs); these PR-shaped validations already passed on the PR run
    # before the PR entered the queue. Skipped = satisfied for required
    # checks, so the queue is not blocked.
    if: github.event_name != 'merge_group'
    timeout-minutes: 8
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bind impact-checked attestation to the hot-path diff
        id: attest
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Single hot-path oracle: the same list the warrant library enforces.
          git diff --name-only "${BASE_SHA}...HEAD" | python3 -c '
          import sys
          from dharma_swarm.shakti_warrant import _HOT_PATHS
          changed = {line.strip() for line in sys.stdin if line.strip()}
          hot = sorted(changed & set(_HOT_PATHS))
          sys.stdout.write("\n".join(hot) + ("\n" if hot else ""))
          ' > hot_paths.txt
          impact_checked=false
          if [ ! -s hot_paths.txt ]; then
            impact_checked=true   # no hot paths touched; nothing to attest
          elif [[ "$PR_TITLE $PR_BODY" == *"[impact-checked]"* ]]; then
            impact_checked=true
            missing=""
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$PR_BODY" in *"$path"*) ;; *) missing="${missing}${path} "; impact_checked=false ;; esac
            done < hot_paths.txt
            if [ "$impact_checked" = "false" ]; then
              echo "::error::[impact-checked] claimed, but the PR body does not name these hot-path files: ${missing}. Enumerate each with one line of impact evidence (blast radius / tests run). A bare tag is not an attestation."
            fi
          else
            echo "::error::Hot paths touched ($(paste -sd, - < hot_paths.txt)) without [impact-checked]."
          fi
          echo "impact_checked=${impact_checked}" >> "$GITHUB_OUTPUT"

      - name: Run Fourfold Shakti Warrant on PR diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          WARRANT_INTENT: >-
            CI PR diff fourfold governance warrant for system telos, semantic
            architecture, bounded change, deterministic evidence, exact paths,
            and verification
        run: |
          mkdir -p reports/governance
          impact_checked="${{ steps.attest.outputs.impact_checked }}"
          set +e
          python3 scripts/governance/check_shakti_warrant.py \
            --intent "$WARRANT_INTENT" \
            --diff-scope base \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --no-include-untracked \
            --pass-on-empty-diff \
            --max-diff-chars 20000 \
            --tool "pytest" \
            --metadata allowed_tools=pytest \
            --metadata requires_diff_evidence=true \
            --metadata enforce_hotpath_ack=true \
            --metadata impact_checked="${impact_checked}" \
            --fail-on block \
            --fail-on hold \
            --report-output reports/governance/fourfold-warrant.txt \
            --json-output reports/governance/fourfold-warrant.json
          status=$?
          {
            echo "## Fourfold Shakti Warrant"
            echo
            echo '```text'
            cat reports/governance/fourfold-warrant.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload warrant artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fourfold-warrant
          path: reports/governance/fourfold-warrant.*
          if-no-files-found: ignore
