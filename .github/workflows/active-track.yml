name: active-track-governance

# Advisory signal for the ACTIVE_TRACK governance system.
#
# This workflow exists because of the 2026-05-19 operator-brief pointer-rot
# incident: prose pointers in CLAUDE.md / SOVEREIGN_MANIFEST.md /
# BUILD_SESSION_ENTRYPOINT.md drifted from reality while work moved on,
# but no automated check noticed. The structural fix (see
# docs/governance/REPO_GOVERNANCE_AUDIT.md §2026-05-19) declares the active
# track in exactly one place — docs/governance/ACTIVE_TRACK.yaml — and
# renders managed blocks into the prose docs via markers. This workflow reports
# both invariants on every PR, but only the scheduled sweep hard-fails:
#
#   1. ACTIVE_TRACK.yaml is well-formed and its criteria can be evaluated
#      against the live tree (check_track_status.py).
#   2. Every managed block in governance docs is in sync with the YAML
#      (render_active_track_includes.py --check).

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:
  push:
    # Publish-only trigger: regenerate the derived status rollups and push
    # them to the generated/status orphan branch (see publish-status job).
    branches: [main]
  schedule:
    # Weekly TTL freshness check on docs/governance/ACTIVE_TRACK.yaml verified_at.
    - cron: "23 13 * * 1"
  workflow_dispatch:

concurrency:
  group: active-track-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  active-track-governance:
    name: ACTIVE_TRACK governance gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The checker executes pytest-backed completion criteria. Keep this aligned
    # with the publish job's proven full-dev budget instead of misclassifying a
    # dependency-starved runner as a product regression.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install package + test deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          install_source="${RUNNER_TEMP}/dharma-active-track/package-source"
          mkdir -p "${install_source}"
          git archive --format=tar HEAD | tar -xf - -C "${install_source}"
          python3 -m pip install "${install_source}[dev]"

      - name: Evaluate ACTIVE_TRACK.yaml against tree
        run: |
          set -euo pipefail
          mkdir -p reports/governance
          # TTL staleness blocks only on the weekly freshness sweep (schedule),
          # never on per-PR runs — a stale unrelated track must not block every
          # open PR (the checker emits TTL as WARN, exit 0, on the per-PR path).
          # Structural / regression / false-shippable-claim findings are ERROR
          # and now BLOCK on PRs too (this step is no longer continue-on-error):
          # a track that declares status: shippable without rigorous evidence is
          # a false-closure claim and must fail CI, not merely inform.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/governance/check_track_status.py --enforce-ttl
          else
            python3 scripts/governance/check_track_status.py
          fi

      # Blocking on PRs as of 2026-07-07 (was continue-on-error off-schedule,
      # which let rendered-block drift merge and live for up to 7 days — the
      # adjacent Evaluate step was already hardened; this applies the same
      # standard). Verified in sync on main before the flip.
      - name: Verify managed blocks are in sync (no drift)
        run: |
          set -euo pipefail
          python3 scripts/governance/render_active_track_includes.py --check

      - name: Upload active-track evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: active-track-evidence
          path: reports/governance/active_track_evidence.*

  # WP-O4 (O4-B5/O4-B10): CI runs the SAME onboarding door command as local
  # sessions (`make onboard` → scripts/governance/agent_onboard.py), fail-on-
  # error — no continue-on-error, no weaker flags. The shared AgentOps evaluator
  # then discovers the packet set from the explicit event range: PRs bind the
  # declared base/head pair and merge groups bind every changed packet to the
  # group's synthetic base/head pair. Inability to establish that mapping is a
  # CONFIG_ERROR, never a skipped check. Pre-WP-O5 the door's legacy exit
  # contract keeps this green except on usage/crash; when WP-O5 flips strict-
  # by-default, this same invocation becomes the enforcing context (C1
  # promotes it to merge-blocking separately — no merge authority claimed
  # here).
  onboarding-admission:
    name: Onboarding admission parity
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `runner` is unavailable while GitHub evaluates job-level `env`. Resolve
      # the assigned runner's temporary root in a step, then export it for all
      # later steps through the runner-owned environment file.
      - name: Confine tool state outside checkout
        shell: bash
        run: |
          set -euo pipefail
          bootstrap="${RUNNER_TEMP}/dharma-agentops-bootstrap"
          mkdir -p "${bootstrap}"/{pycache,xdg,ruff,pip}
          printf '%s\n' \
            'PYTHONDONTWRITEBYTECODE=1' \
            "PYTHONPYCACHEPREFIX=${bootstrap}/pycache" \
            'PYTEST_ADDOPTS=-p no:cacheprovider' \
            "XDG_CACHE_HOME=${bootstrap}/xdg" \
            "RUFF_CACHE_DIR=${bootstrap}/ruff" \
            "PIP_CACHE_DIR=${bootstrap}/pip" \
            >> "${GITHUB_ENV}"

      - name: Checkout declared head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"

      - name: Install package + test deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          install_source="${RUNNER_TEMP}/dharma-agentops-bootstrap/package-source"
          mkdir -p "${install_source}"
          git archive --format=tar HEAD | tar -xf - -C "${install_source}"
          python3 -m pip install "${install_source}[dev]"

      - name: Run the one door (same command as local)
        env:
          DHARMA_OPS_DIR: ${{ runner.temp }}/dharma-agentops/onboarding
        run: |
          set -euo pipefail
          make onboard

      - name: Bind onboarding packets to the event range
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          python3 scripts/governance/run_agent_work_packet.py \
            --ci-event "${EVENT_NAME}" \
            --event-base "${EVENT_BASE}" \
            --event-head "${EVENT_HEAD}" \
            --report-root "${RUNNER_TEMP}/dharma-agentops"

      - name: Upload onboarding admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onboarding-admission-evidence
          # Gate tool-cache holds disposable clean-checkout fixtures. Some
          # tracked fixture names are valid on Linux but intentionally rejected
          # by upload-artifact's cross-platform filename policy; they are not
          # evidence and can also make the artifact needlessly enormous.
          path: |
            ${{ runner.temp }}/dharma-agentops
            !${{ runner.temp }}/dharma-agentops/**/tool-cache/**
          if-no-files-found: error

  # Stock macOS ships GNU Make 3.81, whose parser rejects target-specific
  # assignments with multiple modifiers (for example `override export`). Keep
  # this host proof separate from the required Linux admission context so its
  # stable name does not change when the compatibility matrix grows.
  onboarding-macos-compatibility:
    name: Onboarding macOS 3.81 compatibility
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout declared head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # macos-14 is arm64 and does not publish every CPython patch.
          python-version: "3.12"

      - name: Install repository-declared proof dependencies
        run: |
          set -euo pipefail
          install_source="${RUNNER_TEMP}/dharma-agentops-bootstrap/package-source"
          mkdir -p "${install_source}"
          git archive --format=tar HEAD | tar -xf - -C "${install_source}"
          python3 -m pip install "${install_source}[dev]"

      - name: Execute the governed macOS compatibility reproducer
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/dharma-agentops/pycache
          PYTEST_ADDOPTS: -p no:cacheprovider
        run: /usr/bin/make onboarding-macos-compatibility

  # Derived status rollups (active_track_evidence.{json,md},
  # track_portfolio.json, trust_gate_status.json) are NOT tracked on main —
  # they are rewritten in place with a generated_at timestamp on every run and
  # hard-conflicted every concurrent rebase train. This job regenerates them
  # from the merged tree on every push to main and force-pushes them to the
  # unprotected generated/status orphan branch, which serves as:
  #   1. the regression baseline for check_track_status._load_prior_passed
  #      on fresh checkouts (git show origin/generated/status:<path>);
  #   2. the stable read surface for humans and agents
  #      (git show origin/generated/status:reports/governance/<file>).
  publish-status:
    name: Publish derived status branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Raised from 10 with the full dev install below: the checker now actually
    # executes the pytest-battery criteria (wp_o4's batch alone runs ~2.5 min).
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # CL1-B3 (closure spec ONBOARD_ONE_DOOR_CLOSURE_SPEC_2026-07-14.md):
      # this job used to install only pyyaml, so every command_passes /
      # test_passes criterion rendered "environment lacks 'pytest'" and the
      # published projection could never verify a pytest-backed track (it
      # showed onboard-one-door at 0/15 forever). Install the same dev
      # environment as tests.yml so criteria execute here. Fail-safe: a
      # dev-install failure degrades to the previous minimal (pyyaml-only)
      # environment — the checker still runs --warn-only and unexecuted
      # criteria render honestly unverified — rather than killing the job
      # and leaving generated/status silently stale. Only the minimal
      # fallback failing fails the job.
      - name: Install package + test deps
        run: |
          python3 -m pip install --upgrade pip
          if ! python3 -m pip install -e ".[dev]"; then
            echo "::warning::dev install failed; publishing minimal projection with unverified criteria"
            python3 -m pip install pyyaml
          fi

      - name: Regenerate derived status rollups
        run: |
          set -euo pipefail
          mkdir -p reports/governance
          # --warn-only: publishing status must reflect reality even when the
          # gate has blocking findings; the findings ride inside the payload.
          python3 scripts/governance/check_track_status.py --warn-only
          python3 scripts/governance/trust_gate_status.py

      - name: Push rollups to generated-status branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build an orphan commit holding ONLY the four rollups (temp index so
          # the main checkout state is untouched), then force-push: the branch
          # is a latest-only publish surface, not history.
          export GIT_INDEX_FILE="$(mktemp)"
          git read-tree --empty
          git add -f \
            reports/governance/active_track_evidence.json \
            reports/governance/active_track_evidence.md \
            reports/governance/track_portfolio.json \
            reports/governance/trust_gate_status.json
          TREE="$(git write-tree)"
          COMMIT="$(git commit-tree "${TREE}" -m "status: derived governance rollups @ ${GITHUB_SHA}")"
          git push --force origin "${COMMIT}:refs/heads/generated/status"
