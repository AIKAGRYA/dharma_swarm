name: name-drift

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:

concurrency:
  group: name-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  name-drift:
    name: Name-drift — first-party import resolution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run name-drift gate
        run: |
          python3 scripts/governance/check_name_drift.py
