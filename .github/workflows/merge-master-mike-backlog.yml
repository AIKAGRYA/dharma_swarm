name: merge-master-mike-backlog

on:
  schedule:
    - cron: "17 * * * *"  # cloud heartbeat; packet-only and merge-off by default
  workflow_dispatch:
    inputs:
      mode:
        description: Backlog pass mode
        required: true
        default: packet-only
        type: choice
        options:
          - packet-only
          - dry-run
      max_prs:
        description: Maximum PRs to packetize or select
        required: true
        default: "5"
        type: string
      limit:
        description: Open PRs to scan
        required: true
        default: "100"
        type: string
      statuses:
        description: Queue statuses Mike may process
        required: true
        default: GITHUB_GREEN_NEEDS_PACKET,NEEDS_AGENT_REVIEW
        type: string
      required_reviewers:
        description: Required reviewer receipt names before Mike may merge
        required: true
        # Native installed-App reviews are the credential-free cloud quorum.
        # Claude remains an optional deep/backup lane. Copilot is accepted but
        # never required (operator ratification 2026-07-31).
        default: codex
        type: string
      merge_mode:
        description: Mike merge authority mode
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - auto-when-clean
      merge_method:
        description: Merge method when merge_mode is auto-when-clean
        required: true
        default: squash
        type: choice
        options:
          - squash
          - merge
          - rebase
      nats_required:
        description: Fail the run unless A2A NATS publish is JetStream-ack verified
        required: true
        default: false
        type: boolean

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: merge-master-mike-backlog
  cancel-in-progress: false

jobs:
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Halt on loop kill-switch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Loop kill-switch (docs/ops/loop_control/README.md): file present on
          # the loop-control branch => HALT (exit 1, red-while-halted); absent
          # (404 on file or branch) => proceed; any other error => fail closed.
          url="repos/${GH_REPO}/contents/docs/ops/loop_control/KILLSWITCH?ref=loop-control"
          if response="$(gh api "$url" 2>&1)"; then
            echo "HALTED BY KILLSWITCH (docs/ops/loop_control/KILLSWITCH on loop-control)" >&2
            echo "## 🔴 HALTED BY KILLSWITCH — no backlog fanout" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif echo "$response" | grep -qiE "HTTP 404|\"status\": *\"404\"|Not Found|No commit found"; then
            echo "kill-switch absent; proceeding"
          else
            echo "kill-switch state UNKNOWN — failing closed: $response" >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install NATS client
        run: python3 -m pip install 'nats-py>=2.9' 'aiohttp>=3.9'

      - name: Run Merge Master Mike backlog fanout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_MASTER_MIKE_NATS_URL: ${{ secrets.MERGE_MASTER_MIKE_NATS_URL }}
          MERGE_MASTER_MIKE_NATS_USER: ${{ secrets.MERGE_MASTER_MIKE_NATS_USER }}
          MERGE_MASTER_MIKE_NATS_PW: ${{ secrets.MERGE_MASTER_MIKE_NATS_PW }}
          MERGE_MASTER_MIKE_NATS_CA_PEM: ${{ secrets.MERGE_MASTER_MIKE_NATS_CA_PEM }}
          MERGE_MASTER_MIKE_NATS_TLS_HOSTNAME: ${{ vars.MERGE_MASTER_MIKE_NATS_TLS_HOSTNAME || secrets.MERGE_MASTER_MIKE_NATS_TLS_HOSTNAME }}
          DEVIN_NATS_URL: ${{ secrets.DEVIN_NATS_URL }}
          DEVIN_NATS_USER: ${{ secrets.DEVIN_NATS_USER }}
          DEVIN_NATS_PW: ${{ secrets.DEVIN_NATS_PW }}
          DEVIN_NATS_CA_PEM: ${{ secrets.DEVIN_NATS_CA_PEM }}
          DEVIN_NATS_TLS_HOSTNAME: ${{ vars.DEVIN_NATS_TLS_HOSTNAME || secrets.DEVIN_NATS_TLS_HOSTNAME }}
          DHARMA_PR_ACCEPT_GITHUB_REVIEWS: "true"
          MODE: ${{ inputs.mode || 'packet-only' }}
          MAX_PRS: ${{ inputs.max_prs || '5' }}
          LIMIT: ${{ inputs.limit || '100' }}
          STATUSES: ${{ inputs.statuses || 'GITHUB_GREEN_NEEDS_PACKET,NEEDS_AGENT_REVIEW' }}
          REQUIRED_REVIEWERS: ${{ inputs.required_reviewers || 'codex' }}
          MERGE_MODE: ${{ inputs.merge_mode || 'off' }}
          MERGE_METHOD: ${{ inputs.merge_method || 'squash' }}
          NATS_REQUIRED: ${{ inputs.nats_required || false }}
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/dharma-pr-review"
          args=(
            --state-root "${state_root}"
            fanout
            --limit "${LIMIT}"
            --max-prs "${MAX_PRS}"
            --statuses "${STATUSES}"
            --required-reviewers "${REQUIRED_REVIEWERS}"
            --merge-mode "${MERGE_MODE}"
            --merge-method "${MERGE_METHOD}"
            --nats-session
            --nats-timeout-s 8
          )
          if [ "${MODE}" = "dry-run" ]; then
            args+=(--dry-run)
          else
            args+=(--packet-only)
          fi
          if [ "${NATS_REQUIRED}" = "true" ]; then
            args+=(--nats-required)
          fi
          set +e
          python3 -u scripts/runtime/pr_merge_control.py "${args[@]}"
          exit_code="$?"
          set -e
          latest="$(find "${state_root}/mike_fanout" -name summary.md -type f | sort | tail -1 || true)"
          if [ -n "${latest}" ]; then
            {
              echo "## Merge Master Mike Backlog"
              echo
              cat "${latest}"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${exit_code}"

      - name: Upload Mike receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-master-mike-pr-review
          path: ${{ runner.temp }}/dharma-pr-review
          if-no-files-found: warn
