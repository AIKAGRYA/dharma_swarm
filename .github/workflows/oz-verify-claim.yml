# W1 Decorrelated Verifier — runs the oz-verify-claim skill as an Oz cloud agent on every PR.
# The agent posts a falsifiable verdict via `gh`; it never merges, approves, or pushes.
# Requires repo secret WARP_API_KEY (Settings > Secrets and variables > Actions).
name: Oz Verify Claim (W1)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: oz-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: warpdotdev/oz-agent-action@main
        id: verify
        with:
          prompt: |
            Read and apply the `oz-verify-claim` skill in this repository to the current pull request.
            PR: #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}
            Independently verify the PR's claims: run `make onboard`, re-run the tests/commands the PR depends on,
            confirm every asserted artifact file exists (phantom check), confirm a live spine receipt exists,
            then post a single PASS / FAIL / UNPROVEN verdict as a PR comment via `gh`, each line backed by a
            command + exit code or a file path. Do NOT merge, approve, push, or edit source to pass.
            Stay strictly within the skill's authority boundary.
          warp_api_key: ${{ secrets.WARP_API_KEY }}
          profile: ${{ vars.WARP_AGENT_PROFILE || '' }}
