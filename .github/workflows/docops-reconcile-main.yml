name: docops-reconcile-main

# Reconciles the generated DocOps count files on main after every merge.
#
# Why this exists:
#   The "DocOps integrity gate" (docops.yml) treats generated counts as advisory
#   (--counts-advisory). PRs therefore no longer hand-commit AUTO_INVENTORY.md /
#   SOVEREIGN_MANIFEST.md counts, so they never collide in the merge queue (that
#   was the O(n^2) "counter cascade"). The cost of that is the two files go stale
#   on main the moment a file/test/line-adding PR merges. This job closes that
#   gap: right after each merge it recomputes the counts from the tree and commits
#   them back to main.
#
# Loop avoidance:
#   The reconcile commit carries [skip ci], and pushes made with GITHUB_TOKEN do
#   not trigger new workflow runs — so this job never re-triggers itself.
#
# Admin requirement:
#   The acting bot (github-actions[bot]) must be allowed to push the two count
#   files to protected main (branch-protection / ruleset bypass). If it is not,
#   the push step fails loudly so the missing bypass is visible.

on:
  push:
    branches: [main]

concurrency:
  group: docops-reconcile-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    name: Reconcile DocOps counts on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Regenerate generated count files
        run: |
          set -euo pipefail
          # Reuse the existing writer. --write-auto-sections rewrites the
          # AUTO_INVENTORY DOCOPS:START/END sections; --write-manifest-counts
          # rewrites the asserted SOVEREIGN_MANIFEST count tokens. Both are
          # idempotent and driven by docs/docops/assertions.yaml.
          python3 scripts/docops/check_docops_integrity.py \
            --write-auto-sections --write-manifest-counts || true

      - name: Commit and push reconciled counts (only if changed)
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              docs/docops/AUTO_INVENTORY.md \
              docs/governance/SOVEREIGN_MANIFEST.md; then
            echo "DocOps counts already in sync — nothing to reconcile."
            exit 0
          fi
          echo "DocOps counts drifted; committing reconcile:"
          git --no-pager diff --stat -- \
            docs/docops/AUTO_INVENTORY.md \
            docs/governance/SOVEREIGN_MANIFEST.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the two governed count files — never a blanket `git add -A`
          # (respects local rule dharma.scripts-no-git-add-all).
          git add docs/docops/AUTO_INVENTORY.md docs/governance/SOVEREIGN_MANIFEST.md
          git commit \
            -m "chore(docops): reconcile generated counts [skip ci]" \
            -m "Mechanical post-merge reconcile of the generated DocOps count files (AUTO_INVENTORY.md, SOVEREIGN_MANIFEST.md) from the tree. Generated by docops-reconcile-main.yml. No hand-authored content changed."
          # If another merge moved main between checkout and push, don't rebase
          # stale derived counts onto a newer tree — that newer push triggers its
          # own reconcile run (serialized by this job's concurrency group), so we
          # exit cleanly and let it recompute against the latest tree.
          if ! git push origin HEAD:main; then
            echo "::warning::push to main rejected. Either main moved (a newer reconcile run will handle it) or the bot lacks branch-protection bypass for the count files."
          fi
