name: humming-a0-hardening-child

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: humming-a0-hardening-child-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  harden-parent:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/humming-a0-hardening-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      HUMMING_A0_BASE: e1c5dffda158b9f2590567880b8278ee44437e87
      HUMMING_A0_PARENT_HEAD: 062948b83a658e3f851264e11d57e75e5f5b560f
      HUMMING_A0_PARENT_BRANCH: codex/humming-v2-a0-portfolio-admission
    steps:
      - name: Checkout temporary hardening branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/humming-a0-hardening-run
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Confine state and install declared dependencies
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/humming-a0-child"
          mkdir -p "${root}"/{pycache,xdg,ruff,pip,hypothesis,ops}
          printf '%s\n' \
            "PYTHONPYCACHEPREFIX=${root}/pycache" \
            "XDG_CACHE_HOME=${root}/xdg" \
            "RUFF_CACHE_DIR=${root}/ruff" \
            "PIP_CACHE_DIR=${root}/pip" \
            "HYPOTHESIS_STORAGE_DIRECTORY=${root}/hypothesis" \
            "DHARMA_OPS_DIR=${root}/ops" \
            >> "${GITHUB_ENV}"
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Verify untouched main and parent branch identity
        run: |
          set -euo pipefail
          git fetch origin main "${HUMMING_A0_PARENT_BRANCH}"
          test "$(git rev-parse origin/main)" = "${HUMMING_A0_BASE}"
          test "$(git rev-parse origin/${HUMMING_A0_PARENT_BRANCH})" = "${HUMMING_A0_PARENT_HEAD}"
          test "$(git merge-base HEAD origin/main)" = "${HUMMING_A0_BASE}"
          base_worktree="${RUNNER_TEMP}/humming-a0-base"
          git worktree add --detach "${base_worktree}" "${HUMMING_A0_BASE}"
          (
            cd "${base_worktree}"
            make onboard
            make organism-status
            if grep -Eq '^[[:space:]]*orient:' Makefile; then make orient; fi
          )
          git worktree remove "${base_worktree}"

      - name: Apply structural hardening to temporary checkout
        run: |
          set -euo pipefail
          python -m py_compile scripts/governance/humming_a0_hardening_run.py
          python scripts/governance/humming_a0_hardening_run.py
          python scripts/governance/render_active_track_includes.py
          python scripts/docops/check_docops_integrity.py --write-auto-sections --write-manifest-counts
          python scripts/governance/check_track_status.py
          python scripts/governance/render_active_track_includes.py --check
          python scripts/docops/check_docops_integrity.py
          python -m pytest -q \
            tests/test_active_track_governance.py \
            tests/test_track_portfolio.py \
            tests/test_track_closure_rigor.py \
            tests/test_claim_evidence_binding.py \
            tests/test_docops_integrity.py
          git diff --check

      - name: Materialize final five-file tree on exact parent head
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/humming-a0-parent"
          git worktree add --detach "${target}" "origin/${HUMMING_A0_PARENT_BRANCH}"
          for path in \
            docs/governance/ACTIVE_TRACK.yaml \
            CLAUDE.md \
            docs/governance/SOVEREIGN_MANIFEST.md \
            docs/docops/AUTO_INVENTORY.md \
            docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md
          do
            cp "${GITHUB_WORKSPACE}/${path}" "${target}/${path}"
          done
          (
            cd "${target}"
            test "$(git rev-parse HEAD)" = "${HUMMING_A0_PARENT_HEAD}"
            python scripts/governance/check_track_status.py
            python scripts/governance/render_active_track_includes.py --check
            python scripts/docops/check_docops_integrity.py
            python -m pytest -q \
              tests/test_active_track_governance.py \
              tests/test_track_portfolio.py \
              tests/test_track_closure_rigor.py \
              tests/test_claim_evidence_binding.py \
              tests/test_docops_integrity.py
            git diff --check
            changed="$(git diff --name-only | sort)"
            expected="$(printf '%s\n' \
              CLAUDE.md \
              docs/docops/AUTO_INVENTORY.md \
              docs/governance/ACTIVE_TRACK.yaml \
              docs/governance/SOVEREIGN_MANIFEST.md \
              docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md \
              | sort)"
            test "${changed}" = "${expected}"
            git config user.name 'humming-a0-hardening[bot]'
            git config user.email 'humming-a0-hardening[bot]@users.noreply.github.com'
            git add -- ${changed}
            git diff --cached --check
            git commit -m 'fix(humming): bind A0 items to exact owner queues and surfaces'
            git push origin HEAD:"${HUMMING_A0_PARENT_BRANCH}"
          )
