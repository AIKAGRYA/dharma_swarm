name: humming-a0-repair

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: humming-a0-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/humming-v2-a0-portfolio-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      HUMMING_A0_BASE: e1c5dffda158b9f2590567880b8278ee44437e87
    steps:
      - name: Checkout exact A0 branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/humming-v2-a0-portfolio-admission
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Confine tool state and install declared dependencies
        run: |
          set -euo pipefail
          repair="${RUNNER_TEMP}/humming-a0-repair"
          mkdir -p "${repair}"/{pycache,xdg,ruff,pip,hypothesis,ops}
          printf '%s\n' \
            "PYTHONPYCACHEPREFIX=${repair}/pycache" \
            "XDG_CACHE_HOME=${repair}/xdg" \
            "RUFF_CACHE_DIR=${repair}/ruff" \
            "PIP_CACHE_DIR=${repair}/pip" \
            "HYPOTHESIS_STORAGE_DIRECTORY=${repair}/hypothesis" \
            "DHARMA_OPS_DIR=${repair}/ops" \
            >> "${GITHUB_ENV}"
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Revalidate live base and repair exact malformed joins
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${HUMMING_A0_BASE}"
          test "$(git merge-base HEAD origin/main)" = "${HUMMING_A0_BASE}"
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/governance/ACTIVE_TRACK.yaml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '      - tests/test_loop1_consumption_check.py      - agent_loop.sh\n':
                  '      - tests/test_loop1_consumption_check.py\n      - agent_loop.sh\n',
              '      - tests/oracle_support/outcomes.py     # L-A: outcome frame (diff_outcomes referee stays frozen)      - tests/test_action_effect_graph_adapter.py\n':
                  '      - tests/oracle_support/outcomes.py     # L-A: outcome frame (diff_outcomes referee stays frozen)\n      - tests/test_action_effect_graph_adapter.py\n',
              '      - tests/test_verify_corral_findings.py      - dharma_swarm/action_effects/**\n':
                  '      - tests/test_verify_corral_findings.py\n      - dharma_swarm/action_effects/**\n',
              '      - dashboard/src/components/operator-coherence/v2/cockpitV2Model.test.ts      - api/chat_tool_execution.py\n':
                  '      - dashboard/src/components/operator-coherence/v2/cockpitV2Model.test.ts\n      - api/chat_tool_execution.py\n',
          }
          for bad, good in replacements.items():
              count = text.count(bad)
              if count != 1:
                  raise SystemExit(f'expected exactly one malformed join, found {count}: {bad!r}')
              text = text.replace(bad, good, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Assert real ownership rather than parser acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path('docs/governance/ACTIVE_TRACK.yaml').read_text())
          tracks = {item['id']: item for item in data['active_tracks']}
          if len(tracks) != 10:
              raise SystemExit(f'active-track count changed: {len(tracks)}')
          expected = {
              'loop-closure-2026-06': {
                  'agent_loop.sh', 'cron_jobs.json', 'scripts/cron_unify.py',
                  'dharma_swarm/cron_job_runtime.py',
              },
              'dharmagraph-engine-2026-07': {
                  'tests/test_action_effect_graph_adapter.py',
                  'tests/test_graph_budget_lineage.py',
              },
              'sovereign-safety-tcb-2026-07': {
                  'dharma_swarm/action_effects/**',
                  'dharma_swarm/tool_registry.py',
                  'hooks/telos_gate.py', '.claude/settings.json',
                  'docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md',
              },
              'repository-titanium-hardening-2026-07': {
                  'api/chat_tool_execution.py',
                  'tests/test_shell_policy_consumers.py',
                  'tests/test_sandbox_limits.py',
              },
          }
          for track_id, required in expected.items():
              owned = set(tracks[track_id].get('owned_surfaces') or [])
              missing = sorted(required - owned)
              if missing:
                  raise SystemExit(f'{track_id} missing exact owned surfaces: {missing}')
          bad_fragments = ('      - agent_loop.sh', '      - dharma_swarm/action_effects/**',
                           '      - api/chat_tool_execution.py',
                           '      - tests/test_action_effect_graph_adapter.py')
          raw = Path('docs/governance/ACTIVE_TRACK.yaml').read_text()
          for fragment in bad_fragments:
              if raw.count(fragment + '\n') != 1:
                  raise SystemExit(f'exact surface line count != 1: {fragment!r}')
          if any(item['id'].startswith('humming-') for item in data['active_tracks']):
              raise SystemExit('A0 must not create a Humming active track')
          print('Exact Humming A0 ownership assertions: PASS')
          PY

      - name: Regenerate projections and run A0 evidence
        run: |
          set -euo pipefail
          python scripts/governance/render_active_track_includes.py
          python scripts/docops/check_docops_integrity.py --write-auto-sections --write-manifest-counts
          python scripts/governance/check_track_status.py
          python scripts/governance/render_active_track_includes.py --check
          python scripts/docops/check_docops_integrity.py
          python -m pytest -q \
            tests/test_active_track_governance.py \
            tests/test_track_portfolio.py \
            tests/test_track_closure_rigor.py \
            tests/test_claim_evidence_binding.py \
            tests/test_docops_integrity.py
          git diff --check

      - name: Commit and publish repaired A0 head
        run: |
          set -euo pipefail
          git config user.name 'humming-a0-repair[bot]'
          git config user.email 'humming-a0-repair[bot]@users.noreply.github.com'
          git add -- \
            docs/governance/ACTIVE_TRACK.yaml \
            CLAUDE.md \
            docs/governance/SOVEREIGN_MANIFEST.md \
            docs/docops/AUTO_INVENTORY.md
          git diff --cached --check
          git commit -m 'fix(humming): make A0 ownership rows structurally real'
          git push origin HEAD:codex/humming-v2-a0-portfolio-admission
