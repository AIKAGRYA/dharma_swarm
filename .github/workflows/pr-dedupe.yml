name: pr-dedupe

# Duplicate automated-PR consolidation.
#
# Default posture is dry-run. A maintainer can dispatch with dry_run=false
# after checking the summary. The workflow never merges and never deletes
# branches; it only closes older non-draft PRs with automated title markers.

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true reports only; false closes older duplicate automated PRs"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: pr-dedupe
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dedupe:
    name: Report or close duplicate automated PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
    steps:
      - name: Find duplicate automated PRs
        run: |
          set -euo pipefail
          gh pr list --repo "${GH_REPO}" --state open --limit 200 \
            --json number,title,isDraft,headRefName,createdAt,url \
            > /tmp/open-prs.json

          jq -c '
            [ .[]
              | select(.isDraft == false)
              | . + {norm: (.title | ascii_downcase | gsub("\\s+"; " ") | gsub("^ | $"; ""))}
              | select(.norm | test("\\[automated\\]|\\[auto\\]"))
            ]
            | group_by(.norm)
            | map(select(length > 1) | sort_by(.number))
            | .[]
          ' /tmp/open-prs.json > /tmp/duplicate-groups.jsonl || true

          summary="${RUNNER_TEMP}/pr-dedupe-summary.md"
          {
            echo "## Duplicate Automated PR Dedupe"
            echo
            echo "Dry run: \`${DRY_RUN}\`"
            echo
          } > "${summary}"

          closed_count=0
          if [ ! -s /tmp/duplicate-groups.jsonl ]; then
            echo "No duplicate automated PRs found." >> "${summary}"
          fi

          while IFS= read -r group; do
            keep="$(printf '%s' "${group}" | jq -r '.[-1].number')"
            title="$(printf '%s' "${group}" | jq -r '.[-1].title')"
            echo "### ${title}" >> "${summary}"
            echo >> "${summary}"
            echo "Keeping newest PR #${keep}." >> "${summary}"
            while IFS= read -r entry; do
              number="$(printf '%s' "${entry}" | jq -r '.number')"
              head_ref="$(printf '%s' "${entry}" | jq -r '.headRefName')"
              url="$(printf '%s' "${entry}" | jq -r '.url')"
              echo "- Older duplicate: #${number} (${head_ref}) ${url}" >> "${summary}"
              if [ "${DRY_RUN}" = "false" ]; then
                close_msg="${RUNNER_TEMP}/pr-dedupe-close-${number}.md"
                {
                  echo "## Auto-closed: duplicate automated PR"
                  echo
                  echo "This PR duplicates #${keep} by normalized automated title."
                  echo
                  echo "Only the newest non-draft automated PR for this intent stays open. Reopen and rename the title if this classification is wrong."
                } > "${close_msg}"
                gh pr comment "${number}" --repo "${GH_REPO}" --body-file "${close_msg}" || true
                gh pr close "${number}" --repo "${GH_REPO}" || true
                closed_count=$((closed_count + 1))
              fi
            done < <(printf '%s' "${group}" | jq -c '.[:-1][]')
            echo >> "${summary}"
          done < /tmp/duplicate-groups.jsonl

          {
            echo
            echo "Closed: ${closed_count}"
          } >> "${summary}"
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
