name: pr-dedupe

# Duplicate automated-PR consolidation.
#
# Problem this solves:
#   Automation lanes (spine-adoption refresh, docops refresh, etc.) sometimes
#   open the same PR repeatedly under *different* branch prefixes
#   (chore/governance/spine-adoption-metric-refresh, chore/spine-adoption-…,
#   chore/auto-spine-adoption-…, ops/spine-adoption-metric-…). The headRef
#   throttle in bot-pr-limit.yml only matches declared patterns, so renamed
#   lanes slip through and the backlog fills with byte-identical refresh PRs
#   (#559 / #571 / #580 / #583 were one such pile).
#
# What this does (mechanical, non-judgmental), in two passes:
#
#   Pass 1 — ephemeral snapshot reports (NEW): the external ops automation
#   opens a fresh draft PR every few hours that is a pure *status snapshot* —
#   "report(governance): PR lifecycle + spine adoption ops report …" and
#   "chore(governance): refresh spine adoption metric …". Each carries a unique
#   timestamp in its title, so Pass 2's title-grouping never collapses them and
#   they pile up (12+ at a time, burying real PRs). These snapshots carry no
#   merge value — their data is a projection already rendered from owners
#   (`make onboard`, reports/governance/**) — so this pass CLOSES every such
#   snapshot PR outright (not keep-newest) with a governance comment while
#   preserving its branch ref for recovery. The match is conservative:
#   same-repo owner AND either an exact snapshot-only branch paired with its
#   own anchored title grammar, or an automation marker paired with a known
#   legacy snapshot intent.
#
#   Pass 2 — duplicate consolidation: groups remaining open PRs by normalized
#   title (lowercased, whitespace collapsed, timestamps stripped) and, for
#   every group with 2+ PRs whose title carries an automation marker
#   ("[automated]" or "[auto]"), keeps ONLY the newest PR (highest number) and
#   closes the rest with a governance comment + branch cleanup.
#
# What this does NOT do:
#   - It never touches PRs without an automation marker in the title.
#   - It never merges anything (Merge Master Mike owns merges).
#   - Pass 1 never touches a PR that is not from the repo owner, nor one whose
#     title/headRef does not match a declared snapshot intent.
#
# Drafts: duplicate automated PRs are closed even when draft — automation
# lanes that open refresh PRs as drafts otherwise pile up forever (the
# #559/#571/#580/#583 spine-refresh pile was all drafts). A draft PR with a
# unique title is never touched.

on:
  pull_request_target:
    types: [opened, reopened]
  schedule:
    - cron: "15 */6 * * *"  # every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only report — don't close"
        default: "false"

concurrency:
  group: pr-dedupe
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dedupe:
    name: Close duplicate automated PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Close ephemeral snapshot-report PRs
        run: |
          set -euo pipefail

          repo_owner="${GH_REPO%%/*}"

          gh pr list --repo "$GH_REPO" --state open --limit 200 \
            --json number,title,isDraft,headRefName,headRepositoryOwner,author,labels,createdAt \
            > /tmp/open_prs.json

          # A snapshot-report PR is a pure status projection that should never
          # have been a PR. The external Oz lane historically omitted
          # [automated] while using one of two dedicated timestamped branch
          # shapes: chore/ops-report-YYYYMMDD... or
          # ops/spine-adoption-pr-lifecycle-YYYY-MM-DD.... The lifecycle lane
          # and the older chore/ops-report lane are special-cased: each exact
          # branch grammar must be paired with its own anchored timestamped
          # title, and neither can inherit broader legacy intent matchers.
          # Git refs cannot contain a colon, so branch times use hhmm while
          # titles use hh:mm. Never trust a bare prefix, which a human topic
          # branch could legitimately use. The same-repo-owner check remains
          # mandatory because this workflow runs with pull_request_target
          # write credentials.
          SNAPSHOT_FILTER="$(cat <<'JQ'
            def trusted($owner): ((.headRepositoryOwner.login // "") == $owner);
            def snapshot_intent:
              ((.title // "") | ascii_downcase) as $t
              | ((.headRefName // "") | ascii_downcase) as $h
              | ($h | test("^ops/spine-adoption-pr-lifecycle-[0-9]{4}-[0-9]{2}-[0-9]{2}(t[0-9]{4}z)?$")) as $lifecycle_snapshot
              | ($h | test("^chore/ops-report-[0-9]{8}([t-]?[0-9]{4}z?)?$")) as $legacy_ops_snapshot
              | if $lifecycle_snapshot then
                  ($t | test("^report\\(governance\\): ops runs? [0-9]{4}-[0-9]{2}-[0-9]{2}(t[0-9]{2}:[0-9]{2}z)?([^a-z0-9]|$)"))
                elif $legacy_ops_snapshot then
                  ($t | test("^chore\\(governance\\): ops report [0-9]{4}-[0-9]{2}-[0-9]{2}(t[0-9]{2}:?[0-9]{2}z)?([^a-z0-9]|$)"))
                else
                  ($t | test("\\[automated\\]|\\[auto\\]"))
                  and (
                    ($t | test("pr lifecycle \\+ spine adoption ops report"))
                    or ($t | test("(^|[^a-z])ops report([^a-z]|$)"))
                    or ($t | test("^report\\(governance\\): ops runs?([^a-z]|$)"))
                    or ($t | test("refresh spine adoption metric"))
                    or ($h | test("pr-lifecycle-spine"))
                    or ($h | test("spine-adoption-metric"))
                  )
                end;
            [ .[] | select(trusted($repo_owner)) | select(snapshot_intent) ]
            | sort_by(.number) | .[]
          JQ
          )"
          jq -c "$SNAPSHOT_FILTER" --arg repo_owner "$repo_owner" \
            /tmp/open_prs.json > /tmp/snapshot_prs.jsonl

          closed_count=0
          summary="## Ephemeral Snapshot-Report PR Cleanup\n\n"
          if [ ! -s /tmp/snapshot_prs.jsonl ]; then
            summary+="No snapshot-report PRs open.\n"
          fi

          while IFS= read -r entry; do
            number="$(echo "$entry" | jq -r '.number')"
            title="$(echo "$entry" | jq -r '.title')"
            head_ref="$(echo "$entry" | jq -r '.headRefName')"
            if [ "$DRY_RUN" != "false" ]; then
              summary+="- **WOULD CLOSE** #${number} (branch \`${head_ref}\`) — ${title}\n"
              continue
            fi

            close_msg="## 🗂️ Auto-closed: ephemeral snapshot report

          This PR is a **status snapshot** (PR-lifecycle / spine-adoption metric),
          not a change to merge. The same data is a projection already rendered
          from its owners — run \`make onboard\` or read \`reports/governance/**\`.

          Per \`docs/governance/PR_QUALITY_GATES.md\`, snapshot reports are emitted
          as artifacts/comments, never as standing PRs, so they are closed on
          sight to keep the PR list readable. No action needed.

          Its branch ref is intentionally preserved for recovery. If this was a
          real change, reopen and retitle so it no longer matches a snapshot
          intent."
            comment_note=""
            if ! gh pr comment "$number" --repo "$GH_REPO" --body "$close_msg"; then
              comment_note="; governance comment failed"
              echo "::warning::comment on #${number} failed"
            fi
            if gh pr close "$number" --repo "$GH_REPO"; then
              closed_count=$((closed_count + 1))
              summary+="- **CLOSED** #${number} (branch \`${head_ref}\`) — ${title}${comment_note}\n"
            else
              summary+="- **FAILED TO CLOSE** #${number} (branch \`${head_ref}\`) — ${title}${comment_note}\n"
              echo "::warning::close of #${number} was rejected — not counted as closed"
            fi
          done < /tmp/snapshot_prs.jsonl

          summary+="\n**Summary:** ${closed_count} snapshot PR(s) closed (dry_run=${DRY_RUN})\n"
          echo -e "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Snapshot closed: $closed_count"

      - name: Find and close duplicate automated PRs
        run: |
          set -euo pipefail

          repo_owner="${GH_REPO%%/*}"
          trusted_head_re='^(ops|chore|codex|devin|governance)/'

          gh pr list --repo "$GH_REPO" --state open --limit 200 \
            --json number,title,isDraft,headRefName,headRepositoryOwner,author,labels,createdAt \
            > /tmp/open_prs.json

          # Normalize titles and group. Title markers are not trusted by
          # themselves: pull_request_target has write credentials, so dedupe
          # only touches same-repo PRs that also have a trusted automation
          # signal (bot author, trusted head prefix, or maintainer-applied
          # opt-in label).
          jq -c '
            def label_names: (.labels // [] | map(.name));
            def trusted($owner; $head_re):
              ((.headRepositoryOwner.login // "") == $owner)
              and (
                (.author.is_bot == true)
                or ((.author.login // "") == "Copilot")
                or ((.author.login // "") | test("\\[bot\\]$"))
                or ((.headRefName // "") | test($head_re))
                or (label_names | any(. == "bot-pr" or . == "automerge"))
              );
            [ .[]
              | . + {norm: (
                  .title | ascii_downcase
                  | gsub("[0-9]{4}-[0-9]{2}-[0-9]{2}t?[0-9:]*z?"; "")
                  | gsub("[0-9]{8}-?[0-9]{4}z?"; "")
                  | gsub("[0-9]{1,2}:[0-9]{2}z?"; "")
                  | gsub("\\s+"; " ") | gsub("^ | $"; "")
                )}
              | select(.norm | test("\\[automated\\]|\\[auto\\]"))
              | select(trusted($repo_owner; $trusted_head_re))
            ]
            | group_by(.norm)
            | map(select(length > 1) | sort_by(.number))
            | .[]
          ' --arg repo_owner "$repo_owner" --arg trusted_head_re "$trusted_head_re" \
            /tmp/open_prs.json > /tmp/dupe_groups.jsonl

          closed_count=0
          summary="## Duplicate Automated PR Dedupe\n\n"

          if [ ! -s /tmp/dupe_groups.jsonl ]; then
            summary+="No duplicate automated PRs found.\n"
          fi

          while IFS= read -r group; do
            keep="$(echo "$group" | jq -r '.[-1].number')"
            title="$(echo "$group" | jq -r '.[-1].title')"
            summary+="### \`${title}\` — keeping #${keep}\n"
            while IFS= read -r entry; do
              number="$(echo "$entry" | jq -r '.number')"
              head_ref="$(echo "$entry" | jq -r '.headRefName')"
              if [ "$DRY_RUN" != "false" ]; then
                summary+="- **WOULD CLOSE** #${number} (branch \`${head_ref}\`)\n"
                continue
              fi

              close_msg="## 🗂️ Auto-closed: duplicate automated PR

          This PR duplicates **#${keep}** (same automated intent, newer snapshot).
          Per \`docs/governance/PR_QUALITY_GATES.md\` § Duplicate Automated PR Dedupe,
          only the newest PR per automated intent stays open.

          If this close is wrong, reopen and rename the title so it no longer
          matches the duplicate group."
              comment_note=""
              if ! gh pr comment "$number" --repo "$GH_REPO" --body "$close_msg"; then
                comment_note="; governance comment failed"
                echo "::warning::comment on #${number} failed"
              fi
              if gh pr close "$number" --repo "$GH_REPO"; then
                delete_note=""
                if ! gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${head_ref}" 2>/dev/null; then
                  delete_note="; branch cleanup failed"
                  echo "::warning::branch cleanup for #${number} failed"
                fi
                closed_count=$((closed_count + 1))
                summary+="- **CLOSED** #${number} (branch \`${head_ref}\`)${comment_note}${delete_note}\n"
              else
                summary+="- **FAILED TO CLOSE** #${number} (branch \`${head_ref}\`)${comment_note}\n"
                echo "::warning::close of #${number} was rejected — not counted as closed"
              fi
            done < <(echo "$group" | jq -c '.[:-1][]')
          done < /tmp/dupe_groups.jsonl

          summary+="\n**Summary:** ${closed_count} closed (dry_run=${DRY_RUN})\n"
          echo -e "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Closed: $closed_count"
