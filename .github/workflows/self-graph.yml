name: self-graph-refresh

# SVAYAM-CHAKRA Wave 0 — nightly repo self-graph projection.
#
# Materializes the repository's structural graph (import edges, SCC
# condensation, PageRank centrality, Rule 10 budget join, ownership) as
# deterministic TSV/JSON projections under reports/self_graph/, so every
# downstream maintenance loop can query structure instead of re-deriving
# it per run.
#
# Delivery law (GOAL_SPEC SVAYAM-CHAKRA §6): never a direct commit to
# main. If the regenerated projections drift from the committed ones,
# this job force-pushes the rolling chore/self-graph-refresh branch
# (registered in bot-pr-limit.yml, max 1 open) and opens/refreshes a bot
# PR through the normal gate. A rejected delivery is a FAILED job, not a
# warning (docops-reconcile-main lesson, 2026-07-03).
#
# Self-limiting: one rolling branch, one open PR, skip-if-no-drift.

on:
  schedule:
    - cron: "7 18 * * *" # nightly 18:07 UTC, before the 19:30 full-suite lane
  workflow_dispatch:

concurrency:
  group: self-graph-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate repo self-graph projections
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Regenerate projections
        run: |
          set -euo pipefail
          python3 scripts/graph/repo_self_graph.py

      - name: Deliver as rolling bot PR when drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/self_graph/; then
            echo "Self-graph projections are current on main; nothing to deliver."
            exit 0
          fi

          BRANCH="chore/self-graph-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/self_graph/
          git commit -m "chore(self-graph): nightly projection refresh"

          git push --force origin "HEAD:refs/heads/${BRANCH}"

          existing="$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Refreshed open PR #${existing} on ${BRANCH}."
            exit 0
          fi
          gh pr create --repo "$GH_REPO" \
            --head "$BRANCH" --base main \
            --title "chore(self-graph): nightly projection refresh" \
            --body "Mechanical regeneration of \`reports/self_graph/\` projections (import graph, SCC condensation, centrality, Rule 10 join). Generated by the \`self-graph-refresh\` workflow; rolling branch is refreshed until merged. See \`scripts/graph/repo_self_graph.py\`."
          echo "Delivered as a new bot PR on ${BRANCH}."
