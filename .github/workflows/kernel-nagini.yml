name: kernel-nagini

on:
  pull_request:
    paths:
      - "packages/telos-kernel/**"
      - ".github/workflows/kernel-nagini.yml"
  push:
    branches: [main]

jobs:
  nagini:
    name: Nagini sound static verification
    runs-on: ubuntu-latest
    # Nagini requires JDK + Viper backend; the setup is heavier than the other
    # workflows. This job is allowed to fail during the initial Phase 0
    # bring-up while the Nagini-compatible subset is being tightened; it
    # graduates to `required` before Phase 1 lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # nagini's supported line
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Install nagini
        run: |
          python -m pip install --upgrade pip
          pip install nagini || echo "nagini install failed — job will skip via pytest marker"
      - name: Install kernel package
        run: |
          pip install -e packages/telos-kernel
          pip install pytest pydantic pyyaml cryptography icontract
      - name: Run Nagini verifier tests
        run: |
          pytest packages/telos-kernel/telos_kernel/tests/test_nagini.py -q -s
