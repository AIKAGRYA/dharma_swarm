name: module-budget

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:

concurrency:
  group: module-budget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-budget:
    name: Rule 10 — module line budget
    runs-on: ubuntu-latest
    # PR diff budget already passed before queueing.
    # merge_group has no pull_request base/head SHA context.
    if: github.event_name != 'merge_group'
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run module-budget gate
        run: |
          python3 scripts/governance/check_module_budget.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"
