name: module-budget

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
    # DELIBERATELY UNFILTERED — this workflow publishes a CONTRACTED check name
    # ('Rule 10 — module line budget' in docs/governance/CI_TRUTH_CONTRACT.json).
    #
    # A workflow-level `paths:` filter makes the workflow not run at all, so no
    # check appears in the rollup, and ci_truth.classify_check(None) returns
    # MISSING. PASS_CONCLUSIONS (ci_truth.py:20) contains SKIPPED but NOT
    # MISSING, so evaluate_rollup sets verdict = DEGRADED and the CLI exits 3 —
    # permanently, on every docs-only and dependency-only PR. The operator
    # report then cannot tell "advisory gate broken" from "advisory gate not
    # applicable", which is the whole value of the report.
    #
    # Per-JOB filtering (as tests.yml does) is the correct answer here: the job
    # reports `skipped`, and SKIPPED counts as PASS. That needs a classifier job
    # in this workflow and a contract entry for its check name; it is deliberate
    # follow-up, not done here. Filtering it back at the workflow level is not
    # the fix and is blocked by test_workflow_path_filters.py.
  merge_group:

concurrency:
  group: module-budget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-budget:
    name: Rule 10 — module line budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Select comparison refs
        id: refs
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run module-budget gate
        # --grandfather-base-ref reads the GRANDFATHERED map from the merge-base
        # of the base and head, so a PR cannot grandfather its own oversized
        # module by editing the dict in the same diff.
        run: |
          python3 scripts/governance/check_module_budget.py \
            --base-ref "${{ steps.refs.outputs.base }}" \
            --head-ref "${{ steps.refs.outputs.head }}" \
            --grandfather-base-ref "${{ steps.refs.outputs.base }}"
