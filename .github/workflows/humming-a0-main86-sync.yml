name: humming-a0-main86-sync

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: humming-a0-main86-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild-parent:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/humming-a0-main86-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      MAIN_SHA: 86a1af8ce562e160aa7338ac50c37cba44db8689
      A0_BRANCH: codex/humming-v2-a0-portfolio-admission
      A0_EXPECTED_HEAD: 9b8fccd756113458441bfad07f750d9492f8a64f
    steps:
      - name: Checkout temporary synchronization branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/humming-a0-main86-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Rebuild exact A0 projection from current main
        run: |
          set -euo pipefail
          git fetch origin main "${A0_BRANCH}"
          test "$(git rev-parse origin/main)" = "${MAIN_SHA}"
          test "$(git rev-parse origin/${A0_BRANCH})" = "${A0_EXPECTED_HEAD}"
          test "$(git merge-base HEAD origin/main)" = "${MAIN_SHA}"

          target="${RUNNER_TEMP}/humming-a0-main86-parent"
          git worktree add --detach "${target}" "${MAIN_SHA}"
          mkdir -p "${target}/docs/plans/handoffs"
          git show "origin/${A0_BRANCH}:docs/governance/ACTIVE_TRACK.yaml" \
            > "${target}/docs/governance/ACTIVE_TRACK.yaml"
          git show "origin/${A0_BRANCH}:docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md" \
            > "${target}/docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md"

          (
            cd "${target}"
            python - <<'PY'
          from pathlib import Path
          import yaml

          main_sha = '86a1af8ce562e160aa7338ac50c37cba44db8689'
          prior = '9b8fccd756113458441bfad07f750d9492f8a64f'
          ledger = Path('docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md')
          raw = ledger.read_text(encoding='utf-8')
          old_base = '**Base:** `a8da9bb5bffa2031f3e0b699261a94dd8ecb2ef1`'
          current_base = '**Base:** `a002d4df8126f08693391ae20103496a006ce2de`'
          new_base = f'**Base:** `{main_sha}`'
          if old_base in raw:
              raw = raw.replace(old_base, new_base, 1)
          elif current_base in raw:
              raw = raw.replace(current_base, new_base, 1)
          elif new_base not in raw:
              raise SystemExit('ledger primary Base line is not a recognized predecessor')
          heading = '## A0 post-loop-watcher main synchronization'
          if heading not in raw:
              raw = raw.rstrip() + f'''\n\n{heading}\n\n- 2026-08-02: main advanced to `{main_sha}` through PR #1163 after A0 had\n  been rebased onto the preceding CI-heal commit. The loop-watcher change is\n  path-disjoint from A0 but changes tracked Python/test inventory, so A0 was\n  rebuilt from exact main and all projections/counts were regenerated rather\n  than accepting a syntactically clean but count-stale rebase.\n- Prior A0 head: `{prior}`. No implementation or ownership intent was changed.\n'''
          ledger.write_text(raw, encoding='utf-8')

          active = Path('docs/governance/ACTIVE_TRACK.yaml')
          data = yaml.safe_load(active.read_text(encoding='utf-8'))
          tracks = {t['id']: t for t in data['active_tracks']}
          assert len(tracks) == 10
          assert not any(k.startswith('humming-') for k in tracks)
          expected = {
              'loop-closure-2026-06': {'humming-v2-p0-b-root-loop','humming-v2-e1-cron-authority'},
              'merge-master-mike-d4-2026-06': {'humming-v2-enforcement-ack'},
              'organism-rewire-2026-07': {'humming-v2-host-ack'},
              'dharmagraph-engine-2026-07': {'humming-v2-p0-graph-adapter'},
              'sovereign-safety-tcb-2026-07': {'humming-v2-p0-k','humming-v2-p0-h1a','humming-v2-p0-h1b','humming-v2-p0-h2a','humming-v2-p0-h3-contract','humming-v2-p0-b-contract'},
              'repository-titanium-hardening-2026-07': {'humming-v2-p0-harness-consumers','humming-v2-p0-h6','humming-v2-p0-b-adapters'},
          }
          all_ids = set().union(*expected.values())
          observed = []
          for owner, ids in expected.items():
              next_ids = [str(x.get('id')) for x in tracks[owner].get('next_items') or []]
              for item_id in ids:
                  assert next_ids.count(item_id) == 1, (owner, item_id, next_ids.count(item_id))
              observed.extend(x for x in next_ids if x in all_ids)
              criteria = {str(x.get('id')) for x in tracks[owner].get('completion_criteria') or []}
              assert not (criteria & all_ids), (owner, criteria & all_ids)
          for item_id in all_ids:
              assert observed.count(item_id) == 1, (item_id, observed.count(item_id))
          text = active.read_text(encoding='utf-8')
          for token in (
              'dharma_swarm/action_effects/envelope.py',
              'dharma_swarm/action_effects/dispatcher.py',
              'dharma_swarm/action_effects/budget.py',
              'tests/test_action_budget.py',
              'SemanticActionProposal',
              'dharma_swarm/graph/effects.py',
              'dharma_swarm/cron_job_runtime.py for the future E1',
          ):
              assert token in text, token
          assert 'dharma_swarm/action_effects/**' not in text
          titanium_owned = set(tracks['repository-titanium-hardening-2026-07']['owned_surfaces'])
          assert {'tests/test_agent_work_packet.py','tests/test_make_onboarding_contract.py'} <= titanium_owned
          assert '| remove tracked hook registration | no | BLOCKED_DEPENDENCY | H1a |' in raw
          print('A0 exact-owner and coherence assertions: PASS')
          PY

            python scripts/governance/render_active_track_includes.py
            python scripts/docops/check_docops_integrity.py --write-auto-sections --write-manifest-counts
            python scripts/governance/check_track_status.py
            python scripts/governance/render_active_track_includes.py --check
            python scripts/docops/check_docops_integrity.py
            python -m pytest -q \
              tests/test_active_track_governance.py \
              tests/test_track_portfolio.py \
              tests/test_track_closure_rigor.py \
              tests/test_claim_evidence_binding.py \
              tests/test_docops_integrity.py
            git diff --check

            changed="$(
              {
                git diff --name-only
                git ls-files --others --exclude-standard
              } | sort -u
            )"
            expected="$(printf '%s\n' \
              CLAUDE.md \
              docs/docops/AUTO_INVENTORY.md \
              docs/governance/ACTIVE_TRACK.yaml \
              docs/governance/SOVEREIGN_MANIFEST.md \
              docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md \
              | sort)"
            printf 'Final synchronized paths:\n%s\n' "${changed}"
            test "${changed}" = "${expected}"

            git config user.name 'humming-a0-sync[bot]'
            git config user.email 'humming-a0-sync[bot]@users.noreply.github.com'
            while IFS= read -r path; do
              [ -n "${path}" ] && git add -- "${path}"
            done <<< "${changed}"
            git diff --cached --check
            git commit -m 'rebase(humming): synchronize A0 with loop-watcher main'
            git push \
              --force-with-lease="refs/heads/${A0_BRANCH}:${A0_EXPECTED_HEAD}" \
              origin "HEAD:refs/heads/${A0_BRANCH}"
          )
