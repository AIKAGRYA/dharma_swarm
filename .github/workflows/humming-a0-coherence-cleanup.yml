name: humming-a0-coherence-cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: humming-a0-coherence-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  clean-parent:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/humming-a0-coherence-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      A0_BRANCH: codex/humming-v2-a0-portfolio-admission
      A0_EXPECTED_HEAD: ecd92512fc5ff2d307f3ca59e60f17b283b46a44
    steps:
      - name: Checkout temporary controller branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/humming-a0-coherence-cleanup
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install declared dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Apply exact naming cleanup, revalidate, and publish parent
        run: |
          set -euo pipefail
          git fetch origin "${A0_BRANCH}"
          test "$(git rev-parse origin/${A0_BRANCH})" = "${A0_EXPECTED_HEAD}"
          target="${RUNNER_TEMP}/humming-a0-coherence-parent"
          git worktree add --detach "${target}" "${A0_EXPECTED_HEAD}"
          (
            cd "${target}"
            python - <<'PY'
          from pathlib import Path

          active = Path('docs/governance/ACTIVE_TRACK.yaml')
          ledger = Path('docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md')

          raw = active.read_text(encoding='utf-8')
          replacements = {
              'scripts/cron_unify.py, and cron_job_runtime.py for the future E1':
                  'scripts/cron_unify.py, and dharma_swarm/cron_job_runtime.py for the future E1',
              'constitutional ActionEnvelope in action_effects/envelope.py and one\n          action-effect dispatcher in action_effects/dispatcher.py, reusing':
                  'constitutional ActionEnvelope in dharma_swarm/action_effects/envelope.py and one\n          action-effect dispatcher in dharma_swarm/action_effects/dispatcher.py, reusing',
          }
          for old, new in replacements.items():
              count = raw.count(old)
              if count != 1:
                  raise SystemExit(f'ACTIVE_TRACK replacement multiplicity {count}: {old!r}')
              raw = raw.replace(old, new, 1)
          active.write_text(raw, encoding='utf-8')

          lraw = ledger.read_text(encoding='utf-8')
          old = '| remove tracked hook registration | seat | BLOCKED_DEPENDENCY | H1a |'
          new = '| remove tracked hook registration | no | BLOCKED_DEPENDENCY | H1a |'
          count = lraw.count(old)
          if count != 1:
              raise SystemExit(f'ledger replacement multiplicity {count}')
          ledger.write_text(lraw.replace(old, new, 1), encoding='utf-8')
          PY

            python scripts/governance/check_track_status.py
            python scripts/governance/render_active_track_includes.py --check
            python scripts/docops/check_docops_integrity.py
            python -m pytest -q \
              tests/test_active_track_governance.py \
              tests/test_track_portfolio.py \
              tests/test_track_closure_rigor.py \
              tests/test_claim_evidence_binding.py \
              tests/test_docops_integrity.py
            git diff --check

            changed="$(git diff --name-only | sort)"
            expected="$(printf '%s\n' \
              docs/governance/ACTIVE_TRACK.yaml \
              docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md \
              | sort)"
            printf 'Coherence cleanup paths:\n%s\n' "${changed}"
            test "${changed}" = "${expected}"

            grep -F 'dharma_swarm/cron_job_runtime.py for the future E1' docs/governance/ACTIVE_TRACK.yaml
            grep -F 'constitutional ActionEnvelope in dharma_swarm/action_effects/envelope.py' docs/governance/ACTIVE_TRACK.yaml
            grep -F 'action-effect dispatcher in dharma_swarm/action_effects/dispatcher.py' docs/governance/ACTIVE_TRACK.yaml
            grep -F '| remove tracked hook registration | no | BLOCKED_DEPENDENCY | H1a |' \
              docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md

            git config user.name 'humming-a0-coherence[bot]'
            git config user.email 'humming-a0-coherence[bot]@users.noreply.github.com'
            git add docs/governance/ACTIVE_TRACK.yaml \
              docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md
            git diff --cached --check
            git commit -m 'docs(humming): normalize A0 ontology path language'
            git push \
              --force-with-lease="refs/heads/${A0_BRANCH}:${A0_EXPECTED_HEAD}" \
              origin "HEAD:refs/heads/${A0_BRANCH}"
          )
