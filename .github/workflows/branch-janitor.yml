name: branch-janitor

# Weekly branch TTL sweep (branch/sprawl dive 2026-07-04).
#
# DRY-RUN ONLY by default. The weekly schedule always dry-runs; deletion
# happens only when an operator manually dispatches this workflow with the
# execute input flipped to true. Even then, every deleted branch is first
# preserved as tag archive/pr<N>--<branch> at its tip, and only branches with
# hard evidence (tip == merged-PR head OID, or closed-PR head match past the
# 14-day idle window) are touched. docs/governance/BRANCH_REGISTRY.yaml
# lineages are never touched.
#
# Receipt persistence: uploaded as a workflow artifact, NOT committed via a
# PR. Artifact upload needs zero write permission, while a receipt PR would
# need contents:write + pull-requests:write on a scheduled job and would
# create a fresh branch every week — a janitor manufacturing sprawl.

on:
  schedule:
    - cron: "45 6 * * 1" # weekly Monday 06:45 UTC, after stale-pr at 06:30
  workflow_dispatch:
    inputs:
      execute:
        description: "Tag-and-delete evidenced branches (leave false for dry-run)"
        type: boolean
        default: false

concurrency:
  group: branch-janitor
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  dry-run:
    name: Branch janitor dry-run
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.execute) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run janitor (dry-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/governance/branch_janitor.py --dry-run

      - name: Upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-janitor-receipt
          path: reports/governance/branch_janitor_*.md
          retention-days: 90

  execute:
    name: Branch janitor execute
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run janitor (execute)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/governance/branch_janitor.py --execute

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-janitor-execute-receipt
          path: reports/governance/branch_janitor_*.md
          retention-days: 400
