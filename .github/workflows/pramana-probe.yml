# Pramana probe — advisory tiered verification conductor (weekly deep run).
#
# ADVISORY BY DESIGN (Stage 0 of the trust ratchet, same staging as
# pudgala-rigor.yml): this workflow is schedule/dispatch-only, is NOT
# pull_request-triggered, is NOT a required check, and the probe step is
# continue-on-error — it can never block anything. It exists to produce a
# weekly evidence receipt (schema dharma.pramana_probe.receipt.v1) so the
# probe's verdict history accumulates while it has no consumer.
#
# Promotion path is NOT PR CI: every engine the probe runs already has a
# dedicated workflow, so a required PR gate here would only double-run them.
# The probe's real consumer is the self-improvement loop (Forge autoloop /
# merge trust), which needs the REFUTED-vs-degraded distinction to
# auto-reject candidate changes. Only once that consumer reads these
# receipts does "required gate" become a meaningful question (Stage 1).
#
# Probe exit semantics: 0 all gates green, 1 at least one gate failed,
# 3 phantom registry (config error — no verdict was produced).
# Budget: ~2-3 minutes (dependency install dominates; the gates run <10s).

name: Pramana probe — advisory deep verification

on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs per repo workflow policy.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the module-budget gate diffs origin/main...HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run probe deep tier (advisory)
        continue-on-error: true # advisory: the verdict is a signal, never a block
        run: |
          set +e
          python scripts/governance/pramana_probe.py --tier deep --json \
            --receipt "$RUNNER_TEMP/pramana_probe_receipt.json"
          rc=$?
          echo "probe exit code: $rc (0=all green, 1=gate failure, 3=phantom registry)"
          {
            echo "## Pramana probe (deep tier, advisory)"
            echo '```json'
            cat "$RUNNER_TEMP/pramana_probe_receipt.json" 2>/dev/null \
              || echo '{"error": "no receipt produced (config error, exit 3)"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Upload receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pramana-probe-receipt
          path: ${{ runner.temp }}/pramana_probe_receipt.json
          if-no-files-found: warn # exit-3 config error produces no receipt
