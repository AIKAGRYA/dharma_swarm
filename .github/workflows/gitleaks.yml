name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="${RUNNER_TEMP}/${asset}"
          install_dir="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --show-error --silent --location \
            --retry 3 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            --output "${archive}"
          printf '%s  %s\n' \
            "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" \
            | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          actual_version="$("${install_dir}/gitleaks" version)"
          if [ "${actual_version}" != "${GITLEAKS_VERSION}" ]; then
            echo "::error::Expected Gitleaks ${GITLEAKS_VERSION}, got ${actual_version}"
            exit 2
          fi
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Select revision range
        id: scan-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          validate_sha() {
            local sha="$1"
            if ! printf '%s\n' "${sha}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Invalid commit SHA for ${EVENT_NAME}: ${sha}"
              exit 2
            fi
            if ! git cat-file -e "${sha}^{commit}"; then
              echo "::error::Commit is unavailable after full-history checkout: ${sha}"
              exit 2
            fi
          }

          select_range() {
            local base="$1"
            local head="$2"
            validate_sha "${base}"
            validate_sha "${head}"
            log_opts="--diff-merges=first-parent ${base}..${head}"
          }

          case "${EVENT_NAME}" in
            push)
              validate_sha "${PUSH_AFTER}"
              if [ "${PUSH_BEFORE}" = "${zero_sha}" ]; then
                log_opts="--full-history --diff-merges=first-parent ${PUSH_AFTER}"
              else
                select_range "${PUSH_BEFORE}" "${PUSH_AFTER}"
              fi
              ;;
            pull_request)
              select_range "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
              ;;
            merge_group)
              select_range "${MERGE_GROUP_BASE_SHA}" "${MERGE_GROUP_HEAD_SHA}"
              ;;
            workflow_dispatch)
              log_opts="--full-history --all --diff-merges=first-parent --diff-filter=tuxdb"
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}"
              exit 2
              ;;
          esac

          printf 'log_opts=%s\n' "${log_opts}" >> "${GITHUB_OUTPUT}"

      - name: Scan selected revisions
        shell: bash
        env:
          GITLEAKS_LOG_OPTS: ${{ steps.scan-range.outputs.log_opts }}
        run: |
          set -euo pipefail
          gitleaks git \
            --config .gitleaks.toml \
            --redact=100 \
            --verbose \
            --no-banner \
            --no-color \
            --platform github \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --log-opts="${GITLEAKS_LOG_OPTS}" \
            .

      - name: Upload redacted Gitleaks SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: gitleaks-results.sarif
          if-no-files-found: ignore
          retention-days: 7
