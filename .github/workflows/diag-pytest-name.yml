name: diag-pytest-name
# One-shot diagnostic (temporary branch, delete after use): reproduce the
# merge-queue contract-test failure on the current runner image, then prove
# the fix on PR #1438 cures it. Control = main (unfixed), verify = fixed files.
on:
  push:
    branches: [diag-pytest-name]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main (unfixed)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Record runner git version
        run: git --version
      - name: CONTROL — unfixed tests on this image (expected FAIL)
        id: control
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: sk-or-stub
          ANTHROPIC_API_KEY: sk-ant-stub
          TINY_ROUTER_BACKEND: heuristic
        run: |
          python -m pytest -q --tb=line \
            "tests/test_orientation_graph.py::test_orientation_graph_render_is_read_only" \
            "tests/test_make_onboarding_contract.py::test_make_rejects_cache_symlink_escape_before_prerequisites" \
            2>&1 | grep -vE "^E? *'" | tail -30
          exit ${PIPESTATUS[0]}
      - name: Overlay fix from PR 1438 branch
        run: |
          git fetch --quiet origin fix/contract-test-commit-graph-noise-20260825
          git checkout FETCH_HEAD -- tests/test_make_onboarding_contract.py tests/test_orientation_graph.py
      - name: VERIFY — same tests with the fix (must PASS)
        env:
          OPENROUTER_API_KEY: sk-or-stub
          ANTHROPIC_API_KEY: sk-ant-stub
          TINY_ROUTER_BACKEND: heuristic
        run: |
          python -m pytest -q --tb=short \
            "tests/test_orientation_graph.py::test_orientation_graph_render_is_read_only" \
            "tests/test_make_onboarding_contract.py::test_make_rejects_cache_symlink_escape_before_prerequisites" \
            | tail -5
      - name: Verdict
        run: |
          echo "control (unfixed) outcome: ${{ steps.control.outcome }}  <- 'failure' proves the repro on this image"
          echo "verify (fixed) reached this step only by passing."
