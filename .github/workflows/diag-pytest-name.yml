name: diag-pytest-name
# One-shot diagnostic (temporary branch, delete after use): print the FAILED
# test names from queue run 32323816139's saved pytest output artifact.
on:
  push:
    branches: [diag-pytest-name]
permissions:
  actions: read
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pytest-results-3.11
          run-id: "32323816139"
          github-token: ${{ github.token }}
      - name: Print failed test names and summary
        run: |
          set -euo pipefail
          echo "=== FAILED lines ==="
          grep -E "^FAILED" pytest_output.txt || true
          echo "=== test headers ==="
          grep -E "^_{10,} test" pytest_output.txt || true
          echo "=== commit-graph mentions (count) ==="
          grep -c "commit-graphs" pytest_output.txt || true
          echo "=== summary ==="
          tail -3 pytest_output.txt
          echo "=== git version used by that run's make targets is runner git; record image tools ==="
          git --version
