name: semgrep

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1'  # Mon 10:00 UTC weekly drift scan

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    timeout-minutes: 15

    # Skip on Dependabot PRs — Dependabot doesn't have access to our config.
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate owned Semgrep rule fixtures
        run: |
          scripts/governance/run_semgrep_with_ca.sh --test \
            --config .semgrep/dharma-anti-slop.yml \
            .semgrep/tests/test_no_new_substrate.py

      - name: Run Semgrep CI
        # In CI we run BOTH the local .semgrep/ rules and the registry
        # security pack. Phase 4 will hard-fail on dharma-anti-slop rules;
        # for now CI is fail-on-ERROR and warn-on-WARNING.
        run: |
          scripts/governance/run_semgrep_with_ca.sh ci \
            --config .semgrep \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --metrics=off \
            --sarif \
            --output=semgrep-results.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fee9466b8957867761f2d78f922ab084e3e2dd17 # v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Strict gate (local rules only)
        # Local .semgrep/ rules are our owned signal. Fail the build on
        # any ERROR in our own rules — registry packs are advisory only.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi

          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            scripts/governance/run_semgrep_with_ca.sh --config .semgrep --error --metrics=off --baseline-commit "$base"
          else
            scripts/governance/run_semgrep_with_ca.sh --config .semgrep --error --metrics=off
          fi
