name: semgrep

on:
  pull_request:
    branches: [main, "promote/**", "governance/**"]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.go'
      # The scanner's own rules and its invoker. Deleting a detection rule must
      # run the scanner, not silence it — the self-coverage rule this PR applies
      # to workflow files, applied one level down to rule definitions.
      - '.semgrep/**'
      - 'scripts/governance/run_semgrep_with_ca.sh'
      # p/security-audit carries Dockerfile and shell rules; without these a
      # risky container or script change would produce no scan.
      - 'Dockerfile*'
      - '**/*.sh'
      - '.github/workflows/semgrep.yml'
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 10 * * 1'  # Mon 10:00 UTC weekly drift scan

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    timeout-minutes: 15

    # Skip on Dependabot PRs — Dependabot doesn't have access to our config.
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Semgrep CI
        # In CI we run BOTH the local .semgrep/ rules and the registry
        # security pack. Phase 4 will hard-fail on dharma-anti-slop rules;
        # for now CI is fail-on-ERROR and warn-on-WARNING.
        run: |
          scripts/governance/run_semgrep_with_ca.sh ci \
            --config .semgrep \
            --config p/python \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --metrics=off \
            --sarif \
            --output=semgrep-results.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fee9466b8957867761f2d78f922ab084e3e2dd17 # v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Strict gate (local rules only)
        # Local .semgrep/ rules are our owned signal. Fail the build on
        # any ERROR in our own rules — registry packs are advisory only.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi

          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            scripts/governance/run_semgrep_with_ca.sh --config .semgrep --error --metrics=off --baseline-commit "$base"
          else
            scripts/governance/run_semgrep_with_ca.sh --config .semgrep --error --metrics=off
          fi

  # ===========================================================================
  # The behavioral contract for anti-slop Rule 2 (.semgrep/dharma-anti-slop.yml
  # + .semgrep/tests/test_no_new_substrate.py). Added 2026-08-04.
  #
  # WHY A SEPARATE JOB. Until now these tests SKIPPED in every automated lane:
  # the pytest jobs install `.[dev]`, which carries no scanner, and the job
  # above only runs production scans — so a regression deleting a detection
  # shape went green everywhere, and the PR-time strict gate is
  # `--baseline-commit`-scoped and examines no unchanged Python file. That is
  # the same defect class as the one Rule 2's own message carried for fifteen
  # weeks: a promise no execution ever checked.
  #
  # WHY NOT `semgrep` IN THE `dev` EXTRA. That would install the scanner into
  # both required pytest matrix jobs and put its transitive pins (click, rich,
  # requests, ...) into resolution with the whole package — a dependency
  # conflict there takes down a REQUIRED lane. This job installs only
  # `semgrep` + `pytest`, pinned to the ratified 1.168.0, and the test file
  # imports nothing from dharma_swarm.
  #
  # LIMITATION, STATED: as of 2026-08-04 `semgrep` is not among main's
  # required status checks (those are DocOps integrity gate, Coherence Delta
  # PR body, gitleaks, pytest 3.11, pytest 3.12, Onboarding admission parity),
  # so this job is visible-and-red rather than merge-blocking until the
  # operator adds it to branch protection. It executes; it does not yet gate.
  # ===========================================================================
  rule2-behavior:
    name: anti-slop rule 2 behavioral contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the ratified scanner and pytest
        run: |
          python -m pip install --upgrade pip
          pip install "semgrep==1.168.0" "pytest>=7.0"

      - name: Behavioral contract (fixture assertions, no skips permitted)
        env:
          # Turns a missing scanner into a hard failure instead of a skip.
          DHARMA_REQUIRE_SEMGREP: "1"
          # Fails closed if the installed scanner ever drifts off the pin.
          DHARMA_SEMGREP_EXPECTED_VERSION: "1.168.0"
        run: |
          # --noconftest: tests/conftest.py has an autouse fixture that imports
          # dharma_swarm; this test file needs no repo fixtures, only the
          # scanner. -rs surfaces any skip in the log, and the
          # test_scanner_is_present_where_this_contract_is_required guard turns
          # the one that would matter into a failure.
          python -m pytest -q -rs --noconftest tests/test_semgrep_rule2_behavior.py
