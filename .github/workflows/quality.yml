name: Code Quality (advisory)

# Wires the full Tier-A code-quality stack across Python + TypeScript surfaces.
# Currently advisory (continue-on-error: true) so we capture baselines without
# blocking merges. Promote each tool to required after the baseline is clean.
#
# Tools:
#   Python   — vulture (dead code), radon (complexity), bandit (security),
#              mypy (types), pyright (types, strict), pytest --cov (coverage)
#   TypeScript — fallow (dashboard: dead code + duplication + complexity)
#
# Baselines and per-run reports go to job artifacts.

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install vulture==2.* radon==6.* bandit==1.* mypy==1.* pyright==1.* pytest pytest-asyncio pytest-cov pytest-timeout
          pip install -e .

      - name: Vulture — dead code (advisory)
        continue-on-error: true
        run: |
          mkdir -p quality-reports
          vulture dharma_swarm/ .vulture_whitelist.py \
            --min-confidence 80 --sort-by-size \
            | tee quality-reports/vulture.txt || true

      - name: Radon CC — cyclomatic complexity (advisory; flag > 10)
        continue-on-error: true
        run: |
          radon cc dharma_swarm/ -a -nc --total-average \
            | tee quality-reports/radon-cc.txt || true

      - name: Radon MI — maintainability index (advisory; flag MI < 65)
        continue-on-error: true
        run: |
          radon mi dharma_swarm/ -nc -s \
            | tee quality-reports/radon-mi.txt || true

      - name: Bandit — security (advisory)
        continue-on-error: true
        run: |
          bandit -r dharma_swarm/ -ll -f txt \
            | tee quality-reports/bandit.txt || true

      - name: Mypy (advisory)
        continue-on-error: true
        run: |
          mypy dharma_swarm/ --ignore-missing-imports --no-error-summary \
            | tee quality-reports/mypy.txt || true

      - name: Pyright (advisory; uses pyrightconfig.json)
        continue-on-error: true
        run: |
          pyright dharma_swarm/ --outputjson > quality-reports/pyright.json || true

      - name: pytest --cov (advisory; report only, no fail-under yet)
        continue-on-error: true
        run: |
          pytest --cov=dharma_swarm --cov-report=term --cov-report=xml:quality-reports/coverage.xml -q --tb=line \
            | tee quality-reports/pytest-cov.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-quality-reports
          path: quality-reports/

  dashboard-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci || npm install

      - name: Fallow — dead code + duplication + complexity (advisory)
        continue-on-error: true
        working-directory: dashboard
        run: |
          mkdir -p ../quality-reports
          npx --yes fallow check --json > ../quality-reports/fallow.json 2>&1 || true
          npx --yes fallow check 2>&1 | tee ../quality-reports/fallow.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-quality-reports
          path: quality-reports/
