name: merge-master-mike-router

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number for a deterministic Mike packet
        required: true
        type: string
      merge_when_clean:
        description: Ask Mike to arm auto-merge after the deterministic gate is clean
        required: false
        default: false
        type: boolean

permissions:
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: merge-master-mike-pr-${{ github.event.inputs.pr || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  route:
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
          (
            contains(github.event.comment.body, '@merge-master-mike') ||
            contains(github.event.comment.body, '@merge_master_mike') ||
            contains(github.event.comment.body, '@mix-master-mike') ||
            contains(github.event.comment.body, '@mix_master_mike') ||
            contains(github.event.comment.body, '@MERGE_MASTER_MIKE') ||
            contains(github.event.comment.body, '@mike') ||
            contains(github.event.comment.body, '@terminal-review')
          ) &&
          (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Halt on loop kill-switch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Loop kill-switch (docs/ops/loop_control/README.md): file present on
          # the loop-control branch => HALT (exit 1, red-while-halted); absent
          # (404 on file or branch) => proceed; any other error => fail closed.
          url="repos/${GH_REPO}/contents/docs/ops/loop_control/KILLSWITCH?ref=loop-control"
          if response="$(gh api "$url" 2>&1)"; then
            echo "HALTED BY KILLSWITCH (docs/ops/loop_control/KILLSWITCH on loop-control)" >&2
            echo "## 🔴 HALTED BY KILLSWITCH — router refuses all commands" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif echo "$response" | grep -qiE "HTTP 404|\"status\": *\"404\"|Not Found|No commit found"; then
            echo "kill-switch absent; proceeding"
          else
            echo "kill-switch state UNKNOWN — failing closed: $response" >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Determine PR number
        id: pr
        run: |
          if [ -n "${PR_FROM_INPUT:-}" ]; then
            echo "number=${PR_FROM_INPUT}" >> "${GITHUB_OUTPUT}"
          elif [ -n "${PR_FROM_REVIEW:-}" ]; then
            echo "number=${PR_FROM_REVIEW}" >> "${GITHUB_OUTPUT}"
          elif [ -n "${PR_FROM_ISSUE:-}" ]; then
            echo "number=${PR_FROM_ISSUE}" >> "${GITHUB_OUTPUT}"
          else
            echo "could not determine pull request number" >&2
            exit 1
          fi
        env:
          PR_FROM_INPUT: ${{ inputs.pr }}
          PR_FROM_ISSUE: ${{ github.event.issue.number }}
          PR_FROM_REVIEW: ${{ github.event.pull_request.number }}

      - name: Detect Mike command
        id: command
        run: |
          set -euo pipefail
          merge_when_clean=false
          backlog_requested=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${MERGE_WHEN_CLEAN_INPUT:-false}" = "true" ]; then
            merge_when_clean=true
          else
            body="$(printf '%s' "${COMMENT_BODY:-}" | tr '[:upper:]' '[:lower:]')"
            case "${body}" in
              *"merge when clean"*|*"auto merge when clean"*|*"automerge when clean"*)
                merge_when_clean=true
                ;;
            esac
            case "${body}" in
              *"all open pr"*|*"all of the open pr"*|*"open pr"*|*"open pull request"*|*"all pr"*|*"all pull request"*|*"backlog"*|*"queue"*|*"pr cleanup"*|*"pull request cleanup"*|*"cleanly merged"*)
                backlog_requested=true
                ;;
            esac
          fi
          echo "merge_when_clean=${merge_when_clean}" >> "${GITHUB_OUTPUT}"
          echo "backlog_requested=${backlog_requested}" >> "${GITHUB_OUTPUT}"
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          MERGE_WHEN_CLEAN_INPUT: ${{ inputs.merge_when_clean }}

      - name: Post immediate Merge Master Mike acknowledgement
        id: ack
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BACKLOG_REQUESTED: ${{ steps.command.outputs.backlog_requested }}
          MERGE_WHEN_CLEAN: ${{ steps.command.outputs.merge_when_clean }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/merge-master-mike-ack.md"
          {
            echo "<!-- dharma-pr-review-control:ack-${GITHUB_RUN_ID} -->"
            echo
            echo "## Merge Master Mike Received This"
            echo
            echo "- PR: \`#${PR_NUMBER}\`"
            echo "- Backlog requested: \`${BACKLOG_REQUESTED}\`"
            echo "- Merge when clean requested: \`${MERGE_WHEN_CLEAN}\`"
            echo "- Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "I am preparing the packet/gate or backlog fanout now and will update this comment with the result."
          } > "${body}"
          url="$(gh pr comment "${PR_NUMBER}" --body-file "${body}")"
          echo "comment_id=${url##*issuecomment-}" >> "${GITHUB_OUTPUT}"

      - name: Run Merge Master Mike request
        id: mike
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_WHEN_CLEAN: ${{ steps.command.outputs.merge_when_clean }}
          BACKLOG_REQUESTED: ${{ steps.command.outputs.backlog_requested }}
          # Devin commits and opens PRs but does not post review receipts, so
          # requiring a devin receipt left the gate permanently unclearable.
          # Required receipts = the agents that actually review (see #559 pile).
          #
          # D2 (track merge-master-mike-d4): the always-on cloud quorum is
          # codex — its native reviewer App posts real reviews the gate can
          # bridge at the exact current head. claude never posted a receipt in
          # the cloud (no cloud reviewer), so it stays the deep/backup lane.
          # Operator ratification 2026-07-31: copilot is REMOVED as a required
          # receipt (zero copilot reviews repo-wide kept this gate permanently
          # unclearable; credits burn fast and reviews are unreliable). Copilot
          # reviews remain ACCEPTED additively via TRUSTED_REVIEW_LOGINS but
          # are never required. Ratchet: tests/test_pr_merge_control_github_reviews.py.
          REQUIRED_REVIEWERS: codex
          # D1: count a trusted installed reviewer-App's native GitHub review
          # (Codex App = codex, Copilot = copilot) as that agent's receipt when
          # no local receipt file exists. Strictly additive — never waives CI,
          # conflict, unresolved-thread, or CHANGES_REQUESTED checks — so the
          # quorum can clear in the cloud with no operator machine.
          DHARMA_PR_ACCEPT_GITHUB_REVIEWS: "true"
          MERGE_METHOD: squash
          MERGE_MASTER_MIKE_NATS_URL: ${{ secrets.MERGE_MASTER_MIKE_NATS_URL }}
          MERGE_MASTER_MIKE_NATS_USER: ${{ secrets.MERGE_MASTER_MIKE_NATS_USER }}
          MERGE_MASTER_MIKE_NATS_PW: ${{ secrets.MERGE_MASTER_MIKE_NATS_PW }}
          MERGE_MASTER_MIKE_NATS_CA_PEM: ${{ secrets.MERGE_MASTER_MIKE_NATS_CA_PEM }}
          MERGE_MASTER_MIKE_NATS_TLS_HOSTNAME: ${{ vars.MERGE_MASTER_MIKE_NATS_TLS_HOSTNAME || secrets.MERGE_MASTER_MIKE_NATS_TLS_HOSTNAME }}
          MERGE_MASTER_MIKE_NATS_REQUIRED: ${{ vars.MERGE_MASTER_MIKE_NATS_REQUIRED || 'false' }}
          DEVIN_NATS_URL: ${{ secrets.DEVIN_NATS_URL }}
          DEVIN_NATS_USER: ${{ secrets.DEVIN_NATS_USER }}
          DEVIN_NATS_PW: ${{ secrets.DEVIN_NATS_PW }}
          DEVIN_NATS_CA_PEM: ${{ secrets.DEVIN_NATS_CA_PEM }}
          DEVIN_NATS_TLS_HOSTNAME: ${{ vars.DEVIN_NATS_TLS_HOSTNAME || secrets.DEVIN_NATS_TLS_HOSTNAME }}
        run: |
          set -euo pipefail
          state_root="${RUNNER_TEMP}/dharma-pr-review"
          request_exit=0
          gate_exit=0
          merge_exit=0

          if [ "${BACKLOG_REQUESTED}" = "true" ]; then
            python3 -m pip install 'nats-py>=2.9' 'aiohttp>=3.9'
            # A backlog fanout has no per-PR, exact-head operator warrant
            # input. It may gather evidence and render gates, but it cannot
            # construct MergeAuthorized and therefore never actuates.
            merge_mode=off
            args=(
              --state-root "${state_root}"
              fanout
              --limit 100
              --max-prs 5
              --statuses GITHUB_GREEN_NEEDS_PACKET,NEEDS_AGENT_REVIEW
              --required-reviewers "${REQUIRED_REVIEWERS}"
              --merge-mode "${merge_mode}"
              --merge-method "${MERGE_METHOD}"
              --packet-only
              --nats-session
              --nats-timeout-s 8
            )
            if [ "${MERGE_MASTER_MIKE_NATS_REQUIRED}" = "true" ]; then
              args+=(--nats-required)
            fi
            set +e
            python3 -u scripts/runtime/pr_merge_control.py "${args[@]}"
            request_exit="$?"
            set -e
            latest="$(find "${state_root}/mike_fanout" -name summary.md -type f | sort | tail -1 || true)"
            {
              echo "<!-- dharma-pr-review-control:run-${GITHUB_RUN_ID} -->"
              echo
              echo "## Merge Master Mike Backlog Request"
              echo
              echo "- Trigger PR: \`#${PR_NUMBER}\`"
              echo "- Backlog mode: \`packet-only\`"
              echo "- Merge mode: \`${merge_mode}\`"
              echo "- NATS required: \`${MERGE_MASTER_MIKE_NATS_REQUIRED}\`"
              echo "- Required reviewers: \`${REQUIRED_REVIEWERS}\`"
              echo "- Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- Exit code: \`${request_exit}\`"
              echo
              if [ -n "${latest}" ]; then
                cat "${latest}"
              else
                echo "No Mike fanout summary was written. Check the Actions run logs."
              fi
            } > "${RUNNER_TEMP}/merge-master-mike.md"
          else
            python3 scripts/runtime/pr_merge_control.py --state-root "${state_root}" packet --pr "${PR_NUMBER}"
            packet_dir="$(find "${state_root}/pr-${PR_NUMBER}" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
            policy_exit=1
            authorization_report="${state_root}/merge-authorization-${PR_NUMBER}.json"
            if [ "${MERGE_WHEN_CLEAN}" = "true" ]; then
              # Construct the typed authority value before gate evaluation.
              # The evaluator gathers native current-head AI evidence and an
              # exact current-head operator warrant from this trusted
              # default-branch checkout. Its report is an input to the gate,
              # never a predictable token or mutable label.
              set +e
              python3 scripts/governance/check_automerge_tier_policy.py \
                --repo "${GITHUB_REPOSITORY}" \
                --pr "${PR_NUMBER}" \
                --assume-unattended \
                --output "${authorization_report}"
              policy_exit="$?"
              set -e
            fi
            if [ "${policy_exit}" = "0" ]; then
              set +e
              python3 scripts/runtime/pr_merge_control.py \
                --state-root "${state_root}" \
                gate \
                --pr "${PR_NUMBER}" \
                --packet-dir "${packet_dir}" \
                --required-reviewers "${REQUIRED_REVIEWERS}" \
                --merge-authorization "${authorization_report}"
              gate_exit="$?"
              set -e
            else
              set +e
              python3 scripts/runtime/pr_merge_control.py \
                --state-root "${state_root}" \
                gate \
                --pr "${PR_NUMBER}" \
                --packet-dir "${packet_dir}" \
                --required-reviewers "${REQUIRED_REVIEWERS}"
              gate_exit="$?"
              set -e
            fi
            if [ "${MERGE_WHEN_CLEAN}" = "true" ]; then
              if [ "${policy_exit}" != "0" ]; then
                merge_exit="${policy_exit}"
                echo "authority policy did not construct a permit (exit ${policy_exit})" >&2
              else
                set +e
                python3 scripts/runtime/pr_merge_control.py \
                  --state-root "${state_root}" \
                  merge \
                  --pr "${PR_NUMBER}" \
                  --packet-dir "${packet_dir}" \
                  --required-reviewers "${REQUIRED_REVIEWERS}" \
                  --merge-authorization "${authorization_report}" \
                  --method "${MERGE_METHOD}" \
                  --auto \
                  --execute \
                  --confirm "automerge-policy-pass-${PR_NUMBER}"
                merge_exit="$?"
                set -e
              fi
            fi
            python3 scripts/runtime/pr_merge_control.py \
              --state-root "${state_root}" \
              comment \
              --pr "${PR_NUMBER}" \
              --packet-dir "${packet_dir}" \
              --output "${RUNNER_TEMP}/merge-master-mike.md"
          fi
          echo "request_exit=${request_exit}" >> "${GITHUB_OUTPUT}"
          echo "gate_exit=${gate_exit}" >> "${GITHUB_OUTPUT}"
          echo "merge_exit=${merge_exit}" >> "${GITHUB_OUTPUT}"

      - name: Post Merge Master Mike comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
          ACK_COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
        run: |
          set -euo pipefail
          marker="<!-- dharma-pr-review-control:auto -->"
          if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            if [ -n "${ACK_COMMENT_ID:-}" ]; then
              gh api --method PATCH \
                "/repos/${GITHUB_REPOSITORY}/issues/comments/${ACK_COMMENT_ID}" \
                -f body="$(cat "${RUNNER_TEMP}/merge-master-mike.md")"
            else
              gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/merge-master-mike.md"
            fi
          else
            existing="$(gh pr view "${PR_NUMBER}" --json comments \
              --jq '.comments[] | select(.body | startswith("'"${marker}"'")) | .url | split("issuecomment-")[-1]' \
              | head -1)"
            if [ -n "${existing}" ]; then
              gh api --method PATCH \
                "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
                -f body="$(cat "${RUNNER_TEMP}/merge-master-mike.md")"
            else
              gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/merge-master-mike.md"
            fi
          fi

      - name: Summarize
        run: |
          echo "merge-master-mike backlog requested: ${{ steps.command.outputs.backlog_requested }}"
          echo "merge-master-mike request exit: ${{ steps.mike.outputs.request_exit }}"
          echo "merge-master-mike gate exit: ${{ steps.mike.outputs.gate_exit }}"
          echo "merge-master-mike merge requested: ${{ steps.command.outputs.merge_when_clean }}"
          echo "merge-master-mike merge exit: ${{ steps.mike.outputs.merge_exit }}"
          cat "${RUNNER_TEMP}/merge-master-mike.md"

      - name: Fail failed backlog infrastructure requests after posting
        if: ${{ steps.command.outputs.backlog_requested == 'true' && steps.mike.outputs.request_exit != '0' }}
        run: exit 1

      - name: Upload Mike receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: merge-master-mike-router-${{ github.run_id }}
          path: ${{ runner.temp }}/dharma-pr-review
          if-no-files-found: warn
