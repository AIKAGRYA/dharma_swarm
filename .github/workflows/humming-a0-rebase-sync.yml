name: humming-a0-rebase-sync

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: humming-a0-rebase-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebuild-parent:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/humming-a0-rebase-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_ADDOPTS: '-p no:cacheprovider'
      HUMMING_MAIN_SHA: a8da9bb5bffa2031f3e0b699261a94dd8ecb2ef1
      HUMMING_A0_PARENT_HEAD: 3c35c65719738cf24b48fc7ba8ba125c484b09a2
      HUMMING_A0_PARENT_BRANCH: codex/humming-v2-a0-portfolio-admission
    steps:
      - name: Checkout temporary synchronization branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/humming-a0-rebase-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Confine tool state and install declared dependencies
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/humming-a0-rebase"
          mkdir -p "${root}"/{pycache,xdg,ruff,pip,hypothesis,ops}
          printf '%s\n' \
            "PYTHONPYCACHEPREFIX=${root}/pycache" \
            "XDG_CACHE_HOME=${root}/xdg" \
            "RUFF_CACHE_DIR=${root}/ruff" \
            "PIP_CACHE_DIR=${root}/pip" \
            "HYPOTHESIS_STORAGE_DIRECTORY=${root}/hypothesis" \
            "DHARMA_OPS_DIR=${root}/ops" \
            >> "${GITHUB_ENV}"
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Verify exact live main and exact prior A0 head
        run: |
          set -euo pipefail
          git fetch origin main "${HUMMING_A0_PARENT_BRANCH}"
          test "$(git rev-parse origin/main)" = "${HUMMING_MAIN_SHA}"
          test "$(git rev-parse origin/${HUMMING_A0_PARENT_BRANCH})" = "${HUMMING_A0_PARENT_HEAD}"
          test "$(git merge-base HEAD origin/main)" = "${HUMMING_MAIN_SHA}"
          base="${RUNNER_TEMP}/humming-a0-live-main"
          git worktree add --detach "${base}" "${HUMMING_MAIN_SHA}"
          (
            cd "${base}"
            make onboard
            make organism-status
            if grep -Eq '^[[:space:]]*orient:' Makefile; then make orient; fi
          )
          git worktree remove "${base}"

      - name: Rebuild A0 semantically on current main and publish exact five-file head
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/humming-a0-rebased-parent"
          git worktree add --detach "${target}" "${HUMMING_MAIN_SHA}"
          mkdir -p "${target}/docs/plans/handoffs"
          git show "origin/${HUMMING_A0_PARENT_BRANCH}:docs/governance/ACTIVE_TRACK.yaml" \
            > "${target}/docs/governance/ACTIVE_TRACK.yaml"
          git show "origin/${HUMMING_A0_PARENT_BRANCH}:docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md" \
            > "${target}/docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md"

          python -m py_compile scripts/governance/humming_a0_rebase_sync.py
          python scripts/governance/humming_a0_rebase_sync.py \
            --repo-root "${target}" \
            --main-sha "${HUMMING_MAIN_SHA}" \
            --prior-head "${HUMMING_A0_PARENT_HEAD}"

          (
            cd "${target}"
            python scripts/governance/render_active_track_includes.py
            python scripts/docops/check_docops_integrity.py \
              --write-auto-sections --write-manifest-counts
            python "${GITHUB_WORKSPACE}/scripts/governance/humming_a0_rebase_sync.py" \
              --repo-root "${target}" \
              --main-sha "${HUMMING_MAIN_SHA}" \
              --prior-head "${HUMMING_A0_PARENT_HEAD}"

            track_status_rc=0
            python scripts/governance/check_track_status.py || track_status_rc=$?
            if [ "${track_status_rc}" -ne 0 ]; then
              echo "::group::Exact durable-invoker regression diagnostics"
              for seed in 1 2 3 4 5; do
                echo "--- PYTHONHASHSEED=${seed} ---"
                PYTHONHASHSEED="${seed}" \
                  python -m pytest -vv -x tests/test_graph_durable_invoker.py || true
              done
              echo "::endgroup::"
              exit "${track_status_rc}"
            fi

            python scripts/governance/render_active_track_includes.py --check
            python scripts/docops/check_docops_integrity.py
            python -m pytest -q \
              tests/test_active_track_governance.py \
              tests/test_track_portfolio.py \
              tests/test_track_closure_rigor.py \
              tests/test_claim_evidence_binding.py \
              tests/test_docops_integrity.py
            git diff --check

            changed="$(
              {
                git diff --name-only
                git ls-files --others --exclude-standard
              } | sort -u
            )"
            expected="$(printf '%s\n' \
              CLAUDE.md \
              docs/docops/AUTO_INVENTORY.md \
              docs/governance/ACTIVE_TRACK.yaml \
              docs/governance/SOVEREIGN_MANIFEST.md \
              docs/plans/handoffs/HUMMING_V2_EXECUTION_LEDGER_2026-08-01.md \
              | sort)"
            printf 'Observed final paths:\n%s\n' "${changed}"
            test "${changed}" = "${expected}"
            test ! -e .github/workflows/humming-a0-repair.yml
            test ! -e .github/workflows/humming-a0-rebase-sync.yml
            test ! -e scripts/governance/humming_a0_rebase_sync.py

            git config user.name 'humming-a0-rebase[bot]'
            git config user.email 'humming-a0-rebase[bot]@users.noreply.github.com'
            while IFS= read -r path; do
              [ -n "${path}" ] && git add -- "${path}"
            done <<< "${changed}"
            git diff --cached --check
            git commit -m 'rebase(humming): preserve WP-0D amendment in A0 admission'
            git push \
              --force-with-lease="refs/heads/${HUMMING_A0_PARENT_BRANCH}:${HUMMING_A0_PARENT_HEAD}" \
              origin "HEAD:refs/heads/${HUMMING_A0_PARENT_BRANCH}"
          )
