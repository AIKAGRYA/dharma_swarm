[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dharma-swarm"
version = "0.1.0"
description = "Darwin-Heuristic Autonomous Recursive Meta-Agent Swarm"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Shrader", email = "dhyana@example.com" }]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "httpx>=0.25",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "scipy>=1.11",
    "textual>=0.40",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "cryptography>=50.0.0",
    "icontract>=2.6",
    "croniter>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
ingest = ["markitdown>=0.1.6"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "pytest-timeout>=2.3", "pytest-rerunfailures>=14.0", "ruff==0.15.16", "hypothesis>=6.100", "mutmut>=3.5", "scikit-learn>=1.3"]
router = ["fasttext-wheel>=0.9.2", "redis>=5.0.0"]
infra = [
    "langgraph>=0.2.0",
    "temporalio>=1.8.0",
    "qdrant-client>=1.11.0",
    "neo4j>=5.25.0",
]
ginko = [
    "hmmlearn>=0.3",
    "arch>=6.0",
    "yfinance>=0.2",
]
# Differential-oracle lane ONLY (dharmagraph-engine-2026-07 Phase 1):
# real langgraph is reference semantics / a test oracle, never the engine —
# it must NOT enter core dependencies (track non-goal).
test-oracle = [
    "langgraph==1.2.4",
    "langgraph-checkpoint>=4.1,<5",
    "langgraph-checkpoint-sqlite==3.1.0",
]

[project.scripts]
dharma-swarm = "dharma_swarm.cli:app"
dgc = "dharma_swarm.dgc_cli:main"

[tool.setuptools.packages.find]
include = ["dharma_swarm*"]
exclude = ["hooks*", "scripts*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
markers = [
    "slow: long-running test, excluded from smoke runs",
    "docker: requires a local Docker daemon",
]
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
    "ignore:`torch.jit.script` is not supported in Python 3.14\\+ and may break\\. Please switch to `torch.compile` or `torch.export`\\.:DeprecationWarning",
]

[tool.mutmut]
# S6 mutation gate (Pudgala Autopoiesis Protostar P3-09). Scoped to the kernel's load-bearing
# surface so one run is tractable; widen paths_to_mutate as the gate is adopted.
# The runner is the kernel's own fast test file, so mutants are scored against
# meaningful assertions (a trivially-true test lets mutants survive -> low score
# -> the gate blocks). Produce the report with `make mutation-test`.
# paths_to_mutate MUST be a TOML array: mutmut's pyproject reader iterates the
# value directly, so a bare string is walked character by character and the "/"
# character makes mutmut walk the whole filesystem root. A single-element array
# is the one shape mutmut reads correctly here.
paths_to_mutate = ["dharma_swarm/spine/receipt.py"]
runner = "python -m pytest -x -q tests/test_claim_evidence_binding.py"
# tests_dir drives mutmut's test selection and must be a TOML array (same
# character-iteration hazard as paths_to_mutate). Point it at the single fast
# kernel test file so the mutant score is graded against meaningful assertions
# and one run stays tractable.
tests_dir = ["tests/test_claim_evidence_binding.py"]
# mutmut runs the suite from inside the copied `mutants/` tree, so the rest of
# the package and the governance scripts the runner imports (memory_kernel,
# check_track_status) must be copied alongside the single mutated module. Only
# receipt.py (paths_to_mutate) is instrumented; these are copied clean.
also_copy = ["dharma_swarm", "scripts", "docs/governance"]
