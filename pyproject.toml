[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dharma-swarm"
version = "0.1.0"
description = "Darwin-Heuristic Autonomous Recursive Meta-Agent Swarm"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Shrader", email = "dhyana@example.com" }]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "httpx>=0.25",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "scipy>=1.11",
    "textual>=0.40",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "pytest-timeout>=2.3"]
quality = [
    "vulture>=2.14",
    "radon>=6.0",
    "bandit>=1.7",
    "mypy>=1.10",
    "pyright>=1.1.380",
]
router = ["fasttext-wheel>=0.9.2", "redis>=5.0.0"]
infra = [
    "langgraph>=0.2.0",
    "temporalio>=1.8.0",
    "qdrant-client>=1.11.0",
    "neo4j>=5.25.0",
]
ginko = [
    "hmmlearn>=0.3",
    "arch>=6.0",
    "yfinance>=0.2",
]

[project.scripts]
dharma-swarm = "dharma_swarm.cli:app"
dgc = "dharma_swarm.dgc_cli:main"

[tool.setuptools.packages.find]
include = ["dharma_swarm*"]
exclude = ["hooks*", "scripts*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
    "ignore:`torch.jit.script` is not supported in Python 3.14\\+ and may break\\. Please switch to `torch.compile` or `torch.export`\\.:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Code-quality stack (Tier A) — added 2026-05-09.
# Each tool runs via `make quality` (composite), `make <tool>` (single), or
# the .github/workflows/quality.yml advisory CI job. Pre-commit hooks
# are wired warn-only initially; promote to error once baselines are clean.
# Deep doc + governance routing: scripts/governance/route_quality_findings.py
# ---------------------------------------------------------------------------

[tool.vulture]
paths = ["dharma_swarm/", ".vulture_whitelist.py"]
min_confidence = 80
sort_by_size = true
exclude = ["dharma_swarm/_archive*", "tests/", ".venv/"]

[tool.coverage.run]
source = ["dharma_swarm"]
branch = true
omit = ["*/tests/*", "*/_archive*", "*/__main__.py"]

[tool.coverage.report]
# fail_under not set yet — will be promoted to 50 then 70 once baselines stabilize.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
files = ["dharma_swarm"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# strict_equality and disallow_any_generics will be promoted in Tier-B.

[tool.bandit]
exclude_dirs = ["tests", ".venv", "_archive"]
skips = ["B101"]  # B101: assert_used — ok in our code paths
# Severity gate: report all; CI is advisory; pre-commit is warn-only.
