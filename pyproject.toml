[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dharma-swarm"
version = "0.1.0"
description = "Darwin-Heuristic Autonomous Recursive Meta-Agent Swarm"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "John Shrader", email = "dhyana@example.com" }]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "httpx>=0.25",
    "aiosqlite>=0.19",
    "aiofiles>=23.0",
    "scipy>=1.11",
    "textual>=0.40",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "pytest-timeout>=2.3"]
router = ["fasttext-wheel>=0.9.2", "redis>=5.0.0"]
infra = [
    "langgraph>=0.2.0",
    "temporalio>=1.8.0",
    "qdrant-client>=1.11.0",
    "neo4j>=5.25.0",
]
ginko = [
    "hmmlearn>=0.3",
    "arch>=6.0",
    "yfinance>=0.2",
]

[project.scripts]
dharma-swarm = "dharma_swarm.cli:app"
dgc = "dharma_swarm.dgc_cli:main"

[tool.setuptools.packages.find]
include = ["dharma_swarm*"]
exclude = ["hooks*", "scripts*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
markers = [
    "slow: long-running tests excluded from smoke runs",
    "docker: tests requiring a Docker daemon",
    "network: tests requiring outbound network access",
]
filterwarnings = [
    "ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
    "ignore:'asyncio.set_event_loop_policy' is deprecated and slated for removal in Python 3.16:DeprecationWarning",
    "ignore:`torch.jit.script` is not supported in Python 3.14\\+ and may break\\. Please switch to `torch.compile` or `torch.export`\\.:DeprecationWarning",
]

[tool.ruff]
# Baseline config (Honest Spine v2 Phase 0). Lint rules start narrow and
# correctness-focused; widen only after the numeric baseline is burned down.
target-version = "py311"
line-length = 120
extend-exclude = ["migration_delta", "feasibility_workspaces", "dashboard", "reports"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — real bugs (undefined names, unused imports)
    "E9",     # syntax/indentation errors
    "B",      # bugbear — mutable defaults, dead branches
    "ASYNC",  # blocking calls / unawaited coroutines in async code
    "T20",    # print() in library code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"scripts/*" = ["T20"]
"hooks/*" = ["T20"]
"dharma_swarm/terminal_commands/*" = ["T20"]
"dharma_swarm/dgc_cli.py" = ["T20"]
"dharma_swarm/cli.py" = ["T20"]

[tool.coverage.run]
source = ["dharma_swarm"]
omit = ["dharma_swarm/tui_legacy.py", "*/__pycache__/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
