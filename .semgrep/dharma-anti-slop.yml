rules:
  # ===========================================================================
  # Rule 1: dharma.no-unauthorized-dharma-write
  # Reference to ~/.dharma outside the canonical owner allowlist.
  # Matches reads AND writes by design — non-owners shouldn't even
  # know about ~/.dharma; they should go through RuntimeStateStore.
  # WARNING because the canonical-owner allowlist is incomplete and
  # tightening the pattern (writes-only) is a separate refinement.
  # ===========================================================================
  - id: dharma.no-unauthorized-dharma-write
    message: |
      Reference to ~/.dharma detected outside the canonical owner allowlist.
      Even reads should go through RuntimeStateStore (dharma_swarm/runtime_state.py)
      so state ownership stays centralized. If this module legitimately owns
      a slice of ~/.dharma, add the file to the allowlist below AFTER
      declaring the owned surface in ACTIVE_SURFACE_MANIFEST.yaml. See
      docs/governance/ANTI_SLOP_RULES.md Rule 1 for the procedure.
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        # Canonical owners (verified via 2026-04-26 audit)
        - "dharma_swarm/runtime_state.py"
        - "dharma_swarm/system_rv.py"
        - "dharma_swarm/daemon_config.py"
        - "dharma_swarm/experiment_log.py"
        - "dharma_swarm/pulse.py"
        - "dharma_swarm/custodians.py"
        - "dharma_swarm/kaizen_ops_local.py"
        - "dharma_swarm/scout_report.py"
        - "dharma_swarm/review_cycle.py"
        - "dharma_swarm/ginko_backtest.py"
        - "dharma_swarm/ginko_evolution.py"
        - "dharma_swarm/engine/store_sync.py"
        # Operational cron scripts (own knowledge staging/review/trusted surfaces, agent state, logs)
        - "scripts/consume_review_marks.py"
        - "scripts/hermes_heartbeat_poll.py"
        - "scripts/check_provider_credits.py"
        # Memory Common door + retrieval gates (own memory_kernel_reports receipt
        # sink and read the vector store; surface declared in
        # ACTIVE_SURFACE_MANIFEST.yaml state_dir, PR #1132)
        - "dharma_swarm/memory_common.py"
        - "scripts/memory_retrieval_broad_sweep.py"
        - "scripts/memory_retrieval_live_gate.py"
        - "scripts/memory_retrieval_system_gate.py"
        # WP-0C1R ratified research participants (operator decision A1,
        # 2026-08-02): declared in ACTIVE_SURFACE_MANIFEST.yaml
        # research_state_participants; adjudication record
        # reports/governance/titanium/wp0c1r_semgrep_adjudication_2026-08-02.md.
        # Exact files only — no globs (plan forbids broad ignores).
        - "dharma_swarm/palantir_pilot_manifest.py"
        - "scripts/governance/palantir_pilot_audit.py"
        - "scripts/governance/register_palantir_pilot.py"
        - "scripts/research/palantir_contribution_packets.py"
        - "scripts/research/palantir_deep_ingest.py"
        - "scripts/research/palantir_learning_backlog.py"
        - "scripts/research/palantir_pilot_curriculum.py"
        - "scripts/research/palantir_pilot_orientation.py"
        - "scripts/research/palantir_pilot_query.py"
        - "scripts/research/palantir_playbook_evals.py"
        - "scripts/research/palantir_public_source_cards.py"
        - "scripts/research/palantir_public_source_index.py"
        - "scripts/research/palantir_query_cookbook.py"
        - "scripts/research/palantir_source_card_balanced_expand.py"
        - "scripts/research/palantir_source_card_cleanup.py"
        - "scripts/research/palantir_source_card_playbooks.py"
        - "scripts/research/palantir_source_card_quality.py"
        - "dharma_swarm/verifier_ranker_v0/inventory.py"
    pattern: Path.home() / ".dharma"

  # ===========================================================================
  # Rule 2: dharma.no-new-substrate
  # New persistent stores (Store/Ledger/Registry classes that open
  # their own SQLite or append their own JSONL) should be wrapped by
  # RuntimeStateStore, not created as new substrates.
  #
  # Detector scope is stated literally in the message below and proven by
  # BEHAVIORAL fixtures — .semgrep/tests/test_no_new_substrate.py executed
  # against THIS file by tests/test_semgrep_rule2_behavior.py. Config-shape
  # assertions in tests/test_semgrep_wrapper.py are a supplement, not the
  # proof: before 2026-08-04 this message promised JSONL detection the rule
  # never had, and only a scanner run could have shown it (correction:
  # reports/governance/titanium/wp0c1r_semgrep_adjudication_2026-08-02.md,
  # "Amendment 2026-08-04").
  # ===========================================================================
  - id: dharma.no-new-substrate
    message: |
      New persistence-substrate class detected. dharma_swarm should have
      ONE canonical state store per closure layer (see correlation_spine
      in ACTIVE_SURFACE_MANIFEST.yaml). Adding a new Store / Ledger /
      Registry that opens its own SQLite or appends its own JSONL creates
      substrate drift unless the class declares a closure-layer role.
      Options:
        (a) wrap the data in an existing canonical-store, or
        (b) declare a role from docs/governance/ANTI_SLOP_RULES.md
            (Rule 2 vocabulary: canonical-store | derived-view |
            plugin-sink | cache | legacy-mirror | migration-mirror |
            exempt) in a file-header comment AND, if it is a receipt,
            add an entry to ACTIVE_SURFACE_MANIFEST.yaml
            correlation_spine.layers, then adjudicate the class with the
            operator. The three exemptions below are NAME-scoped grants to
            three specific classes, not a general waiver.

      WHAT THIS DETECTOR CATCHES (each shape has a fixture line in
      .semgrep/tests/test_no_new_substrate.py):
        - sqlite3/aiosqlite `.connect(...)` reached from a class body or any
          method body — attribute assignment, local variable, bare call,
          `async def`, nested inside if/try/with, and the
          `with sqlite3.connect(...) as conn:` context-manager form;
        - an append-mode file handle opened in a method body:
          `open(path, "a")`, `open(path, mode="a")`, `p.open("a")`,
          `p.open(mode="a")`, and the `with ... as f:` form of each
          (append modes a / ab / at / a+ / ab+ / at+). This is the JSONL
          substrate this message promised from 2026-04-26 and did not
          actually detect until 2026-08-04;
        - a class inheriting from one of the three ratified exempt
          substrates below.

      WHAT IT STILL DOES NOT CATCH (named, not silently missed):
        - a substrate opened through a helper/wrapper function, a factory,
          or an injected connection object — that needs interprocedural
          taint, not a syntactic pattern;
        - aliased builtins (`io.open(p, "a")`, `codecs.open(p, "a")`) and a
          mode passed as a variable rather than a literal;
        - drivers other than sqlite3/aiosqlite (duckdb, lmdb, psycopg, ...)
          and non-text append sinks (csv/parquet/binary writers);
        - a class whose name does not end in Store/Ledger/Registry/Substrate;
        - an append handle opened directly in a class body rather than in a
          method;
        - a SECOND class re-using a ratified exempt NAME inside that class's
          own module — the exemptions are name-scoped and a semgrep class
          pattern written without bases also matches a class WITH bases, so
          `class KnowledgeStore(Protocol)` is swallowed here. That specific
          collision is caught by dharma.no-new-substrate-exempt-name-collision
          below (behavioral), backed by the structural collision check in
          tests/test_semgrep_wrapper.py.
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "dharma_swarm/runtime_state.py"
    patterns:
      # WP-0C1R ratified roles (operator decision B1, 2026-08-02): exemptions
      # are CLASS-scoped, not file-scoped, so any NEW Store/Ledger/Registry
      # added to the same files is still caught (paths.exclude runs before the
      # class pattern and would skip the whole file — decorrelated review
      # 2026-08-02). Each class's file carries a structural
      # `# closure-layer-role: <role>` header (vocabulary: exempt — subordinate
      # adapter/projection under the MemoryKernel doctrine, CLAUDE.md).
      # NOTE (2026-08-04): "class-scoped" is precisely NAME-scoped — see the
      # message's last "does not catch" bullet and the companion collision
      # rule. Adjudication record
      # reports/governance/titanium/wp0c1r_semgrep_adjudication_2026-08-02.md.
      - pattern-not: |
          class BridgeRegistry:
              ...
      - pattern-not: |
          class SQLiteGraphStore:
              ...
      - pattern-not: |
          class KnowledgeStore:
              ...
      # The shared shape set. Anchored here and reused verbatim by the
      # collision rule below so the two rules can never drift apart.
      # NOTE: every alternative that constrains a metavariable nests its own
      # `patterns:` block — a top-level metavariable-regex naming a
      # metavariable that a given alternative does not bind DISCARDS that
      # alternative's matches (verified against semgrep 1.168.0).
      - pattern-either: &dharma-substrate-open-shapes
          # --- SQLite / aiosqlite, opened in the class body ---
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      $DRIVER.connect(...)
                      ...
              - metavariable-regex:
                  metavariable: $DRIVER
                  regex: '^(sqlite3|aiosqlite)$'
          # --- SQLite / aiosqlite, reached from any method body. Covers
          #     `self.conn = ...`, a bare local `conn = ...`, a bare call,
          #     `async def` + `await`, and nesting inside if/try/with. ---
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          $DRIVER.connect(...)
                          ...
              - metavariable-regex:
                  metavariable: $DRIVER
                  regex: '^(sqlite3|aiosqlite)$'
          # --- SQLite / aiosqlite as a context manager. A `with` header is
          #     not a statement, so the shapes above never see it. ---
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          with $DRIVER.connect(...) as $CONN:
                              ...
              - metavariable-regex:
                  metavariable: $DRIVER
                  regex: '^(sqlite3|aiosqlite)$'
          # --- Append-mode handle from the builtin `open`, positional mode.
          #     `$PATH` is a required first argument: `open(..., $MODE, ...)`
          #     would let $MODE bind the FILENAME and flag `open("audit.log")`.
          #     MODE REGEX (2026-08-04): CPython parses the mode string as a
          #     SET of flags — `open(p, "+a")`, `"ba"`, `"ta"`, `"+ab"` and
          #     `"b+a"` all append (io.open: `modes = set(mode)`; appending =
          #     `"a" in modes`). An anchored `^"a[bt+]*"$` therefore missed
          #     every non-canonical ordering, so the flag characters are now
          #     matched independent of position. `"w+"`, `"rb"`, `"x"` and the
          #     filename `"audit.log"` still do not match.
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          open($PATH, $MODE, ...)
                          ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          with open($PATH, $MODE, ...) as $F:
                              ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          # --- Append-mode handle from the builtin `open`, keyword mode ---
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          open(..., mode=$MODE, ...)
                          ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          with open(..., mode=$MODE, ...) as $F:
                              ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          # --- Append-mode handle from `Path.open` (mode is the first
          #     positional parameter there), plain and context-manager. ---
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          $P.open($MODE, ...)
                          ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          with $P.open($MODE, ...) as $F:
                              ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          $P.open(mode=$MODE, ...)
                          ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          - patterns:
              - pattern: |
                  class $NAME:
                      ...
                      def $M(...):
                          ...
                          with $P.open(mode=$MODE, ...) as $F:
                              ...
              - metavariable-regex:
                  metavariable: $MODE
                  regex: '^["''][bt+]*a[bt+]*["'']$'
          # --- Inheriting a ratified exempt substrate is a new substrate:
          #     the exemption was granted to those three classes, not to a
          #     subclass tree hanging off them. ---
          - pattern: |
              class $NAME(BridgeRegistry):
                  ...
          - pattern: |
              class $NAME(SQLiteGraphStore):
                  ...
          - pattern: |
              class $NAME(KnowledgeStore):
                  ...
      - metavariable-regex:
          metavariable: $NAME
          regex: '.*(Store|Ledger|Registry|Substrate)$'

  # ===========================================================================
  # Rule 2b: dharma.no-new-substrate-exempt-name-collision
  # Rule 2's ratified exemptions are class-NAME-scoped `pattern-not` clauses,
  # and a semgrep class pattern written without bases ALSO matches a class
  # with bases (verified, semgrep 1.168.0). So a second class re-using a
  # ratified name silently inherits its exemption. Before 2026-08-04 the only
  # guard was a config-shape test that grepped source text; this makes the
  # guard behavioral — the scanner itself refuses the collision.
  # ===========================================================================
  - id: dharma.no-new-substrate-exempt-name-collision
    message: |
      This class re-uses one of the three WP-0C1R ratified exempt substrate
      names (BridgeRegistry / SQLiteGraphStore / KnowledgeStore) with a
      different definition — it declares explicit base classes — AND opens its
      own persistence substrate. Rule 2's exemptions are class-NAME-scoped, so
      this definition would silently inherit an exemption it was never
      granted. Rename the class, or adjudicate it with the operator through
      the same route WP-0C1R used (declare the closure-layer role, then record
      the disposition in reports/governance/titanium/). The sqlite-free
      `KnowledgeStore(Protocol)` in dharma_swarm/engine/knowledge_store.py is
      deliberately NOT a finding: this rule fires only when the colliding
      class actually opens a substrate.
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "dharma_swarm/runtime_state.py"
    patterns:
      - pattern-either: *dharma-substrate-open-shapes
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(BridgeRegistry|SQLiteGraphStore|KnowledgeStore)$'
      # Requires explicit base classes, which the three ratified definitions
      # in bridge_registry.py / knowledge_units.py do not have. SQLiteGraphStore
      # legitimately has one, so its exact ratified signature is excluded.
      - pattern: |
          class $NAME($BASE):
              ...
      - pattern-not: |
          class SQLiteGraphStore(GraphStore):
              ...

  # ===========================================================================
  # Rule 4: dharma.scripts-no-git-add-all
  # Scripts must not blanket-stage with `git add -A` or `git add .`.
  # ===========================================================================
  - id: dharma.scripts-no-git-add-all
    message: |
      `git add -A` / `git add .` blanket-stages everything. This can
      pick up .env files, generated reports, secrets, or another author's
      in-flight work. Always pass explicit paths.
    severity: ERROR
    languages: [python, bash]
    paths:
      exclude:
        - "scripts/uplift_guards/"
    pattern-either:
      - pattern: |
          $RUN([..., "git", "add", "-A", ...], ...)
      - pattern: |
          $RUN([..., "git", "add", ".", ...], ...)
      - pattern: |
          $RUN("git add -A", ...)
      - pattern: |
          $RUN("git add .", ...)
      - pattern: |
          asyncio.create_subprocess_exec("git", "add", "-A", ...)
      - pattern: |
          asyncio.create_subprocess_exec("git", "add", ".", ...)

  # ===========================================================================
  # Rule 6: dharma.providers-canonical
  # All anthropic/openai/ollama SDK imports must live inside the canonical
  # provider factory module (dharma_swarm/providers.py or providers_extended.py).
  # ===========================================================================
  - id: dharma.providers-canonical
    message: |
      LLM provider SDK import outside the canonical providers.py /
      providers_extended.py factory. This duplicates connection handling,
      bypasses retry/budget controls, and confuses provider-routing.
      Move the SDK import into providers.py and call through the factory.
      Known offender at the time this rule was added:
        dharma_swarm/autonomous_agent.py:468 (fix in a separate PR
        before this rule is promoted to ERROR).
    # WARNING until autonomous_agent.py:468 is refactored.
    # TODO(governance): promote to ERROR once that fix lands.
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "dharma_swarm/providers.py"
        - "dharma_swarm/providers_extended.py"
        - "dharma_swarm/runtime_provider/"
    pattern-either:
      - pattern: from anthropic import $X
      - pattern: import anthropic
      - pattern: import anthropic as $X
      - pattern: from openai import $X
      - pattern: import openai
      - pattern: import openai as $X
      - pattern: import ollama
      - pattern: import ollama as $X
      - pattern: from ollama import $X

  # ===========================================================================
  # Rules implemented OUTSIDE Semgrep
  # ===========================================================================
  # Rule 3 (test-no-default-state): scripts/governance/check_test_hygiene.py
  #   (Semgrep auto-excludes tests/ and we couldn't override.)
  # Rule 5 (tests-no-dgc-subprocess): scripts/governance/check_test_hygiene.py
  #   (Same auto-exclusion issue.)
  # Rule 7 (no-lf5-whole-file-restore): .github/workflows/commit-lint.yml
  #   (Semgrep can't read commit messages.)
  # Rule 8 (no-root-markdown): .github/workflows/structure.yml
  #   (Semgrep can't see new-file placement at PR-level granularity.)
  # Rule 9 (no-committed-guardian-report): .github/workflows/structure.yml
  #   (A path-glob is the natural expression.)
  # Rule 10 (module-line-budget): .github/workflows/module-budget.yml
  #   + scripts/governance/check_module_budget.py
  #   (Needs file-size diff between commits.)
