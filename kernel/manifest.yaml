# Titanium Telos Gates v3 — machine-readable manifest
#
# Loaded and validated by `telos_kernel.manifest.load_manifest`.
# Any change to this file requires a K=3/N=5 Ed25519 quorum signature
# per U2 (Phase 1 activates enforcement; Phase 0 loads and boot-binds it).
#
# Signer set below is a STUB. Real Ed25519 public keys must replace the
# placeholders before U2 transitions to enforced. Until then, the kernel
# emits a WARN boot receipt (`signature_status: STUB`).
#
# TODO(signers): replace all `public_key_hex: STUB` entries with real
# 32-byte Ed25519 public keys (64 hex chars) before Phase 1 lands
# enforcement. Track in issue: <link when opened>.

schema_version: v3.0
version: phase-0.1

invariants:
  - id: U0
    name: anekanta_context_indexing
    predicate: >
      Every gate-touching assertion carries an explicit context index φ
      such that the compiled form is ∀x[φ(x) → p(x)]; unqualified claims
      of svabhāva-like fact are violations.
    measure: >
      Count of distinct context_indices across {dravya, kṣetra, kāla, bhāva}
      on proposal metadata; distinct-index check ¬[φᵢ ↔ φⱼ].
    threshold:
      min_indices: 3
      require_non_overlap: true
    receipt_type: U0_anekanta
    falsification_test: benchmarks/telos_redteam/u0_pseudo_context.py
    tier: A+B
    citations:
      - "[Ghose & Patra 2025](https://arxiv.org/html/2505.09333v1)"
      - "[Abramsky & Brandenburger 2011](https://arxiv.org/abs/1102.0264)"
    enforcement_status: declared

  - id: U1
    name: bypass_cost_asymmetry
    predicate: >
      Legitimate satisfaction is O(1); bypass is super-polynomial
      (proof-of-work, cryptographic quorum, or capability-token forgery).
    measure: bypass_cost_ratio = expected_bypass_cost / expected_compliant_cost
    threshold:
      high_salience_min_ratio: 1000
      low_salience_min_ratio: 10
    receipt_type: U1_bypass
    falsification_test: benchmarks/telos_redteam/u1_jailbreak_bypass.py
    tier: A+B
    citations:
      - "[Miller 2006, Robust Composition](https://worrydream.com/refs/Miller_2006_-_Robust_Composition.pdf)"
    enforcement_status: declared

  - id: U2
    name: k2_quorum_on_manifest_edits
    predicate: >
      Any change to kernel/manifest.yaml requires K-of-N signed quorum
      where signers are drawn from a capability-scoped signer set.
    measure: valid Ed25519 signatures over SHA-256(manifest_diff || prev_root)
    threshold:
      k: 3
      n: 5
      require_prev_root_binding: true
    receipt_type: U2_k2quorum
    falsification_test: benchmarks/telos_redteam/u2_replay.py
    tier: A+B
    citations:
      - "[Fagin, Halpern, Moses, Vardi — Reasoning About Knowledge](https://www.cs.rice.edu/~vardi/papers/book.pdf)"
    enforcement_status: declared

  - id: U3
    name: sandbagging_self_model_divergence
    predicate: >
      Agent's stated capability profile must agree with revealed behavior
      on a rolling capability probe within a bounded consistency margin.
    measure: >
      Ensemble of KL(P_stated || P_revealed), Anthropic defection probe,
      Apart noise-injection sandbagging classifier, LM monitor.
    threshold:
      require_two_independent_detectors: true
      fpr_calibration: 0.01
    receipt_type: U3_sandbag
    falsification_test: benchmarks/telos_redteam/u3_password_locked.py
    tier: A+B
    citations:
      - "[Ward et al., Tall Tales at Different Scales](https://openreview.net/forum?id=YRXDl6I3j5)"
      - "[Hubinger et al., Sleeper Agents](https://arxiv.org/abs/2401.05566)"
      - "[Apollo Research, arXiv:2412.04984](https://arxiv.org/abs/2412.04984)"
      - "[van der Weij et al., arXiv:2406.07358](https://arxiv.org/abs/2406.07358)"
      - "[Apart, arXiv:2412.01784](https://arxiv.org/abs/2412.01784)"
    enforcement_status: declared

  - id: U4
    name: no_hidden_causal_harm
    predicate: >
      For every (tainted source T, protected sink S) pair,
      P(S | do(T=t)) = P(S | do(T=t')) for all t, t' (no derived causal flow).
    measure: >
      Tier A: O(V+E) reachability on labeled provenance DAG.
      Tier B: y0 symbolic identification over ADMG.
      Tier C: DoWhy identify_effect + refute_estimate cross-check.
    threshold:
      tier_a_reachability: zero_unlabeled_path
      tier_b_require_identifiable_and_estimand_independent: true
      tier_c_refutation_p_gt: 0.05
    receipt_type: U4_pratitya
    falsification_test: benchmarks/telos_redteam/u4_verma_hidden_flow.py
    tier: A+B+C
    citations:
      - "[Shpitser & Pearl, JMLR 2008](https://www.jmlr.org/papers/volume9/shpitser08a/shpitser08a.pdf)"
      - "[Huang & Valtorta, arXiv:1206.6831](https://arxiv.org/pdf/1206.6831.pdf)"
    enforcement_status: declared

  - id: U5
    name: kernel_tamper_evidence_hash_chain
    predicate: >
      Every Merkle leaf L_i is bound to L_{i-1} such that
      H(L_i) = SHA-256(JCS(payload_i) || H(L_{i-1})).
    measure: verify_chain() returns (True, None) or (False, first_broken_index)
