# Single-host soak harness for the dharma_swarm daemon. NO Kubernetes.
# The container is disposable; the archive lives in a named volume so it
# persists across version swaps. Image tag MUST equal the build_id.
#   BUILD_ID=0.1.0+<sha> docker compose -f deploy/daemon/compose.daemon.yml up -d
services:
  daemon:
    build:
      context: ../..
      dockerfile: deploy/daemon/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-unknown}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    image: dharma-daemon:${BUILD_ID:-unknown}
    restart: unless-stopped
    ports:
      - "7433:7433"
    environment:
      DHARMA_BUILD_SHA: ${BUILD_SHA:-unknown}
      DHARMA_STATE_DIR: /state
    volumes:
      - dharma_state:/state

volumes:
  dharma_state:
