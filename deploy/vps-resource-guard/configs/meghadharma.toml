[guard]
host = "meghadharma"
expected_hostname = "meghadharma-cloud"
memory_ceiling_percent = 85.0
recovery_percent = 78.0
critical_percent = 92.0
poll_interval_seconds = 5.0
cooldown_seconds = 300.0
state_file = "/var/lib/vps-resource-guard/state.json"
receipt_file = "/var/log/vps-resource-guard/receipts.jsonl"
receipt_max_bytes = 5242880
minimum_candidate_memory_bytes = 134217728

[[targets]]
id = "dharma-command-backend"
action = "docker-restart"
target = "dharma-command-backend"
priority = 10

[[targets]]
id = "hermes"
action = "docker-restart"
target = "hermes"
priority = 10

[[targets]]
id = "dharma-swarm"
action = "docker-restart"
target = "dharma-swarm"
priority = 10

[[targets]]
id = "dharma-command-edge"
action = "docker-restart"
target = "dharma-command-edge"
priority = 10
