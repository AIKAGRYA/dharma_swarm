      - id: L0
        name: Bootstrap
        purpose: Enter safely before loading the reserved apex holon identity.
        budget_tokens: 1000
        source_kind: bootstrap
        source_paths:
          - CLAUDE.md
          - docs/agents/sarathi/SARATHI_CONTRACT.md
        commands:
          - make onboard
        required_answers:
          - where am I
          - that Sarathi is reserved and not the Cursor harness seat
        search_allowed: false

      - id: L1
        name: Routing MOC
        purpose: Confirm whether the reserved apex holon should load or defer to operator_guide_cursor.
        budget_tokens: 1500
        source_kind: routing_moc
        source_paths:
          - docs/agents/operator_guide_cursor/OPERATOR_GUIDE_CURSOR_CONTRACT.md
          - docs/architecture/AGENT_HIERARCHY_MATURITY_MAP.md
        commands: []
        required_answers:
          - is Sarathi live yet
          - should the operator use operator_guide_cursor instead
        search_allowed: false

      - id: L2
        name: Active Track Packet
        purpose: Load apex holon build intent and blockers only.
        budget_tokens: 4000
        source_kind: active_track_packet
        source_paths:
          - docs/architecture/APEX_HOLON_LONG_RUNNING_GOAL_SPEC.md
          - docs/architecture/AGENT_HIERARCHY_MATURITY_MAP.md
        commands:
          - python3 scripts/governance/check_track_status.py
        required_answers:
          - what apex proof is still missing
          - whether operator should use operator_guide_cursor instead
        search_allowed: false

      - id: L4
        name: Corpus Search
        purpose: Search broader context only after bootstrap, routing, and active intent are known.
        budget_tokens: task_specific
        source_kind: corpus_search
        source_paths:
          - docs/agents/sarathi/
          - docs/architecture/
          - reports/governance/
        commands: []
        required_answers:
          - which additional context is relevant
          - whether the result changes the seat-load decision
        search_allowed: true

      - id: L5
        name: Seat Load
        purpose: Load the reserved Sarathi apex holon identity when live.
        budget_tokens: task_specific
        source_kind: named_agent_seat_load
        source_paths:
          - docs/agents/sarathi/SARATHI_CONTRACT.md
          - docs/architecture/APEX_HOLON_LONG_RUNNING_GOAL_SPEC.md
        commands:
          - make onboard
        required_answers:
          - what identity is being loaded
          - why this is not operator_guide_cursor
          - what policy ceiling applies
        search_allowed: false

  - id: route.seat_operator_guide_cursor
