schema_version: dharma.semantic_objects.v1
objects:
  A2ACard:
    kind: runtime_object
    owner: dharma_swarm.a2a.agent_card.AgentCard
    description: Agent discovery and capability card.
    required_fields:
      - name
      - agent_uid
      - supported_interfaces
    required_internal_route: A2AInboxRoute
  AgentUID:
    kind: identifier
    description: Stable durable agent identifier used in internal NATS subjects.
    subject_token_rules:
      forbidden_chars:
        - "."
        - "*"
        - ">"
        - "/"
        - "\\"
      whitespace_allowed: false
  NATSSubstrate:
    kind: transport_substrate
    description: Internal live fleet transport backed by NATS/JetStream.
    external_edge: false
  A2AInboxRoute:
    kind: route_binding
    alias: agent-inbox
    substrate: NATSSubstrate
    subject_template: dharma.agent.<agent_uid>.inbox
    ack_subject_template: dharma.agent.<agent_uid>.inbox.ack.<packet_id>
    reply_subject_template: dharma.agent.<agent_uid>.inbox.reply.<packet_id>
    implemented_by:
      sender: scripts/runtime/a2a_send.py
      bridge: scripts/runtime/a2a_inbox_bridge.py
      card_resolver: dharma_swarm/a2a/agent_card.py
  ModelKeyRouting:
    kind: governance_contract
    owner: docs/ops/MODEL_KEY_ROUTING.md
    description: Canonical contract for provider keys, runtime providers, model order, and routing memory.
    canonical_components:
      key_store: DKeysKeyStore
      runtime_provider: RuntimeProvider
      model_order: ModelHierarchy
      provider_policy: ProviderPolicyRouter
      router: ModelRouter
      learning_state: RoutingMemory
    deprecated_patterns:
      - parallel model routing layer
      - project .env keys
      - direct provider factory
      - scattered model order
  DKeysKeyStore:
    kind: key_store
    owner: dharma_swarm/api_keys.py
    description: The single approved path for provider key lookup, backed by dkeys and ~/.dharma/agent_keys.env.
  RuntimeProvider:
    kind: provider_factory
    owner: dharma_swarm/runtime_provider.py
    description: The single runtime provider resolution and creation door for model calls.
  ModelHierarchy:
    kind: routing_order
    owner: dharma_swarm/model_hierarchy.py
    description: Canonical most-powerful-first model and route ordering.
  ProviderPolicyRouter:
    kind: routing_policy
    owner: dharma_swarm/provider_policy.py
    description: Policy layer that selects and escalates provider families without bypassing ModelKeyRouting.
  ModelRouter:
    kind: runtime_router
    owner: dharma_swarm/providers.py
    description: Provider router that executes model calls under RuntimeProvider and ModelHierarchy constraints.
  RoutingMemory:
    kind: routing_telemetry
    owner: dharma_swarm/routing_memory.py
    description: Provider-learning evidence store for route outcomes; telemetry, not semantic canon.
  IntelligenceSupplyChainRawReceipt:
    kind: evidence_receipt
    owner: dharma_swarm.world_radar.bronze
    track: loop-closure-2026-06
    description: Content-addressed Bronze receipt for a sanctioned external signal treated as untrusted data.
    required_fields:
      - schema_version
      - receipt_id
      - content_hash
      - source_url
      - fetch_method
      - license
      - prov
      - instruction_policy
  FrontierCouncilBoundarySignal:
    kind: verifier_boundary
    owner: dharma_swarm.world_radar.bronze
    track: loop-closure-2026-06
    description: Meet-point artifact handed to the decorrelated frontier council; not a verifier verdict or apply permission.
    required_fields:
      - schema_version
      - boundary_id
      - verifier_interface
      - source_receipt_id
      - content_hash
      - guardrails
      - not_applied
