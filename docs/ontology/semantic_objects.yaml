schema_version: dharma.semantic_objects.v1
objects:
  A2ACard:
    kind: runtime_object
    owner: dharma_swarm.a2a.agent_card.AgentCard
    description: Agent discovery and capability card.
    required_fields:
      - name
      - agent_uid
      - supported_interfaces
    required_internal_route: A2AInboxRoute
  AgentUID:
    kind: identifier
    description: Stable durable agent identifier used in internal NATS subjects.
    subject_token_rules:
      forbidden_chars:
        - "."
        - "*"
        - ">"
        - "/"
        - "\\"
      whitespace_allowed: false
  NATSSubstrate:
    kind: transport_substrate
    description: Internal live fleet transport backed by NATS/JetStream.
    external_edge: false
  A2AInboxRoute:
    kind: route_binding
    alias: agent-inbox
    substrate: NATSSubstrate
    subject_template: dharma.agent.<agent_uid>.inbox
    ack_subject_template: dharma.agent.<agent_uid>.inbox.ack.<packet_id>
    reply_subject_template: dharma.agent.<agent_uid>.inbox.reply.<packet_id>
    implemented_by:
      sender: scripts/runtime/a2a_send.py
      bridge: scripts/runtime/a2a_inbox_bridge.py
      card_resolver: dharma_swarm/a2a/agent_card.py
  ModelKeyRouting:
    kind: governance_contract
    owner: dharma_swarm.model_routing
    description: One-way contract that keeps provider keys and model selection behind canonical routing surfaces.
  DKeysKeyStore:
    kind: secret_store
    owner: dharma_swarm.api_keys
    description: Durable key material source; feature code must not read project-local provider secrets directly.
  RuntimeProvider:
    kind: runtime_adapter
    owner: dharma_swarm.runtime_provider.RuntimeProvider
    description: Runtime provider adapter selected by policy rather than scattered model literals.
  ModelHierarchy:
    kind: routing_catalog
    owner: dharma_swarm.model_hierarchy
    description: Canonical model tier and fallback catalog.
  ProviderPolicyRouter:
    kind: policy_router
    owner: dharma_swarm.model_routing.ProviderPolicyRouter
    description: Policy layer that chooses allowed providers for a task and context.
  ModelRouter:
    kind: routing_facade
    owner: dharma_swarm.model_routing.ModelRouter
    description: Public model routing facade used by callers instead of direct provider factories.
  RoutingMemory:
    kind: routing_receipt_layer
    owner: dharma_swarm.model_routing
    description: Receipt and memory layer for routing decisions and drift checks.
  IntelligenceSupplyChainRawReceipt:
    kind: evidence_receipt
    owner: dharma_swarm.world_radar.bronze
    track: loop-closure-2026-06
    description: Content-addressed Bronze receipt for a sanctioned external signal treated as untrusted data.
    required_fields:
      - schema_version
      - receipt_id
      - content_hash
      - source_url
      - fetch_method
      - license
      - prov
      - instruction_policy
  FrontierCouncilBoundarySignal:
    kind: verifier_boundary
    owner: dharma_swarm.world_radar.bronze
    track: loop-closure-2026-06
    description: Meet-point artifact handed to the decorrelated frontier council; not a verifier verdict or apply permission.
    required_fields:
      - schema_version
      - boundary_id
      - verifier_interface
      - source_receipt_id
      - content_hash
      - guardrails
      - not_applied
