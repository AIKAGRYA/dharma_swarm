schema_version: dharma.semantic_objects.v1
objects:
  A2ACard:
    kind: runtime_object
    owner: dharma_swarm.a2a.agent_card.AgentCard
    description: Agent discovery and capability card.
    required_fields:
      - name
      - agent_uid
      - supported_interfaces
    required_internal_route: A2AInboxRoute
  AgentUID:
    kind: identifier
    description: Stable durable agent identifier used in internal NATS subjects.
    subject_token_rules:
      forbidden_chars:
        - "."
        - "*"
        - ">"
        - "/"
        - "\\"
      whitespace_allowed: false
  NATSSubstrate:
    kind: transport_substrate
    description: Internal live fleet transport backed by NATS/JetStream.
    external_edge: false
  A2AInboxRoute:
    kind: route_binding
    alias: agent-inbox
    substrate: NATSSubstrate
    subject_template: dharma.agent.<agent_uid>.inbox
    ack_subject_template: dharma.agent.<agent_uid>.inbox.ack.<packet_id>
    reply_subject_template: dharma.agent.<agent_uid>.inbox.reply.<packet_id>
    implemented_by:
      sender: scripts/runtime/a2a_send.py
      bridge: scripts/runtime/a2a_inbox_bridge.py
      card_resolver: dharma_swarm/a2a/agent_card.py
  IntelligenceSupplyChainRawReceipt:
    kind: evidence_receipt
    owner: dharma_swarm.world_radar.bronze
    track: loop-closure-2026-06
    description: Content-addressed Bronze receipt for a sanctioned external signal treated as untrusted data.
    required_fields:
      - schema_version
      - receipt_id
      - content_hash
      - source_url
      - fetch_method
      - license
      - prov
      - instruction_policy
  FrontierCouncilBoundarySignal:
    kind: verifier_boundary
    owner: dharma_swarm.world_radar.bronze
    track: loop-closure-2026-06
    description: Meet-point artifact handed to the decorrelated frontier council; not a verifier verdict or apply permission.
    required_fields:
      - schema_version
      - boundary_id
      - verifier_interface
      - source_receipt_id
      - content_hash
      - guardrails
      - not_applied
