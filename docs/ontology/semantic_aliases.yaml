  - alias: Message_v2
    canonical_id: semobj.ontology_registry
    reason: ADR-008 forbids version suffixes in public ontology names.
  - alias: Aaverie
    canonical_id: semobj.aerie
    reason: Typo-distance near miss for Aerie; use the operator-facing projection name only when admitted.
  - alias: parallel model routing layer
    canonical_id: semobj.model_key_routing
    reason: Model/key routing has one sanctioned resolver/factory path.
  - alias: project .env keys
    canonical_id: semobj.dkeys_key_store
    reason: Provider keys live under dkeys/agent_keys.env, not project env files.
  - alias: direct provider factory
    canonical_id: semobj.runtime_provider
    reason: Provider construction goes through RuntimeProvider resolver/factory helpers.
  - alias: scattered model order
    canonical_id: semobj.model_hierarchy
    reason: Provider/model ordering belongs in ModelHierarchy.
  - alias: human display name as durable id
    canonical_id: semobj.agent_uid
    reason: Durable NATS consumers and agent routes use stable agent_uid, not display names.
  - alias: filesystem bus as live contact
    canonical_id: semobj.nats_substrate
    reason: Filesystem mirrors are audit surfaces, not live-contact authority.
  - alias: handler ack as semantic reply
    canonical_id: semobj.a2a_inbox_route
    reason: Inbox handler acknowledgements do not prove model-level semantic reply.
  - alias: run the thing
    canonical_id: semobj.dharma_forge_proving_ground
    reason: Too ambiguous outside local conversation; use "run the Forge Proving Ground" or "run the canonical Forge Proving Ground external loop".
  - alias: benchmark bragging rights
    canonical_id: semobj.dharma_forge_proving_ground
    reason: DharmaForgeProvingGround is an evidence/evolution contract, not a leaderboard vanity lane.
  - alias: swarm superiority proven
    canonical_id: semobj.dharma_forge_proving_ground
    reason: The Forge contract forbids superiority claims until paired external claim gates pass.
  - alias: Pudgala is Forge
    canonical_id: semobj.dharma_forge_proving_ground
    reason: Pudgala Autopoiesis Protostar is a separate anti-slop governance/evidence mechanism, never the Forge Proving Ground.
  - alias: Forge Pudgala
    canonical_id: semobj.dharma_forge_proving_ground
    reason: Do not merge the Forge Proving Ground benchmark/evolution contract with Pudgala anti-slop governance.
