  - memory_plane_database_surface

forbidden_actions:
  - access_control_bypass
  - robots_or_rate_limit_bypass
  - learn_course_or_private_full_text_storage  # public-docs deep-cards (local-only) permitted; Learn/course/gated/private full-text forbidden
  - deep_card_prose_committed_to_git
  - private_palantir_tenant_claims
  - official_affiliation_claims
  - provider_secret_access
  - spend_or_live_external_account_action
  - pr_approval
  - source_write_without_explicit_assignment

verifiers:
  - python3 scripts/governance/palantir_pilot_audit.py --json
  - python3 scripts/governance/register_palantir_pilot.py --dry-run
  - python3 scripts/research/palantir_public_source_index.py --dry-run
  - python3 scripts/research/palantir_public_source_cards.py --topic aip --dry-run --limit 2 --json
  - python3 scripts/research/palantir_source_card_quality.py --dry-run --json
  - python3 scripts/research/palantir_source_card_cleanup.py --dry-run --json
  - python3 scripts/research/palantir_pilot_query.py ontology --json --limit 3
  - python3 scripts/research/palantir_pilot_query.py ontology --answer --json --limit 3
  - python3 scripts/research/palantir_pilot_query.py ontology --json --limit 3 --index-workspace --record-db
  - python3 scripts/research/palantir_pilot_orientation.py --json
  - python3 scripts/research/palantir_pilot_curriculum.py --json
  - pytest -q tests/test_palantir_pilot.py

invariants:
  public_source_only: "Use public URLs, sitemaps, docs, and operator-provided material only."
  copyright_boundary: "Store links, metadata, summaries, concept maps, small excerpts, and — for robots-allowed public docs pages — full parsed prose as local-only deep-cards (under ~/.dharma, never committed to git, internal RAG only, no redistribution). Do not mirror Learn/course bodies, gated, or private-tenant material."
  learn_boundary: "learn.palantir.com is manual-review/link-only until allowed autonomous access is confirmed."
  affiliation_boundary: "No official Palantir affiliation, certification, private tenant access, or insider status is claimed."
