{
  "version": 1,
  "verified_at": "2026-05-05",
  "ttl_days": 14,
  "assertions": [
    {
      "id": "manifest-total-python-modules",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Total Python modules \\| \\*\\*(\\d+)\\*\\*",
      "metric": "dharma_python_modules",
      "verify": "find dharma_swarm -name \"*.py\" -type f | wc -l"
    },
    {
      "id": "manifest-top-level-python-modules",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Top-level \\(flat\\) modules \\| \\*\\*(\\d+)",
      "metric": "dharma_top_level_python_modules",
      "verify": "find dharma_swarm -maxdepth 1 -name \"*.py\" -type f | wc -l"
    },
    {
      "id": "manifest-test-files",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Test files \\| \\*\\*(\\d+)\\*\\*",
      "metric": "test_files",
      "verify": "find tests -name \"*.py\" -type f | wc -l"
    },
    {
      "id": "manifest-test-functions",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Test functions \\| \\*\\*([\\d,]+) `def test_`",
      "metric": "test_def_occurrences",
      "verify": "rg \"def test_\" tests | wc -l"
    },
    {
      "id": "manifest-markdown-files",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Markdown files \\| \\*\\*(\\d+)\\*\\*",
      "metric": "markdown_files",
      "verify": "find . -name \"*.md\" -type f | wc -l"
    },
    {
      "id": "manifest-markdown-lines",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Markdown total lines \\| \\*\\*([\\d,]+)\\*\\*",
      "metric": "markdown_total_lines",
      "verify": "find . -name \"*.md\" -type f -print0 | xargs -0 wc -l"
    },
    {
      "id": "manifest-bridge-files",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Bridge files \\| \\*\\*(\\d+)\\*\\*",
      "metric": "bridge_files",
      "verify": "find dharma_swarm -name \"*bridge*.py\" -type f | wc -l"
    },
    {
      "id": "manifest-adapter-files",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Adapter files \\| \\*\\*(\\d+)",
      "metric": "adapter_files",
      "verify": "find dharma_swarm -type f | rg -i \"adapter\" | wc -l"
    },
    {
      "id": "manifest-router-files",
      "doc": "docs/governance/SOVEREIGN_MANIFEST.md",
      "regex": "Router files \\| \\*\\*(\\d+)\\*\\*",
      "metric": "router_files",
      "verify": "find dharma_swarm -type f | rg -i \"rout\" | wc -l"
    }
  ],
