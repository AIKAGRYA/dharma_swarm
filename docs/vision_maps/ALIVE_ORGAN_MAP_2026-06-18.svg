  <text x="992" y="802" class="tiny">proof: delivered decisions + receipts</text>

  <rect x="60" y="885" width="1275" height="55" class="weak" />
  <text x="82" y="918" class="text">KaizenOps catches: observation without consequence • false-hand path fixes • map drift • repeated diagnosis • claim inflation • handler ACK ≠ semantic agreement</text>

