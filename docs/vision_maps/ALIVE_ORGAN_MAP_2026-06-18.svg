<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .title { fill: #f8fafc; font: 700 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI'; }
      .subtitle { fill: #cbd5e1; font: 16px ui-sans-serif, system-ui; }
      .box { fill: #111827; stroke: #334155; stroke-width: 2; rx: 18; }
      .owner { fill: #172554; stroke: #60a5fa; stroke-width: 2; rx: 18; }
      .kaizen { fill: #3b1d05; stroke: #f59e0b; stroke-width: 4; rx: 24; }
      .hermes { fill: #1e1b4b; stroke: #a78bfa; stroke-width: 2; rx: 18; }
      .organ { fill: #052e2b; stroke: #2dd4bf; stroke-width: 2; rx: 18; }
      .weak { fill: #3f1d1d; stroke: #f87171; stroke-width: 2; rx: 18; }
      .text { fill: #e5e7eb; font: 600 17px ui-sans-serif, system-ui; }
      .small { fill: #cbd5e1; font: 13px ui-sans-serif, system-ui; }
      .tiny { fill: #94a3b8; font: 12px ui-sans-serif, system-ui; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .goldline { stroke: #f59e0b; stroke-width: 3; fill: none; marker-end: url(#arrowGold); }
      .dash { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b" />
