  <rect class="bg" width="1400" height="980" />
  <text x="60" y="58" class="title">Dharma Swarm Alive Map — KaizenOps as Improvement Membrane</text>
  <text x="60" y="88" class="subtitle">Projection only. Owner truth remains in make onboard, ACTIVE_TRACK, ACTIVE_SURFACE_MANIFEST, runtime receipts, and mapped canon.</text>

  <rect x="60" y="125" width="280" height="125" class="owner" />
  <text x="82" y="158" class="text">1. First Door</text>
  <text x="82" y="185" class="small">make onboard</text>
  <text x="82" y="207" class="tiny">renders owner facts</text>
  <text x="82" y="228" class="tiny">does not own truth</text>

  <rect x="385" y="125" width="280" height="125" class="owner" />
  <text x="407" y="158" class="text">2. Lead Cognitive Map</text>
  <text x="407" y="185" class="small">docs/governance/SWARM_GENOME.md</text>
  <text x="407" y="207" class="tiny">first-token organism map</text>
  <text x="407" y="228" class="tiny">projection, not live state</text>

  <rect x="710" y="125" width="280" height="125" class="owner" />
  <text x="732" y="158" class="text">3. Whole-System Why</text>
  <text x="732" y="185" class="small">North Star v2: docs/vision_maps/NORTH_STAR.md</text>
  <text x="732" y="207" class="tiny">Jagat Kalyan / telos</text>
  <text x="732" y="228" class="tiny">subordinate to canon stack</text>

  <rect x="1035" y="125" width="300" height="125" class="owner" />
