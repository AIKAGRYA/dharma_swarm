  <text x="692" y="614" class="small">Wiki, MemoryKernel, KnowledgeOps</text>
  <text x="692" y="637" class="tiny">proof: promoted context + sources</text>

  <rect x="970" y="555" width="255" height="110" class="organ" />
  <text x="992" y="588" class="text">Semantic Ontology</text>
  <text x="992" y="614" class="small">Semantic Commons, aliases, ontology</text>
  <text x="992" y="637" class="tiny">proof: name-drift preflight</text>

  <rect x="70" y="720" width="255" height="110" class="organ" />
  <text x="92" y="753" class="text">Research</text>
  <text x="92" y="779" class="small">R_V / self-reference / mech interp</text>
  <text x="92" y="802" class="tiny">proof: falsifiable experiment</text>

  <rect x="370" y="720" width="255" height="110" class="organ" />
  <text x="392" y="753" class="text">Revenue / Capital</text>
  <text x="392" y="779" class="small">RevenueSpine, Ginko, Capital Lab</text>
  <text x="392" y="802" class="tiny">proof: external human / cash receipt</text>

  <rect x="670" y="720" width="255" height="110" class="organ" />
  <text x="692" y="753" class="text">Media / Noosphere</text>
  <text x="692" y="779" class="small">Darshan, Vwrite, Loomwork, SAB</text>
  <text x="692" y="802" class="tiny">proof: public artifact + readback</text>

  <rect x="970" y="720" width="255" height="110" class="hermes" />
