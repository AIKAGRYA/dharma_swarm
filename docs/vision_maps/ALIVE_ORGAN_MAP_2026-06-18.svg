  <text x="1057" y="185" class="small">foundations/THE_ORGANISM.md</text>
  <text x="1057" y="207" class="tiny">Krishna inward / Arjuna outward</text>
  <text x="1057" y="228" class="tiny">conceptual canon</text>

  <rect x="485" y="315" width="430" height="150" class="kaizen" />
  <text x="520" y="355" class="text">KAIZENOPS — Primary Improvement Organ</text>
  <text x="520" y="386" class="small">docs/governance/KAIZENOPS.md</text>
  <text x="520" y="415" class="tiny">observe → classify waste → route one action → verify → prevent recurrence</text>
  <text x="520" y="438" class="tiny">owns improvement interpretation, not runtime/live/ontology authority</text>

  <rect x="70" y="555" width="255" height="110" class="organ" />
