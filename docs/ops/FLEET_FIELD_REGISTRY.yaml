# dharma_fleet_field_registry.v2
#
# THE machine-readable connect-time source of truth for the A2A fleet field.
# Schema v2 adds multi-authority topology and a Universal Agent Runtime Cell
# projection per identity. Refreshed by probe receipts, never by aspiration.
#
# Read it:      python3 scripts/runtime/fleet_field_registry.py
# Validate it:  python3 scripts/runtime/fleet_field_registry.py --check
#
# SECRET POLICY: env var NAMES only. Any credential VALUE in this file is a
# governance violation; --check enforces the shape.
#
# Relationship to other docs:
#   docs/governance/NATS_SUBSTRATE_MASTER_SPEC.md  = TARGET contract + runtime-cell invariant
#   this file                                      = LIVE / probe-bound field (what runs today)
#   docs/architecture/A2A_ALWAYS_ON_SPINE_MASTER_PLAN.md = phased implementation sequencing
#   docs/ops/A2A_QUICKSTART.md                     = how to connect, step by step
#   docs/ops/A2A_AGENT_ONBOARDING.md               = how a NEW identity joins
#
# Honesty rules (v2):
#   - unknown / unprobed stay explicit; never render as green
#   - delivery drain alone caps at HANDLER_ACKED
#   - no semantic executor ⇒ no semantic/effect completion claim
#   - reference/runtime-observed-uncommitted evidence is not committed-live cutover truth
#   - display names, models, hosts, sessions are mutable attributes — not routing identity

schema: dharma_fleet_field_registry.v2
updated: "2026-07-18"
refreshed_by: field_probe_2026_07_09_plus_v2_runtime_cell_projection
probe_synthesis: inter_agent/fleet/2026-07-09-field-probe-synthesis.md
secret_policy: env_var_names_only

