# dharma_fleet_field_registry.v2
#
# Probe-bound connect-time projection of the A2A fleet field. Schema v2 adds
# multi-authority topology and a Universal Agent Runtime Cell projection per
# identity. Refreshed by probe receipts, never by aspiration.
#
# Ownership (precise):
#   Cards:  examples/agents/*.registration.json own declared identity addresses
#   Roster: dharma_swarm/a2a/agent_presence.py::REGISTERED_AGENT_UIDS owns roster
#   Live:   Live Ops / runtime probes / receipts own live/runtime state
#   FFR:    this file — probe-bound connect-time projection only; owns neither
#           declared card address nor universal live state
#
# Read it:      python3 scripts/runtime/fleet_field_registry.py
# Validate it:  python3 scripts/runtime/fleet_field_registry.py --check
#
# SECRET POLICY: env var NAMES only. Any credential VALUE is a governance
# violation; --check enforces structural key/value scanning with redaction.
#
# Route fields (do not launder):
#   declared_route            — from registration card when a card exists
#   observed_effective_route  — probe/receipt-bound actual worker binding
#   target_route              — unapplied migration target (never observed/live/canonical)
#
# Honesty rules (v2):
#   - unknown / unprobed / declared / absent / runtime_observed_uncommitted are
#     non-proof for aggregate readiness
#   - any required non-proof component => readiness unknown
#   - delivery drain alone caps at HANDLER_ACKED; proven semantic executor may
#     exceed only with contiguous bound semantic/effect proof
#   - display names / models / hosts / sessions are mutable — not routing identity

