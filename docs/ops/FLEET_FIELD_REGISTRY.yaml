# ---------------------------------------------------------------------------
# Universal Agent Runtime Cell — top-level contract (doctrine details live in
# NATS_SUBSTRATE_MASTER_SPEC.md; this block is the registry-shape binding).
# ---------------------------------------------------------------------------
runtime_cell_contract:
  components:
    - agent_uid
    - canonical_inbox_subject
    - durable_consumer
    - credential_principal
    - delivery_runtime
    - semantic_executor_mode
    - idempotent_effect_boundary
    - receipt_lifecycle
    - large_artifact_lane
    - observability_projection
  delivery_drain_ceiling: HANDLER_ACKED
  readiness_rule: minimum_proven_tier_across_components
  identity_law: >-
    Display names, models, hosts, and temporary sessions are mutable attributes.
    Routing identity is stable agent_uid + unique canonical inbox + unique durable
    + identity-scoped credential principal.
  reference_implementation_law: >-
    A reference agent stack (including Meghaforge/grok_build) is evidence and a
    pattern source only; it is not architecture authority and must not mint a
    private transport stack that becomes a new authority.

decisions:
  - id: FFR-D1
    date: "2026-07-09"
    decision: publish_to_peer ACL model
    detail: >-
      Operator-ratified: each agent's NATS account is granted PUBLISH to any
      peer inbox subject (dharma.a2a.<callsign>, dharma.agent.<uid>.inbox and
      their .reply.>/.ack.> children) plus dharma.a2a.fleet, and SUBSCRIBE
      only to its OWN inbox/reply/ack subjects plus dharma.a2a.fleet. The
      2026-07-09 probe proved the current hub ACLs block peer publishes
      (permission violations from two independent live nodes), so the live
      fleet can only broadcast — agents cannot DM each other.
    status: RATIFIED_NOT_APPLIED   # hub config change is an operator action on the AGNI VPS

  - id: FFR-D2
    date: "2026-07-09"
    decision: one subject per identity (resolve dharma.a2a.hermes collision)
    detail: >-
      AGNI Hermes and rushabdev BOTH drain dharma.a2a.hermes with durable
      consumers — two identities on one subject either compete for messages
      or double-process. rushabdev gets its own subject (dharma.a2a.rushabdev)
      once hub ACLs are reworked under FFR-D1. v2 registry refuses duplicate
      non-null canonical_inbox_subject claims across distinct UIDs; the shared
      listen is recorded in listen_subjects/blockers, not as two equal canonical claims.
    status: OPEN

  - id: FFR-D3
    date: "2026-07-09"
    decision: this registry supersedes scattered routing prose
    detail: >-
      Connect-time routing questions are answered HERE first;
      A2A_NATS_CENTRAL_INDEX.md's machine-local worktree pointers are
      historical. Registry entries change only with a probe receipt or an
      operator decision recorded in `decisions`.
    status: ACTIVE

  - id: FFR-D4
    date: "2026-07-18"
    decision: every identity is a Universal Agent Runtime Cell instance
    detail: >-
      All identities — Grok/Meghaforge, rushabdev, AGNI Hermes, cloud seats,
      future external/SAB participants — are instances of the same runtime-cell
      contract. No agent-specific transport stack may become a new authority.
      Readiness is the minimum proven tier across the ten cell components;
      delivery drain alone caps at HANDLER_ACKED; unknown stays unknown.
    status: ACTIVE

  - id: FFR-D5
    date: "2026-07-18"
    decision: gated recommendation for one logical writable authority
    detail: >-
      GATED RECOMMENDATION (not live cutover): after dual-authority inventory
      parity, scoped credentials, rollback drill, field-registry/card updates,
      and explicit operator ACCEPT, converge on one logical writable task/message
      authority per subject family. AGNI remains source_compatibility until those
      gates close. Meghadharma is candidate_reference only under
      runtime_observed_uncommitted evidence — observation is not cutover.
    status: RECOMMENDED_NOT_APPLIED

