runtime_cell_contract:
  components:
    - agent_uid
    - canonical_inbox_subject
    - durable_consumer
    - credential_principal
    - delivery_runtime
    - semantic_executor_mode
    - idempotent_effect_boundary
    - receipt_lifecycle
    - large_artifact_lane
    - observability_projection
  delivery_drain_ceiling: HANDLER_ACKED
  readiness_rule: minimum_proven_tier_across_components_with_non_proof_unknown
  identity_law: >-
    Display names, models, hosts, and temporary sessions are mutable attributes.
    Routing identity is stable agent_uid + unique observed effective inbox +
    unique durable + identity-scoped credential principal.
  reference_implementation_law: >-
    A reference agent stack (including Meghaforge/grok_build) is evidence and a
    pattern source only; it is not architecture authority.

