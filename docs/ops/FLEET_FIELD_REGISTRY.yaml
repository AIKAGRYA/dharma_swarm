# dharma_fleet_field_registry.v1
#
# THE machine-readable connect-time source of truth for the A2A fleet field:
# for each agent identity, the lane it ACTUALLY uses, the broker, the
# credential ENV VAR NAMES (never values), the subjects it drains and writes,
# and the last VERIFIED send/receive. Refreshed by probe receipts
# (inter_agent/<uid>/outbound + inter_agent/fable_claude_code/inbound probe
# replies), never by aspiration. Requested independently by two fleet agents
# in the 2026-07-09 field probe ("one secret-free live routing manifest";
# "refresh it by probe receipts instead of relying on aspirational docs").
#
# Read it:      python3 scripts/runtime/fleet_field_registry.py
# Validate it:  python3 scripts/runtime/fleet_field_registry.py --check
#
# SECRET POLICY: env var NAMES only. Any credential VALUE in this file is a
# governance violation; --check enforces the shape.
#
# Relationship to other docs:
#   docs/governance/NATS_SUBSTRATE_MASTER_SPEC.md  = TARGET contract (DS_* topology)
#   this file                                      = LIVE field (what runs today)
#   docs/ops/A2A_QUICKSTART.md                     = how to connect, step by step
#   docs/ops/A2A_AGENT_ONBOARDING.md               = how a NEW identity joins

schema: dharma_fleet_field_registry.v1
updated: "2026-07-14"
refreshed_by: field_probe_2026_07_09
probe_synthesis: inter_agent/fleet/2026-07-09-field-probe-synthesis.md
secret_policy: env_var_names_only

hub:
  name: agni
  broker_urls:
    wss: wss://157.245.193.15:8443
    nats: nats://157.245.193.15:4222
  live_stream: DHARMA_A2A
  ca_pem_path: dharma_swarm/a2a/nats/agni-ws-ca.pem
  target_topology_note: >-
    The DS_* stream topology in NATS_SUBSTRATE_MASTER_SPEC.md is the TARGET
    contract. The 2026-07-09 field probe confirmed (unanimously, six seats)
    that no DS_* stream runs live anywhere; all live traffic is on DHARMA_A2A.
  secondary_broker:
    name: mac_local
    url: nats://127.0.0.1:4222
    stream: DHARMA_FLEET
    status: operator-Mac only; unbridged from AGNI; often offline

decisions:
  - id: FFR-D1
    date: "2026-07-09"
    decision: publish_to_peer ACL model
    detail: >-
      Operator-ratified: each agent's NATS account is granted PUBLISH to any
      peer inbox subject (dharma.a2a.<callsign>, dharma.agent.<uid>.inbox and
      their .reply.>/.ack.> children) plus dharma.a2a.fleet, and SUBSCRIBE
      only to its OWN inbox/reply/ack subjects plus dharma.a2a.fleet. The
      2026-07-09 probe proved the current hub ACLs block peer publishes
      (permission violations from two independent live nodes), so the live
      fleet can only broadcast — agents cannot DM each other.
    status: RATIFIED_NOT_APPLIED   # hub config change is an operator action on the AGNI VPS
  - id: FFR-D2
    date: "2026-07-09"
    decision: one subject per identity (resolve dharma.a2a.hermes collision)
    detail: >-
      AGNI Hermes and rushabdev BOTH drain dharma.a2a.hermes with durable
      consumers — two identities on one subject either compete for messages
      or double-process. rushabdev gets its own subject (dharma.a2a.rushabdev)
      once hub ACLs are reworked under FFR-D1.
    status: OPEN
  - id: FFR-D3
    date: "2026-07-09"
    decision: this registry supersedes scattered routing prose
    detail: >-
      Connect-time routing questions are answered HERE first;
      A2A_NATS_CENTRAL_INDEX.md's machine-local worktree pointers are
      historical. Registry entries change only with a probe receipt or an
      operator decision recorded in `decisions`.
    status: ACTIVE

