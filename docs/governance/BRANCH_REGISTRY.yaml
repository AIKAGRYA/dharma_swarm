# Branch registry — TTL-exempt lineages for scripts/governance/branch_janitor.py.
#
# Branches matching an entry here are NEVER touched by the janitor, regardless
# of PR state, tip evidence, or idle time. Keep this list small; every entry
# needs a single-line reason. Two entry kinds:
#   - branch: exact ref name
#   - pattern: fnmatch glob (e.g. titanium/*)
#
# Values must stay single-line scalars: the janitor falls back to a minimal
# stdlib parser when PyYAML is unavailable (scripts/governance is stdlib-only).
#
# Seeded 2026-07-04 from the branch/sprawl dive (section 5.3): lineage and
# active-stack branches that a TTL sweep must not judge.
