      #     the shipped Slice 1 behavior (native-GitHub-review -> Mike receipt
      #     bridge is ADDITIVE and FAILS CLOSED). No longer a landed-only false positive.
      - id: github_review_bridge_test_passes
        kind: test_passes
        test: tests/test_pr_merge_control_github_reviews.py
        oracle_source: github-rest-pulls-reviews-contract
        # 14 tests: CHANGES_REQUESTED still blocks; untrusted login never counts;
        # no-trusted-review keeps local blocked; a present local receipt is never
        # overridden. Verified 2026-07-07: 14 passed.
      - id: pr_merge_control_gate_fail_closed_test_passes
        kind: test_passes
        test: tests/test_pr_merge_control.py
        # 52 tests: fail-closed dispatch/gate (missing-required-CI blocks; Mike
        # merge authority skips when gate blocked; backup-reviewer/quorum gating).
        # Verified 2026-07-07: 52 passed.

    non_goals:
      - Do not weaken or remove any existing gate check (CI green, conflict, unresolved threads, CHANGES_REQUESTED stay hard).
      - Do not let Mike silent-merge, approve PRs, push source, or bypass governance.
      - Do not commit provider/API credentials; the credentialed Claude reviewer Action is operator-provisioned.
      - Do not accept a "review" from an untrusted login as a receipt; only trusted installed reviewer-App logins.
      - Do not create a new merge authority or receipt store; extend pr_merge_control and the existing workflows.

    # OPERATOR RATIFICATION 2026-07-16 (durable record: PR #962 comment
