        pattern: "schedule:"
      # Grade-up (2026-07-04 Pudgala dive Phase 0): the criteria above are all
      # existence-only (S1 ceiling). This binds the track to the Slice 1 work
      # that actually LANDED on main — feat(mike): bridge native GitHub reviews
      # to Mike receipts (D4) — an honest S2, no new claim.
