# ACTIVE_TRACK.yaml
#
# THE ONLY PLACE where the current build track is declared.
#
# Other governance docs (CLAUDE.md, SOVEREIGN_MANIFEST.md, BUILD_SESSION_ENTRYPOINT.md)
# render their "current track" line from this file via the DOCOPS include
# mechanism (scripts/docops/render_includes.py). Do not hand-write the track
# name into any other file.
#
# Lifecycle:
#   1. A new track is opened by declaring it here with status=ACTIVE,
#      acceptance criteria, and TTL.
#   2. CI runs scripts/governance/check_track_status.py on every PR.
#      When all acceptance criteria evaluate true, status flips to SHIPPABLE
#      (via the active_track_evidence.json artifact, not by editing this file).
#   3. The next operator closes the track by moving its block to history
#      and declaring the next track ACTIVE. CI fails any PR that leaves the
#      repo with zero ACTIVE tracks for more than 7 days.
#   4. Stale claims (TTL exceeded with no re-verification) raise a CI failure
#      until either re-verified (bump verified_at) or retired.
#
# Schema version: 1
schema_version: 1

# ---------------------------------------------------------------------------
# Active track (exactly one block with status=ACTIVE at any time)
# ---------------------------------------------------------------------------
active_track:
  id: boardstore-facade-2026-05
  name: BoardStore Facade — unified task/state surface for multi-agent coordination
  status: ACTIVE
  opened_at: "2026-05-20"
  verified_at: "2026-05-20"
  ttl_days: 14
  owner: "@AmitabhainArunachala"

  description: |
    Implement the BoardStore facade contract specified in
    docs/architecture/SWARM_BOARDSTORE_SPEC.md. This is the third
    ontology-native seam — the first (operator_brief) shipped, the second
    (cockpit/control-surface) shipped. The facade unifies 7 existing stores
    behind a typed read/write surface with Card schema, event log,
    noticer/doer separation, and cost-cap semantics. Implementation follows
    the 5-step migration plan: scaffold → schema → adapt → client → cutover.
    Additionally, seed Dhyana (System 4 observer) and Sakshi (provenance
    witness) as supporting infrastructure for the board's decision chain.

  surfaces:
    - dharma_swarm/board/**
    - dharma_swarm/dhyana/**
    - dharma_swarm/sakshi/**
    - tests/test_board*.py
    - tests/test_dhyana*.py
    - tests/test_sakshi*.py
    - docs/architecture/SWARM_BOARDSTORE_SPEC.md

  prerequisites:
    - id: boardstore_spec_exists
      kind: file_exists
      file: docs/architecture/SWARM_BOARDSTORE_SPEC.md
    - id: next_seam_adr_exists
      kind: file_exists
      file: docs/architecture/adr/0001-next-seam-candidate.md
    - id: cockpit_track_closed
      kind: file_contains
      file: docs/governance/ACTIVE_TRACK.yaml
      pattern: "cockpit-control-surface-2026-05"
    - id: task_board_exists
      kind: file_exists
      file: dharma_swarm/task_board.py

  completion_criteria:
    - id: board_package_scaffolded
      kind: file_exists
      file: dharma_swarm/board/__init__.py
    - id: card_schema_defined
      kind: file_contains
      file: dharma_swarm/board/models.py
      pattern: "class Card"
    - id: event_log_implemented
      kind: file_contains
      file: dharma_swarm/board/event_log.py
      pattern: "class BoardEventLog"
    - id: facade_lifecycle_tests_pass
      kind: file_exists
      file: tests/test_board_facade.py
    - id: dhyana_drift_triage_exists
      kind: file_exists
      file: dharma_swarm/dhyana/drift_triage.py
    - id: sakshi_provenance_log_exists
      kind: file_exists
      file: dharma_swarm/sakshi/provenance_log.py

  non_goals:
    - Do not open the live evolution gate (BR-003). Shadow-apply only.
    - Do not implement dharma_swarm.client until facade lifecycle tests pass.
    - Do not cut over existing stores until adapters have rollback semantics.
    - Do not decompose god objects on this track. A5 enforcement is separate.
    - Do not change the orchestrator's agent dispatch path on this track.

  next_items:
    - id: 1
      what: "Scaffold dharma_swarm/board/ package with __init__.py, models.py, facade.py, event_log.py."
      kind: code
      blocker: true
    - id: 2
      what: "Define Card + BoardEventLog schema per SWARM_BOARDSTORE_SPEC.md §Data Model."
      kind: code
      blocker: false
    - id: 3
      what: "Seed dharma_swarm/dhyana/drift_triage.py — rank DEGRADED control surface zones by blast_radius × age."
      kind: code
      blocker: false
    - id: 4
      what: "Seed dharma_swarm/sakshi/provenance_log.py — append-only decision chain for multi-agent attribution."
      kind: code
      blocker: false
    - id: 5
      what: "Adapt TaskBoard as first store behind the facade with compatibility wrapper + rollback."
      kind: code
      blocker: false

