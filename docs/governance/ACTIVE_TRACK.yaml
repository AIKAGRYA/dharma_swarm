      - id: adoption_narrative_docs
        kind: file_exists
        file: docs/architecture/SPINE_ADOPTION_NARRATIVE.md
      - id: gate1_witnessed
        kind: file_exists
        file: reports/governance/GATE1_WITNESSED.md
        # Written ONLY by gate1_witness.sh --watch at the moment the operator
