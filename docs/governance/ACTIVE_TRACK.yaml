        kind: file_contains
        file: dharma_swarm/a2a/a2a_bridge.py
        pattern: "from dharma_swarm.spine"
      - id: orchestrator_calls_spine
        kind: file_contains
        file: dharma_swarm/orchestrator.py
        pattern: "from dharma_swarm.spine"
      - id: agent_runner_calls_spine
        kind: file_contains
        file: dharma_swarm/agent_runner.py
        pattern: "from dharma_swarm.spine"
      - id: dispatch_emits_evidence_receipt
