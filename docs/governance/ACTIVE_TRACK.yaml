        file: tests/test_spine_adoption_dispatch.py
        pattern: "test_every_dispatch_emits_exactly_one_evidence_receipt"
      - id: zero_dropoff_sources
        kind: file_contains
        file: tests/test_spine_adoption_dispatch.py
        pattern: "test_no_dropoff_sources_remain"
      - id: bypass_allowlist_empty
        kind: file_contains
        file: scripts/governance/spine_bypass_report.py
        pattern: '_INTENTIONAL_BYPASS: dict\[tuple\[str, int\], str\] = \{\s*\}'
        # Regex (checker re.search): matches the DRAINED dict only — `= {}` on
        # one line or `= {\n}` — never the populated multi-line form (5 entries
        # today). Passes exactly when zero intentional bypass sites remain.
      - id: adoption_narrative_docs
