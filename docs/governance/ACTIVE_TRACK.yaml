        kind: file_exists
        file: dharma_swarm/model_pool.py
      - id: provider_policy_owner_exists
        kind: file_exists
        file: dharma_swarm/provider_policy.py
      - id: model_hierarchy_owner_exists
        kind: file_exists
        file: dharma_swarm/model_hierarchy.py

