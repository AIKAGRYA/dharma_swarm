  - id: merge-master-mike-d4-2026-06
    name: Merge Master Mike — D4 persistent always-on merge agent
    status: ACTIVE
    opened_at: "2026-06-24"
    verified_at: "2026-06-24"
    ttl_days: 21
    owner: "@AmitabhainArunachala"
    serves: substrate-nativeness
    complements:
      - runtime-truth-reconciliation-2026-06
    owned_surfaces:
      - scripts/runtime/pr_merge_control.py
      - scripts/runtime/merge_master_mike_daemon.py
      - .github/workflows/automerge.yml
      - .github/workflows/codex-mention-router.yml
      - .github/workflows/merge-master-mike-backlog.yml
      - tests/test_pr_merge_control_github_reviews.py
    moves_vital_signs:
      - quality_gates
      - tool_coverage

    description: |
      Operator directive 2026-06-24: make Merge Master Mike a D4-level
      PERSISTENT, always-on merge agent — up independently of any operator
      machine, responsive both reactively (@mention) and proactively (every
      PR event), with a reviewer quorum that is satisfiable in the cloud.

      Diagnosis (this session): Mike-the-merger is already cloud event-driven
      (automerge.yml on pull_request / check_suite / review + an hourly sweep,
      and the router on @mention). Mike-the-reviewer-LANE is not: the cloud
      router runs packet->gate->merge against an ephemeral RUNNER_TEMP state
      dir but NEVER runs the reviewer lanes (run-agent), so the required
      claude/copilot receipt FILES are never written in the cloud. Result: bot
      PRs flow (the bot-pr label WAIVES receipts) but HUMAN PRs can never
      auto-merge in the cloud — the gate always finds the receipts missing. The
      only producer today is the Mac daemon's review cycle-mode (which defaults
      to dry-run) or a manual `make pr-run-claude`. That machine dependency is
      the real clean-merge bottleneck.

      The fix is a reviewer-receipt SOURCE that exists in the cloud with no
      credential: teach the gate to count the native GitHub reviews it already
      receives (the Codex App review = codex; a requested Copilot review =
      copilot) as receipts, and demote claude to the deep/backup lane (built
      later as a credentialed cloud Action). Then auto-enroll every non-draft
      PR so Mike acts proactively, and give Mike a cloud heartbeat so his
      living-agent presence is continuous rather than Mac-bound.

      Doctrine that MUST hold (the gate's safety floor is never weakened):
        Add receipt SOURCES, never remove gate checks. CI green, no conflict,
        no unresolved blocking threads, and reviewDecision != CHANGES_REQUESTED
        stay hard. Mike never silent-merges, never approves, never pushes
        source, never bypasses governance. A native GitHub review counts as a
        receipt ONLY from a trusted installed reviewer-App login.

    prerequisites:
      - id: pr_merge_control_exists
        kind: file_exists
        file: scripts/runtime/pr_merge_control.py
      - id: mike_daemon_exists
        kind: file_exists
        file: scripts/runtime/merge_master_mike_daemon.py
      - id: automerge_workflow_exists
        kind: file_exists
        file: .github/workflows/automerge.yml
      - id: router_workflow_exists
        kind: file_exists
        file: .github/workflows/codex-mention-router.yml

    completion_criteria:
      - id: github_review_receipt_bridge
        kind: file_contains
        file: scripts/runtime/pr_merge_control.py
        pattern: "github_review"
      - id: github_review_bridge_tested
        kind: file_exists
        file: tests/test_pr_merge_control_github_reviews.py
      - id: automerge_enrolls_all_nondraft
        kind: file_contains
        file: .github/workflows/automerge.yml
        pattern: "mike-watch"
      - id: mike_cloud_heartbeat
        kind: file_contains
        file: .github/workflows/merge-master-mike-backlog.yml
        pattern: "schedule:"
      # Grade-up (2026-07-04 Pudgala dive Phase 0): the criteria above are all
      # existence-only (S1 ceiling). This binds the track to the Slice 1 work
      # that actually LANDED on main — feat(mike): bridge native GitHub reviews
      # to Mike receipts (D4) — an honest S2, no new claim.
      - id: github_review_bridge_landed
        kind: commit_on_main
        commit: "751c5ba8a802e7116827c31bcf98631b2e2a1f8f"
      # --- REAL behavioral gate (2026-07-07 reconcile): the criteria above were
      #     existence/landed-only. These two RAN GREEN from origin/main and prove
      #     the shipped Slice 1 behavior (native-GitHub-review -> Mike receipt
      #     bridge is ADDITIVE and FAILS CLOSED). No longer a landed-only false positive.
      - id: github_review_bridge_test_passes
        kind: test_passes
        test: tests/test_pr_merge_control_github_reviews.py
        oracle_source: github-rest-pulls-reviews-contract
        # 14 tests: CHANGES_REQUESTED still blocks; untrusted login never counts;
        # no-trusted-review keeps local blocked; a present local receipt is never
        # overridden. Verified 2026-07-07: 14 passed.
      - id: pr_merge_control_gate_fail_closed_test_passes
        kind: test_passes
        test: tests/test_pr_merge_control.py
        # 52 tests: fail-closed dispatch/gate (missing-required-CI blocks; Mike
        # merge authority skips when gate blocked; backup-reviewer/quorum gating).
        # Verified 2026-07-07: 52 passed.

    non_goals:
      - Do not weaken or remove any existing gate check (CI green, conflict, unresolved threads, CHANGES_REQUESTED stay hard).
      - Do not let Mike silent-merge, approve PRs, push source, or bypass governance.
      - Do not commit provider/API credentials; the credentialed Claude reviewer Action is operator-provisioned.
      - Do not accept a "review" from an untrusted login as a receipt; only trusted installed reviewer-App logins.
      - Do not create a new merge authority or receipt store; extend pr_merge_control and the existing workflows.

    # DECISIONS pending operator ratification before gate behavior changes (PR thread):
    #   D1 accept native GitHub reviews as receipts (Codex App, Copilot) — proposed: yes
    #   D2 always-on cloud required reviewers = codex,copilot; claude = deep/backup lane — proposed: yes
    #   D3 unattended human-PR auto-merge when the quorum is clean — NEEDS operator decision
    #   D4 provision a CI credential for the cloud Claude reviewer Action — NEEDS operator action
    next_items:
      - id: 1
        what: "Slice 1 (blocker): bridge native GitHub reviews -> Mike receipts in the pr_merge_control gate (Codex App = codex, Copilot = copilot), trusted-login-gated and ADDITIVE (never removes a check). + tests."
        kind: code
        blocker: true
        # Underclaim probe (2026-07-03): the bridge + its test file already
        # exist on main (criteria github_review_receipt_bridge and
        # github_review_bridge_tested both pass) — this item looks shipped but
        # was never reconciled. The linked criterion makes check_track_status
        # WARN track-underclaim until the owner reconciles it.
        evidence_criterion: github_review_bridge_tested
      - id: 2
        what: "Slice 2: auto-enroll every non-draft PR into the automerge/Mike evaluate lane (not only bot-pr / automerge-labeled)."
        kind: code
        blocker: false
      - id: 3
        what: "Slice 3 (operator-gated): cloud Claude reviewer GitHub Action that runs run-agent and posts a claude receipt on PR open/sync (needs an ANTHROPIC API credential as a repo secret — decision D4)."
        kind: code
        blocker: false
      - id: 4
        what: "Slice 4: Mike cloud heartbeat (scheduled wake / living-agent receipt) so D4 presence is continuous and machine-independent; keep the Mac daemon as an optional local mirror."
        kind: code
        blocker: false
      - id: 5
        what: "Operator ratification of decisions D1-D4 before any merge-authority behavior changes."
        kind: governance
        blocker: true

