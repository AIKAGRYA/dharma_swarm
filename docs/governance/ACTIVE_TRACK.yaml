# ACTIVE_TRACK.yaml
#
# THE ONLY PLACE where the current build track is declared.
#
# Other governance docs (CLAUDE.md, SOVEREIGN_MANIFEST.md, BUILD_SESSION_ENTRYPOINT.md)
# render their "current track" line from this file via the DOCOPS include
# mechanism (scripts/docops/render_includes.py). Do not hand-write the track
# name into any other file.
#
# Lifecycle:
#   1. A new track is opened by declaring it here with status=ACTIVE,
#      acceptance criteria, and TTL.
#   2. CI runs scripts/governance/check_track_status.py on every PR.
#      When all acceptance criteria evaluate true, status flips to SHIPPABLE
#      (via the active_track_evidence.json artifact, not by editing this file).
#   3. The next operator closes the track by moving its block to history
#      and declaring the next track ACTIVE. CI fails any PR that leaves the
#      repo with zero ACTIVE tracks for more than 7 days.
#   4. Stale claims (TTL exceeded with no re-verification) raise a CI failure
#      until either re-verified (bump verified_at) or retired.
#
# This is not a global mutex on implementation work. Parallel work lanes are
# coordinated separately (one strategic active track, many work lanes) under
# parallel_lane_policy below.
#
# Companion file (control-plane surface inventory; read alongside this track):
#   ACTIVE_SURFACE_MANIFEST.yaml — declares api_routers, state_dir, dashboard_nav,
#   hot_path_modules, governance_rules, opportunity_stages, agents, integrations.
#   Both files are rendered together by `make onboard`.
#
# Schema version: 1
schema_version: 1

# ---------------------------------------------------------------------------
# Active track (exactly one block with status=ACTIVE at any time)
# ---------------------------------------------------------------------------
active_track:
  id: runtime-truth-reconciliation-2026-06
  name: Runtime Truth Reconciliation — operator-visible truth packets
  status: ACTIVE
  opened_at: "2026-06-04"
  verified_at: "2026-06-04"
  ttl_days: 14
  owner: "@AmitabhainArunachala"

  description: |
    The Runtime Truth Spine substrate is merged and shippable. This track moves
    from substrate existence to read-only reconciliation: operator-visible
    runtime truth packets that separate heartbeat, readiness, artifact progress,
    completion, authority, projection/cache, mutation, and external-gated proof.

    The track must not create a new truth store, daemon, receipt system, or
    authority surface. It projects from existing owners only:
    spine.EvidenceReceipt for in-flight dispatch proof, runtime_state.RuntimeReceipt
    for persisted runtime receipts, IdempotencyRecord for exactly-once substrate,
    and existing operator/onboard/control-surface rows for read-only rendering.

    Doctrine line that must hold:
      Read models project truth from owners; they do not become authority.

  surfaces:
