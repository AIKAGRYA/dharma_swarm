    - tests/test_spine_adoption_dispatch.py
    - scripts/uplift_guards/check_spine_ownership.py
    - ACTIVE_SURFACE_MANIFEST.yaml

  prerequisites:
    - id: spine_package_exists
      kind: file_exists
      file: dharma_swarm/spine/__init__.py
    - id: invoke_agent_defined
      kind: file_contains
      file: dharma_swarm/spine/invoke.py
      pattern: "async def invoke_agent"
    - id: reconciliation_track_closed
      kind: file_contains
      file: docs/governance/ACTIVE_TRACK.yaml
      pattern: "runtime-truth-reconciliation-2026-06"
      # Must appear under closed_tracks with status: SHIPPED

  completion_criteria:
    - id: a2a_bridge_calls_spine
      kind: file_contains
      file: dharma_swarm/a2a/a2a_bridge.py
      pattern: "from dharma_swarm.spine import"
    - id: orchestrator_calls_spine
      kind: file_contains
      file: dharma_swarm/orchestrator.py
      pattern: "from dharma_swarm.spine import"
    - id: agent_runner_calls_spine
      kind: file_contains
      file: dharma_swarm/agent_runner.py
      pattern: "from dharma_swarm.spine import"
    - id: dispatch_emits_evidence_receipt
      kind: file_contains
      file: tests/test_spine_adoption_dispatch.py
      pattern: "test_every_dispatch_emits_exactly_one_evidence_receipt"
    - id: zero_dropoff_sources
      kind: file_contains
      file: tests/test_spine_adoption_dispatch.py
      pattern: "test_no_dropoff_sources_remain"
    - id: bypass_allowlist_empty
      kind: file_contains
      file: scripts/uplift_guards/check_spine_ownership.py
      pattern: "BYPASS_ALLOWLIST = []"
    - id: adoption_narrative_docs
      kind: file_exists
      file: docs/architecture/SPINE_ADOPTION_NARRATIVE.md

  non_goals:
    - Do not create new spine sub-modules. Adopt invoke/receipt/routing/persistence.
    - Do not decompose agent_runner.run_task beyond invoke_agent() routing.
    - Do not change EvidenceReceipt schema; adopt shipped types unchanged.
    - Do not introduce NATS, Redis, or gRPC in this track.
    - Do not broadly refactor swarm.py, providers.py, or SwarmManager.

  next_items:
    - id: 1
      what: "Migrate a2a/a2a_bridge.py dispatch through invoke_agent(). Cleanest layer, highest leverage."
      kind: code
      blocker: true
    - id: 2
      what: "Migrate orchestrator.py dispatch through invoke_agent() behind feature flag."
      kind: code
      blocker: true
    - id: 3
      what: "Migrate agent_runner.py run_task through invoke_agent(). Largest surface, last."
      kind: code
      blocker: true
    - id: 4
      what: "Enable bypass-guard allow-list-at-zero in uplift_guards CI."
      kind: code
      blocker: true
    - id: 5
      what: "Author docs/architecture/SPINE_ADOPTION_NARRATIVE.md"
      kind: docs
      blocker: false

# Parallel work lane policy
# ---------------------------------------------------------------------------
# The active track is the strategic north star, not a global mutex. It names
# the seam being shipped end-to-end with gates and witness. Below is the
# actual multi-agent, multi-worktree reality. Any parallel lane must declare
# owner, scope, verification, and receipt path.
parallel_lane_policy:
  model: "one strategic active track; many coordinated work lanes"
  allowed: true
  strategic_track_role: "north-star, acceptance gates, non-goals, and authority boundaries"
  lane_requirements:
    - "Bind every new agent to the active strategic track or to an explicit exception lane."
    - "Use an isolated worktree/branch or a ds-goal/AgentOps packet for implementation lanes."
    - "Declare owner, branch/worktree, allowed surfaces, verification command, and receipt path before broad edits."
    - "Do not write into unrelated dirty files; inspect existing changes before touching a modified file."
    - "Record handoff/receipts before stopping; abandoned lanes must be marked stale or prunable."
    - "Promotion requires tests/checks plus an explicit merge or closeout receipt."
  root_worktree_policy: "The primary worktree may coordinate and write receipts, but broad implementation should move to an isolated lane when dirty pressure is high."
  cleanup_policy: "Prunable worktrees and stale branches are cleanup candidates only after receipt review; never delete unreviewed user work."

