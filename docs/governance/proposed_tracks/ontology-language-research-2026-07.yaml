proposed_track:
  id: ontology-language-research-2026-07
  name: Ontology & Language Research — ratify + first-adopter + lane reconcile
  serves: research-depth
  status: PROPOSED
  owner: operator
  proposed_by: claude-code
  proposed_at: 2026-07-11
  ttl_days: 30
  intent: >
    Close the open ontology/language-research loops that no active track owns: ratify
    ADR-008, land the NAGA-IR spec + UCL kernel_p0 on main with a first real adopter
    (kill the 0-adoption-citations gap), and reconcile the scattered research lanes into
    origin/telos_titanium/dharma_lane_research (or explicitly retire them).
  completion_criteria:
    - id: adr008_ratified
      kind: file_contains
      file: docs/architecture/ADRs/ADR-008-ontology-api-name-grammar.md
      pattern: "Status:** RATIFIED"
    - id: naga_ir_spec_on_main
      kind: file_exists
      file: specs/naga_ir/core.md
    - id: ucl_kernel_p0_on_main
      kind: file_exists
      file: packages/telos-kernel/ucl_0/receipt/identity.py
    - id: naga_ir_first_adopter_exists
      kind: file_contains
      file: reports/governance/naga_ir_adoption_evidence.md
      pattern: "callers_outside_specs: 1"
    - id: ucl_kernel_tests_green_on_main
      kind: file_exists
      file: packages/telos-kernel/ucl_0/tests/test_receipt_p0.py
    - id: research_lanes_reconciled
      kind: file_exists
      file: reports/governance/ontology_language_research_lane_reconcile.md   # naga-ir-elevate + ucl_kernel_p0 merged-or-retired vs dharma_lane_research
