  status: ACTIVE
  opened_at: "2026-07-11"
  verified_at: "2026-07-11"
  ttl_days: 14
  owner: "@AmitabhainArunachala"
  serves: substrate-nativeness
  complements:
    - agent-admission-semantic-commons-2026-06
    - composer-holon-spine-longrun-2026-06
  owned_surfaces:
    - dharma_swarm/idea_spark/**
    - tests/test_idea_spark_*.py
    - tests/test_operator_idea_spark_ingest_e2e.py
    - tests/test_operator_input_*.py
    - docs/ops/OPERATOR_IDEA_SPARK_LIVE_INGEST.md
    - docs/agents/magpie/**
    - reports/governance/idea_spark_magpie_reconciliation_triage.md

  description: |
    Operator input ingest (receipt -> candidate -> Chetana staging ->
    MemoryKernel -> Semantic Commons route -> proposal/task/BetCard bridge,
    keyed by correlation_id) plus THE MAGPIE external idea-miner (evidence-
    only L0, feeds ARTHA_CREAM/tool_metabolism/find-skills) are both real,
    partially-built assets sitting on pushed-but-unmerged branches with no
    active owner for 10+ days. This track's job is NOT to build more feature
    surface. It is to answer, with evidence, whether the existing
    dharma_swarm/idea_spark/ package is still worth rebasing onto current
    main (590 commits of drift and counting), and to make an explicit
    continue-or-retire call on Magpie rather than let it silently rot a
    second time.

    Honest objective fit: this is substrate-nativeness (ingest/receipt/
    routing plumbing that stays inside the house), not yet
    revenue-external-humans-served — no external human has read, replied to,
    or acted on anything either pipeline has produced, and Magpie is
    explicitly evidence-only/manual-loop with no live A/B or promotion. If a
    later track wants to claim the revenue objective, it must show an actual
    external-acted receipt, not this track's existence.

  prerequisites:
    - id: idea_spark_branch_still_pushed
      kind: file_exists
      file: reports/governance/idea_spark_magpie_reconciliation_triage.md
      # Gate: triage must exist and show the branch tip is still reachable
      # on origin before any rebase work starts.

  completion_criteria:
    - id: reconciliation_triage_exists
      kind: file_exists
      file: reports/governance/idea_spark_magpie_reconciliation_triage.md
      # First and only mandatory gate for a while: an honest read of whether
      # origin/feat/operator-idea-spark-ingest is still realistically
