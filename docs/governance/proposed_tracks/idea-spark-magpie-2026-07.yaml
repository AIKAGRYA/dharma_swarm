      # semantic_commons.py-adjacent tracks), whether the 2026-06-27 findings
      # (F1-F3) are still open, and an explicit recommendation: rebase-and-PR
      # vs. harvest-and-drop.
    - id: idea_spark_package_on_main
      kind: file_exists
      file: dharma_swarm/idea_spark/__init__.py
      # Only meaningful if the triage recommends rebase; proves the package
      # actually landed on origin/main, not just that it exists on a branch.
    - id: idea_spark_e2e_test_on_main
      kind: file_exists
      file: tests/test_operator_idea_spark_ingest_e2e.py
    - id: live_ingest_doc_on_main
      kind: file_exists
      file: docs/ops/OPERATOR_IDEA_SPARK_LIVE_INGEST.md
    - id: magpie_disposition_recorded
      kind: file_exists
      file: docs/agents/magpie/DISPOSITION_2026-07.md
      # Explicit continue-or-retire call on THE MAGPIE, written down, so the
      # seed does not simply go quiet a second time with no record of why.

