#     (b) explicitly raises max_active above 11 in ACTIVE_TRACK.yaml.
#
# OPERATOR DECISION GATES (from MASTER_SYNTHESIS.md §8):
#   - D2: kill-condition-1 (08-07) armed or retired? The SIS first-cash
#     criterion below IS the same act as satisfying kill-condition-1's
#     MOU/customer gate. Arming this track arms a rescue plan for D2.
