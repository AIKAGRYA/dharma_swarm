#   - D5: language discipline enforced — external face is "GPAI-compliant
#     compute obligation receipt", not "Web5 / material burden / SIS".
#   - D6: Commons needs a seat in the telos hierarchy (SOVEREIGN_MANIFEST
#     amendment). SIS already has a seat; the planetary-commons spine
#     objective below is conditional on that amendment.
#
# SERVES:
#   Primary: revenue-external-humans-served (GPAI commercial wedge —
#     first paying subscriber for an agent-audit attestation receipt)
#   Secondary: substrate-nativeness (GAIA kernel → CAR envelope → DS_CAR)
