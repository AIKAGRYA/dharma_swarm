  "definition": "A fix lands at the call site a reviewer named and not at its twin -- the sibling module that re-derives the same fact, the second call site of the same helper, the matching flag on the paired command, the second of two staging passes. The reported instance closes and the class stays open, so the next review round rediscovers the same defect wearing a different file name.",
  "why_it_hurts": "Fixing the instance rather than the class is the single largest source of repeat findings under agent review: nine of the forty-four findings on PR #1200 were twins of an already-fixed defect. Each costs a full review round, and the reviewer bill scales with rounds. Worse, a half-applied guard reads as present -- the code looks defended at the site everyone examines, and the undefended twin is the one that runs.",
  "detector": {"type": "manual", "rationale": "No general mechanical detector: 'twin' is a semantic relation between call sites that a linter cannot infer. It is mechanizable ONE PAIR AT A TIME, and that is the recommended remedy -- tests/test_lane_deliver.py::test_every_text_mode_command_decodes_tolerantly pins both `_run` implementations across the two lane modules, so neither can regain a strict decode alone. The audit questions below are the review-time substitute until a pair is worth pinning."},
