  "definition": "A gate, guard or regression test is added and observed to pass, but never run against a case it is supposed to fail. It may pass for a reason unrelated to the property it claims -- satisfied by an incidental token elsewhere in the function, measuring state the production path never reaches, or asserting on a ref it never fetched. The same defect applies to a check's EXEMPTIONS: an exemption argued per function when the property only holds at one of several call sites.",
  "why_it_hurts": "An unfalsified check is decoration that reads as protection, and it is worse than no check because it ends the search. Every measured instance was written by an agent in good faith and passed on the first run: an AST gate satisfied per function by an unrelated `returncode` mention, so the large function it was written for passed for free; a byte-ceiling test that asserted zero and got zero from the fail-open path because it measured a ref it never fetched; two regression tests that built state by hand which the production path never produces. Tightening the first gate to per-call-site immediately surfaced two further unreported defects -- the decoration had been hiding them.",
  "detector": {"type": "manual", "rationale": "Whether a check has been falsified is a property of the development process, not of the source, so no scan can see it. The mechanical substitute is procedural and cheap: revert the fix, confirm the check goes red AND names the right thing, restore. Note the recursion -- a negative control is itself code and can be wrong for its own reasons, so its failure output must be READ, not merely observed to be red."},
  "enforcement": {"rule": null, "promoted_on": null},
