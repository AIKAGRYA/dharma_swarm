  "detector": {"type": "command", "command": "git diff --name-only origin/main...HEAD | rg '(^\\.github/workflows/|^scripts/governance/|^scripts/runtime/pr_merge_control.py|^tests/test_.*gate|^docs/governance/)' || true", "target": "gate changes are reviewed as governance-only or paired with old/new behavior receipts"},
  "enforcement": {"rule": null, "promoted_on": null},
  "sources": ["https://csrc.nist.gov/pubs/sp/800/218/final", "https://owasp.org/www-project-mcp-top-10/"],
  "audit_questions": ["Does this PR alter the gate that validates itself?", "If a gate changes, is the PR governance-only with old/new behavior comparison and reviewer signoff?"]
