  "next_review": "2026-09-07",
  "definition": "Persistent memory, context bundles, or agent onboarding packets absorb unverified claims from comments, generated artifacts, or retrieved text.",
  "why_it_hurts": "A false or malicious claim can persist across future sessions and silently bias later agents.",
  "detector": {"type": "command", "command": "git diff --name-only origin/main...HEAD | rg '(^docs/agents/|^docs/onboarding/|^reports/.*/memory|^\\.agents/|memory|context)' || true", "target": "memory-affecting changes carry source paths and verification status"},
  "enforcement": {"rule": null, "promoted_on": null},
  "sources": ["https://owasp.org/www-project-mcp-top-10/", "https://owasp.org/www-project-top-10-for-large-language-model-applications/"],
  "audit_questions": ["Which new memory or context entries came from verified source paths?", "Can any untrusted PR text or generated log become durable instruction for a future agent?"]
}
