  "definition": "A track or claim is treated as shippable when its strongest passing evidence is below the required grade -- file_exists or file_contains (S0/S1) standing in for landed, tested, or independently verified work -- or when its only green test is owned by the same identity that owns the claim, so the oracle is not independent.",
  "why_it_hurts": "Existence is not closure. A pattern present in a file proves nothing ran; a self-authored green test can be written to pass. Shipping on these inflates trust and lets slop accumulate behind a done label.",
