schema_version: rudra.mission.v0
mission_id: new-12-routing
objective: >-
  Implement _resolve_agent_model_override and close the missing Claude Code and
  OpenRouter Direct routing behavior in dharma_swarm/autonomous_agent.py. Do not
  edit tests. Make the existing skipped routing assertions execute and pass.

