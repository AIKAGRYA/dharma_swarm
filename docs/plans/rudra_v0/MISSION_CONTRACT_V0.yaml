acceptance:
  cwd: .
  commands:
    - id: import-and-route-contract
      argv:
        - /Users/dhyana/dharma_swarm/.venv/bin/python
        - -c
        - >-
          from dharma_swarm.autonomous_agent import _resolve_agent_model_override
          as r; assert r('gemini') == ('openrouter_direct',
          'google/gemini-2.5-pro'); assert r('glm-5') == ('ollama',
          'glm-5:cloud'); assert r('codex') == ('codex', 'gpt-5.4'); assert
          r('openrouter:anthropic/claude-opus-4-6') == ('openrouter_direct',
          'anthropic/claude-opus-4-6'); print('RUDRA_ROUTE_OK')
      timeout_seconds: 60
      expect:
        exit_code: 0
        stdout_must_match:
          - ^RUDRA_ROUTE_OK\s*$
    - id: formerly-skipped-routing-tests
      argv:
        - /Users/dhyana/dharma_swarm/.venv/bin/python
        - -m
        - pytest
        - -q
        - -rA
        - -p
        - no:cacheprovider
        - -p
        - pytest_asyncio.plugin
        - --junitxml=${RUDRA_ARTIFACT_DIR}/routing.junit.xml
        - tests/test_autonomous_agent.py::TestPresetAgents::test_preset_agents_use_subscription_claude_code_lane
        - tests/test_autonomous_agent.py::TestCliWakeModelRouting::test_resolves_tui_model_aliases
        - tests/test_autonomous_agent.py::TestCliWakeModelRouting::test_resolves_explicit_provider_model_route
        - tests/test_autonomous_agent.py::TestCliWakeModelRouting::test_cli_wake_model_override_does_not_mutate_preset
        - tests/test_autonomous_agent.py::TestCallLLM::test_claude_code_dispatch
        - tests/test_autonomous_agent.py::TestCallLLM::test_openrouter_direct_dispatch
      timeout_seconds: 300
      expect:
        exit_code: 0
        structured_result:
          kind: pytest_junit
          artifact: routing.junit.xml
          required_testcases:
            - tests.test_autonomous_agent.TestPresetAgents::test_preset_agents_use_subscription_claude_code_lane
            - tests.test_autonomous_agent.TestCliWakeModelRouting::test_resolves_tui_model_aliases
            - tests.test_autonomous_agent.TestCliWakeModelRouting::test_resolves_explicit_provider_model_route
            - tests.test_autonomous_agent.TestCliWakeModelRouting::test_cli_wake_model_override_does_not_mutate_preset
            - tests.test_autonomous_agent.TestCallLLM::test_claude_code_dispatch
            - tests.test_autonomous_agent.TestCallLLM::test_openrouter_direct_dispatch
          require_counts:
            passed: 6
            skipped: 0
            failures: 0
            errors: 0
