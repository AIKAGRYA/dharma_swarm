dashboard_nav_sections:
  - label: COMMAND
    items:
      - Overview
      - Cockpit
      - Command Post
      - Qwen Surgeon
      - Observatory
      - Runtime
      - Opportunities
      - Conv. Log
      - Truth Map
      - Semantic Graph
      - Models
      - GLM-5
      - Telemetry
      - Ecosystem Map
      - Synthesizer
      - Agents
      - Tasks
  - label: INTELLIGENCE
    items: [Eval Harness, System Audit, Evolution, Gates]
  - label: DEEP
    items: [Ontology, Lineage, Stigmergy]
  - label: COMPOSE
    items: [Workflows, Blocks]

hot_path_modules:
  - module: dharma_swarm/swarm.py
    ack_required: true
    warrant: "Changes here affect all orchestration. Must pass test_swarm_integration."
  - module: dharma_swarm/orchestrator.py
    ack_required: true
    warrant: "Dispatch and retry logic. Must pass test_orchestrator."
  - module: dharma_swarm/dgc_cli.py
    ack_required: true
    warrant: "Operator CLI entry point."
  - module: dharma_swarm/telic_seam.py
    ack_required: true
    warrant: "Ontology write-through. Must pass test_telic_seam."

governance_rules:
  semgrep_rule_1:
    description: "No bare RuntimeStateStore() in tests"
    enforced_by: scripts/governance/check_test_hygiene.py
  uplift_guards:
    description: "Pre-commit guard suite"
    enforced_by: scripts/uplift_guards/run_pre_commit.py
    guards:
      - kernel-integrity
      - secrets-scan
      - autonomous-destruction
      - hotpath-ack
      - mismatch-adjacency
      - assurance-diff

opportunity_stages:
  - scope
  - validate
  - deep_research
  - capability
  - mvp
  - first_artifact

# ── Health Check Registry ─────────────────────────────────────────
# Safe, named checks. The manifest declares check IDs; the backend
# runs them from a hardcoded registry. No arbitrary shell commands.

health_check_registry:
  api_router_registered:
    description: "Verify the API router prefix is registered in api/main.py"
    type: api_probe
  api_endpoint_registered:
    description: "Verify each declared api_dependency resolves to a real registered route path (not just the prefix)"
    type: api_probe
  dashboard_route_exists:
    description: "Verify the dashboard page directory exists under dashboard/src/app/dashboard/"
    type: file_exists
  module_file_exists:
    description: "Verify the Python module file exists on disk"
    type: file_exists
  runtime_db_present:
    description: "Verify ~/.dharma/state/runtime.db exists"
    type: file_exists
  ontology_db_present:
    description: "Verify ~/.dharma/ontology.db exists"
    type: file_exists
  test_file_exists:
    description: "Verify a corresponding test file exists in tests/"
    type: file_exists
  api_health_responds:
    description: "Verify /api/health returns 200"
    type: api_probe
  go_world_receipts_present:
    description: "Verify canonical Go world-radar receipts exist under ~/.dharma/go_receipts/world"
    type: file_exists
  recursive_discovery_module_exists:
    description: "Verify the recursive discovery shadow receipt module exists"
    type: file_exists

