    wired_to: [audit, control_surface, evolution, tasks]
    priority: p0
    authority: read_only_verifier
    repo_home: docs/agents/cybernetics_codex
    seed: docs/agents/cybernetics_codex/agent.seed.yaml
    soul: docs/agents/cybernetics_codex/SOUL.md
    context_engineering_desk: docs/agents/cybernetics_codex/CONTEXT_ENGINEERING.md
