overlap_families:
  memory:
    target_shape: "one write path, one consolidation path, one retrieval path"
    canonical_files:
      - dharma_swarm/engine/event_memory.py
      - dharma_swarm/operator_core/session_store.py
      - dharma_swarm/engine/retrieval_feedback.py
    adapters_or_views:
      - dharma_swarm/semantic_memory_bridge.py
      - dharma_swarm/memory_palace.py
    sublation_candidates:
      - dharma_swarm/memory.py
      - dharma_swarm/agent_memory.py
      - dharma_swarm/agent_memory_manager.py
      - dharma_swarm/memory_lattice.py
