      health_check_ids: [autocatalytic_contract_complete, autocatalytic_proof_refs_exist, autocatalytic_node_page_exists]

    - id: dharmagraph_execution
      ordinal: 3
      label: "DharmaGraph Durable Execution"
      role: "Execute prioritized work through idempotent, durable graph boundaries."
      project_bindings: [dharmagraph-engine-2026-07]
