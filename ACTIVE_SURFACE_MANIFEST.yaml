  - validate
  - deep_research
  - capability
  - mvp
  - first_artifact

# ── Health Check Registry ─────────────────────────────────────────
# Safe, named checks. The manifest declares check IDs; the backend
# runs them from a hardcoded registry. No arbitrary shell commands.

health_check_registry:
  api_router_registered:
    description: "Verify the API router prefix is registered in api/main.py"
    type: api_probe
  dashboard_route_exists:
    description: "Verify the dashboard page directory exists under dashboard/src/app/dashboard/"
    type: file_exists
  module_file_exists:
    description: "Verify the Python module file exists on disk"
    type: file_exists
  runtime_db_present:
    description: "Verify ~/.dharma/state/runtime.db exists"
    type: file_exists
  ontology_db_present:
    description: "Verify ~/.dharma/ontology.db exists"
    type: file_exists
  test_file_exists:
    description: "Verify a corresponding test file exists in tests/"
    type: file_exists
  api_health_responds:
    description: "Verify /api/health returns 200"
    type: api_probe

