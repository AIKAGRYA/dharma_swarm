# ── Health Check Registry ─────────────────────────────────────────
# Safe, named checks. The manifest declares check IDs; the backend
# runs them from a hardcoded registry. No arbitrary shell commands.

health_check_registry:
  api_router_registered:
    description: "Verify the API router prefix is registered in api/main.py"
    type: api_probe
  api_endpoint_registered:
    description: "Verify each declared api_dependency resolves to a real registered route path (not just the prefix)"
    type: api_probe
  dashboard_route_exists:
    description: "Verify the dashboard page directory exists under dashboard/src/app/dashboard/"
    type: file_exists
  module_file_exists:
    description: "Verify the Python module file exists on disk"
    type: file_exists
  runtime_db_present:
    description: "Verify ~/.dharma/state/runtime.db exists"
    type: file_exists
  ontology_db_present:
    description: "Verify ~/.dharma/ontology.db exists"
    type: file_exists
  test_file_exists:
    description: "Verify a corresponding test file exists in tests/"
    type: file_exists
  api_health_responds:
    description: "Verify /api/health returns 200"
    type: api_probe
  go_world_receipts_present:
    description: "Verify canonical Go world-radar receipts exist under ~/.dharma/go_receipts/world"
    type: file_exists
  recursive_discovery_module_exists:
    description: "Verify the recursive discovery shadow receipt module exists"
    type: file_exists
  autocatalytic_contract_complete:
    description: "Verify a metabolic node has one typed input, one typed output, a consumer, authority, and proof obligations"
    type: structural
  autocatalytic_proof_refs_exist:
    description: "Verify every declared code/test proof reference exists in the repository"
    type: file_exists
  autocatalytic_node_page_exists:
    description: "Verify the shared dynamic operator page and the node's canonical documentation page exist"
    type: file_exists

