# ACTIVE_SURFACE_MANIFEST.yaml
# Canonical truth about what surfaces, routes, state dirs, and rules are active.
# This file MUST agree with: dashboardNav.ts, controlPlaneRouteDeck.js,
# registered API routers (api/main.py), STATE_DIR ownership, and Semgrep Rule 1.
# Any edit to hot-path modules requires ACK/warrant path documented here.

schema_version: 1
last_updated: "2026-05-06"

state_dir:
  canonical: "~/.dharma"
  runtime_db: "~/.dharma/state/runtime.db"
  telemetry_db: "~/.dharma/state/runtime.db"
  ontology_db: "~/.dharma/ontology.db"
  sessions: "~/.dharma/sessions"
  economics: "~/.dharma/economics"
  revenue_packets: "~/.dharma/revenue_packets"
  operator_brief_artifacts: "~/.dharma/artifacts/operator_brief"
  env_override: "DHARMA_STATE_DIR"

api_routers:
  - id: health
    prefix: /api/health
    module: api.routers.health
  - id: agents
    prefix: /api/agents
    module: api.routers.agents
  - id: evolution
    prefix: /api/evolution
    module: api.routers.evolution
  - id: ontology
    prefix: /api/ontology
    module: api.routers.ontology
  - id: lineage
    prefix: /api/lineage
    module: api.routers.lineage
  - id: stigmergy
    prefix: /api/stigmergy
    module: api.routers.stigmergy
  - id: commands
    prefix: /api/commands
    module: api.routers.commands
  - id: modules
    prefix: /api/modules
    module: api.routers.modules
  - id: dashboard_new
    prefix: /api/dashboard
    module: api.routers.dashboard_new
  - id: telemetry
    prefix: /api/telemetry
    module: api.routers.telemetry
  - id: graphql
    prefix: /api/graphql
    module: api.routers.graphql_router
  - id: verify
    prefix: /api/verify
    module: api.routers.verify
  - id: opportunities
    prefix: /api/opportunities
    module: api.routers.opportunities
  - id: chat
    prefix: /api/chat
    module: api.routers.chat

dashboard_nav_sections:
  - label: COMMAND
    items:
      - Overview
      - Command Post
      - Qwen Surgeon
      - Observatory
      - Runtime
      - Opportunities
      - Conv. Log
      - Truth Map
      - Semantic Graph
      - Models
      - GLM-5
      - Telemetry
      - Ecosystem Map
      - Synthesizer
      - Agents
      - Tasks
  - label: INTELLIGENCE
    items: [Eval Harness, System Audit, Evolution, Gates]
  - label: DEEP
    items: [Ontology, Lineage, Stigmergy]
  - label: COMPOSE
    items: [Workflows, Blocks]

hot_path_modules:
  - module: dharma_swarm/swarm.py
    ack_required: true
    warrant: "Changes here affect all orchestration. Must pass test_swarm_integration."
  - module: dharma_swarm/orchestrator.py
    ack_required: true
    warrant: "Dispatch and retry logic. Must pass test_orchestrator."
  - module: dharma_swarm/dgc_cli.py
    ack_required: true
    warrant: "Operator CLI entry point."
  - module: dharma_swarm/telic_seam.py
    ack_required: true
    warrant: "Ontology write-through. Must pass test_telic_seam."
  - module: dharma_swarm/operator_brief/insight_brief.py
    ack_required: true
    warrant: "First ontology-native operator seam. Must pass test_operator_brief_insight_brief."
  - module: dharma_swarm/operator_brief/persistence.py
    ack_required: true
    warrant: "Operator Brief artifact and runtime_state artifact_records persistence."
  - module: dharma_swarm/operator_brief/watchdog.py
    ack_required: true
    warrant: "Guardian empty-output protection for operator brief cron."
  - module: dharma_swarm/operator_brief/value_events.py
    ack_required: true
    warrant: "Read-only value loop surface for operator brief."
  - module: dharma_swarm/trace_attractor/projector.py
    ack_required: true
    warrant: "Shadow trace read model; must remain pure and rebuildable."
  - module: dharma_swarm/trace_attractor/readers.py
    ack_required: true
    warrant: "Read-only event collection from ontology/runtime/telemetry stores."

governance_rules:
  semgrep_rule_1:
    description: "No bare RuntimeStateStore() in tests"
    enforced_by: scripts/governance/check_test_hygiene.py
  uplift_guards:
    description: "Pre-commit guard suite"
    enforced_by: scripts/uplift_guards/run_pre_commit.py
    guards:
      - kernel-integrity
      - secrets-scan
      - autonomous-destruction
      - hotpath-ack
      - mismatch-adjacency
      - assurance-diff
  docops_integrity:
    description: "Machine-verifiable documentation assertions, path guards, authority guard, and generated inventory checks"
    enforced_by: scripts/docops/check_docops_integrity.py
  current_truth:
    description: "Current operating picture, locks, and next-step queue"
    authority_doc: docs/governance/BUILD_SESSION_ENTRYPOINT.md

operator_brief:
  status: implemented_v0
  feature_flag: DHARMA_OPERATOR_BRIEF_ENABLED
  artifact_kind: operator_brief
  package: dharma_swarm/operator_brief
  value_read: "dgc value-events --since <date>"
  witness_report: reports/witness/2026-05-05-operator-brief-first-tick.md
  next_gate: "Seven calendar days of real value-events use, or explicit Fourfold Action Warrant override"

trace_attractor:
  status: shadow_implemented_not_runtime_authority
  package: dharma_swarm/trace_attractor
  tests:
    - tests/test_trace_attractor_projection.py
    - tests/test_trace_attractor_readers.py
  runtime_wiring: gated

opportunity_stages:
  - scope
  - validate
  - deep_research
  - capability
  - mvp
  - first_artifact
