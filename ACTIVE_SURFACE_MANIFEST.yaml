version: 1
intent: >
  Runtime authority membrane for dharma_swarm. Files may remain on disk as
  research, archive, or reference material, but only manifest-approved surfaces
  should register routes, appear in the operator UI, run on a schedule, or own
  canonical state writes.

policy:
  preserve_artifacts: true
  default_may_register: false
  default_may_appear_in_nav: false
  default_may_run: false
  default_may_write_state: false
  enforcement_stage: report_only

status_meanings:
  active: "Part of the current runtime body."
  projection: "Read-model or view over another authority; not an authority itself."
  adapter: "Compatibility layer around a canonical owner."
  research_preserved: "Useful as reference/research; not an active authority."
  frozen: "Must not gain new runtime authority without manifest change."

