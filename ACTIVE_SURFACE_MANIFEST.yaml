# =========================================================================
# Correlation Spine — closure-layer receipt map (PR A.5)
# =========================================================================
# Doctrine (cross-agent convergence: Perplexity / Codex / Devin / Hermes /
# GPT-5.5):
#
#   Receipts may differ by closure layer. Correlation identity must not.
#   Each closure layer may have its own canonical receipt.
#   Cross-layer identity continuity is the global invariant.
#
# Each layer below holds a receipt that is CANONICAL-WITHIN-LAYER (not a
# derived view of another receipt). The invariant is that a single
# correlation value (under whatever local name) must appear on the
# receipts of every layer a request traverses, so traces can be joined
# end-to-end without table-collapsing the three layers into one.
#
# Adding a new receipt type to dharma_swarm requires adding a new layer
# entry here AND extending docs/governance/ANTI_SLOP_RULES.md Rule 2
# vocabulary. The spine-ownership uplift guard
# (scripts/uplift_guards/check_spine_ownership.py) enforces that
# sqlite/aiosqlite importers under dharma_swarm/spine/ declare their
# role against this vocabulary.
# =========================================================================
correlation_spine:
  schema_version: 1
  invariant: "Receipts may differ by closure layer. Correlation identity must not."
  vocabulary:
    - canonical-store    # owns the source of truth for its layer
    - derived-view       # read-only projection of a canonical-store
    - plugin-sink        # write-only export adapter (e.g. OTel)
    - cache              # ephemeral, rebuildable from canonical sources
    - legacy-mirror      # transitional dual-write, scheduled for removal
    - migration-mirror   # active migration target, becomes canonical-store on cutover
    - exempt             # documented exception (must justify here)

  layers:
    - id: request_response
      label: "A2A request/response closure"
      receipt_class: A2ATaskReceipt
      receipt_module: dharma_swarm.operator_core.a2a_task_lifecycle
      identity_field: correlation_id
      role: canonical-within-layer
      owner: hermes
      notes: |
        Hermes domain. Stamped at A2A gateway entry; fail-closed on empty
        correlation_id (see tests/test_a2a_gateway_init.py). Architecture
        anchor: dharma_swarm/a2a/README.md.

    - id: dispatch_invocation
      label: "Spine dispatch / invocation closure"
      receipt_class: EvidenceReceipt
      receipt_module: dharma_swarm.spine.receipt
      identity_field: trace_id
      identity_alias: correlation_id
      role: canonical-within-layer
      owner: spine
      notes: |
        The dispatch-layer receipt produced by invoke_agent(). Field name
        is trace_id locally; to_otel_span() also exports dharma.correlation_id
        with the same value so cross-layer joins use a single column.

    - id: test_acceptance
      label: "Closure-v0 test/acceptance receipt"
      receipt_class: EvidenceReceipt
      receipt_module: dharma_swarm.operator_core.closure_v0
      identity_field: correlation_id
      role: canonical-within-layer
      owner: operator_core
      notes: |
        Distinct class with the same name as the spine receipt. Naming
        collision is intentionally tolerated during PR A/B turbulence;
        layer-prefixed renames (A2ATaskReceipt / SpineEvidenceReceipt /
        ClosureEvidenceReceipt) are tracked as a follow-up, not forced
        here.

  cross_layer_joins:
    - "A2ATaskReceipt.correlation_id == EvidenceReceipt(spine).trace_id"
    - "EvidenceReceipt(spine).trace_id == EvidenceReceipt(closure_v0).correlation_id"

  guard: scripts/uplift_guards/check_spine_ownership.py
  doctrine_ref: docs/reports/CONVERGED_SEAM_AUDIT_RUNTIME_TRUTH_SPINE.md
  anchor_doc: dharma_swarm/a2a/README.md

# ── Ten-node autocatalytic portfolio ─────────────────────────────
# This is the declared metabolic contract and a read model over existing
# owners. It does not grant side-effect authority. A local cycle proves only
# deterministic semantic A2A wiring; production and external-effect claims
# remain capped by each node's authority and proof obligations.

autocatalytic_portfolio:
  id: dharma-autocatalytic-10
  label: "Dharma Autocatalytic Organism"
  schema_version: dharma.autocatalytic_portfolio.v1
  claim_ceiling: local_rehearsal
  entry_node: world_signal_supply
  witness_dir: "~/.dharma/a2a/autocatalytic_portfolio"
  promotion_rule:
    schema: dharma.a2a.semantic_hop.v1
    statement: "TransportAck cannot inhabit StructuralHop. StructuralHop proves exact task/artifact/causal/hash structure but carries no execution authority. StructuralCycleProof requires exactly ten ordered StructuralHop values. A cycle is only locally receipt-consistent after its mutable runtime rows reverify; that is not authenticated execution provenance."
    transport_ack_promotes: false
    structural_hop_requires: [terminal_completed, typed_semantic_artifact, causal_continuity, hash_continuity, project_adapter_recomputation]
    receipt_consistent_cycle_requires: [exactly_ten_ordered_structural_hops, closed_signal_ring, persisted_local_mutable_receipt_consistency]
    required_evidence: [terminal_completed, typed_semantic_artifact, causal_continuity, hash_continuity, project_adapter_recomputation, local_mutable_runtime_receipt_consistency]
    forbidden_promotions: [transport_ack_to_structural_hop, nonterminal_to_structural_hop, artifact_free_to_structural_hop, local_receipt_consistency_to_authenticated_execution]

  nodes:
    - id: world_signal_supply
      ordinal: 1
      label: "World-Signal Supply Chain"
      role: "Ground external feedback into source-linked opportunity signals."
      project_bindings: [organism-rewire-2026-07]
      authority: local_evidence
      input_signal: promoted_feedback
      output_signal: grounded_signal
      cross_outputs:
        - {signal: oracle_evidence, target: chamber_research}
      transform: ground_feedback
      next_node: sarathi_runtime
      page: /dashboard/organism/world_signal_supply
      doc: docs/architecture/autocatalytic_nodes/world_signal_supply.md
      proof_refs:
        - dharma_swarm/world_radar/go_bridge.py
        - tests/test_world_radar_go_bridge.py
      proof_obligations:
        - "A fresh bronze source receipt binds every promoted signal to raw evidence."
        - "No local rehearsal payload is described as a fresh world observation."
      promotion_checks: [fresh_signal_promoted, bronze_bound]
      health_check_ids: [autocatalytic_contract_complete, autocatalytic_proof_refs_exist, autocatalytic_node_page_exists]

    - id: sarathi_runtime
      ordinal: 2
      label: "Persistent Agent / Sarathi Runtime"
      role: "Turn grounded signals and loop debt into prioritized, identity-bound work."
      project_bindings: [organism-rewire-2026-07, loop-closure-2026-06]
      authority: local_evidence
      input_signal: grounded_signal
      cross_inputs:
        - {signal: operator_intent, source: operator_experience}
      output_signal: prioritized_work
      transform: prioritize_grounded_work
      next_node: dharmagraph_execution
      page: /dashboard/organism/sarathi_runtime
      doc: docs/architecture/autocatalytic_nodes/sarathi_runtime.md
      proof_refs:
