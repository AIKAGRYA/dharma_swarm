version: "3.8"

services:
  web:
    build: .
    container_name: dharmic-quant-web
    ports:
      - "8080:8080"
    volumes:
      - ginko-data:/root/.dharma/ginko
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/fleet"]
      interval: 30s
      timeout: 5s
      retries: 3


  swarm:
    build:
      context: .
      dockerfile: Dockerfile.swarm
    container_name: dharma-swarm
    ports:
      - "7433:7433"   # health API: curl http://localhost:7433/health
    volumes:
      - dharma-state:/root/.dharma
      - ./dharma_swarm:/app/dharma_swarm:ro  # source is READ-ONLY (never mutable)
      # PR-001: writable evolution surfaces are SEPARATE volumes, never source.
      - evolution-worktrees:/evolution_worktrees          # scratch worktrees (rw)
      - evolution-archive:/evolution_archive:ro           # immutable experiment artifacts
      # Protected evaluator is mounted READ-ONLY when present. If absent,
      # promotion-grade evaluation is unavailable (fail-closed).
      - ${DHARMA_EVAL_MOUNT:-/dev/null}:/mnt/dharma_eval:ro
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TINY_ROUTER_BACKEND: heuristic
      DHARMA_EVOLUTION_SHADOW: ${DHARMA_EVOLUTION_SHADOW:-1}
      DGC_AUTONOMY_LEVEL: ${DGC_AUTONOMY_LEVEL:-1}
      DHARMA_SELF_IMPROVE: ${DHARMA_SELF_IMPROVE:-0}
      DHARMA_ALLOW_LIVE_MUTATION: ${DHARMA_ALLOW_LIVE_MUTATION:-0}
      DHARMA_ALLOW_CUSTODIAN_MERGE: ${DHARMA_ALLOW_CUSTODIAN_MERGE:-0}
      DHARMA_EVOLUTION_WORKTREE_ROOT: /evolution_worktrees
      DHARMA_SPINE_DISPATCH: "1"
      DHARMA_STATE_DIR: /root/.dharma
      GUARDIAN_INTERVAL_SECONDS: "14400"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7433/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  cron:
    build: .
    container_name: dharmic-quant-cron
    volumes:
      - ginko-data:/root/.dharma/ginko
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
    entrypoint: ["python3", "-c", "
import asyncio, time, logging;
logging.basicConfig(level=logging.INFO);
logger = logging.getLogger('ginko-cron');
async def run_cycle():
    from dharma_swarm.ginko_orchestrator import action_full_cycle;
    result = await action_full_cycle();
    logger.info('Cycle complete: %s', {k: 'OK' if not isinstance(v, dict) or 'error' not in v else v['error'] for k, v in result.items() if k != 'total_duration_ms'});
    return result;
while True:
    try: asyncio.run(run_cycle());
    except Exception as e: logger.error('Cycle failed: %s', e);
    time.sleep(21600);
"]
    restart: unless-stopped

volumes:
  dharma-state:
    driver: local
  ginko-data:
    driver: local
  # PR-001: evolution surfaces kept SEPARATE from runtime state and from source.
  evolution-worktrees:      # writable scratch worktrees for isolated experiments
    driver: local
  evolution-archive:        # immutable experiment artifacts (mounted read-only)
    driver: local
