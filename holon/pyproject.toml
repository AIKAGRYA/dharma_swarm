[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "holon-runtime"
version = "0.1.0"
description = "Standalone Holon agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dharma Swarm" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
holon = "holon.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
