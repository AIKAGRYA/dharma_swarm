# AGNI hub — publish-to-peer authorization (FFR-D1, operator-ratified 2026-07-09)
#
# TEMPLATE to merge into the nats-server config on the AGNI droplet
# (157.245.193.15). It implements the ratified ACL model:
#
#   PUBLISH   : any peer subject (dharma.a2a.<peer>, dharma.agent.<uid>.inbox
#               and their reply/ack children) + dharma.a2a.fleet
#   SUBSCRIBE : ONLY the agent's own subjects + fleet + its request-reply inbox
#   JS API    : each user may only operate ITS OWN durable consumer on DHARMA_A2A
#
# This replaces the current per-user "publish own subject only" scheme that the
# 2026-07-09 field probe proved blocks all peer-to-peer messaging (permission
# violations from two independent live nodes; only fleet broadcast worked).
#
# HOW TO APPLY (see docs/ops/A2A_LIVE_WIRE_RUNBOOK.md step 1):
#   1. Replace the $2a$... bcrypt placeholders: nats server passwd   (per user)
#   2. Merge the authorization block with the existing server config
#      (KEEP existing listen/websocket/jetstream/tls blocks unchanged).
#   3. nats-server --config <file> -t   # validate syntax
#   4. systemctl reload nats-server     # reload, no restart needed for authz
#
# One VARS block per agent identity. Add agents by copying a stanza; the
# pattern is mechanical: s/AGENT/<uid>/ (dots forbidden in uids).

authorization {
  # ---- shared permission templates -----------------------------------------
  # NOTE: nats-server has no native template expansion for permissions; the
  # stanzas below are written out per user. Keep them textually identical
  # except for the agent's own name so drift is grep-able.

  users = [
    # ------------------------------------------------------------------ hermes
    {
      user: hermes
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_hermes"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",            # publish-to-peer: ANY fleet subject (FFR-D1)
            "dharma.agent.*.inbox",    # spec-scheme peer inboxes
            "dharma.agent.*.inbox.>",  # their reply/ack children
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.hermes_*",  # pull own consumers only
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.hermes_*",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.hermes_*",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.hermes_*",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.hermes_*.>",
            "_INBOX.>"                 # request-reply plumbing
          ]
        }
        subscribe: {
          allow: [
            "dharma.a2a.hermes",       # OWN subjects only
            "dharma.a2a.hermes.>",
            "dharma.agent.hermes.inbox",
            "dharma.agent.hermes.inbox.>",
            "dharma.a2a.fleet",
            "_INBOX.>"
          ]
        }
      }
    }

    # --------------------------------------------------------------- rushabdev
    # FFR-D2: rushabdev gets its OWN subject; stop sharing dharma.a2a.hermes.
    {
      user: rushabdev
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_rushabdev"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",
            "dharma.agent.*.inbox",
            "dharma.agent.*.inbox.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.rushabdev_*",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.rushabdev_*",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.rushabdev_*",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.rushabdev_*",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.rushabdev_*.>",
            "_INBOX.>"
          ]
        }
        subscribe: {
          allow: [
            "dharma.a2a.rushabdev",
            "dharma.a2a.rushabdev.>",
            "dharma.agent.rushabdev.inbox",
            "dharma.agent.rushabdev.inbox.>",
            "dharma.a2a.fleet",
            "_INBOX.>"
          ]
        }
      }
    }

    # ------------------------------------------------------------------- devin
    {
      user: devin
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_devin"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",
            "dharma.agent.*.inbox",
            "dharma.agent.*.inbox.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.devin_*",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.devin_*",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.devin_*",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.devin_*",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.devin_*.>",
            "_INBOX.>"
          ]
        }
        subscribe: {
          allow: [
            "dharma.a2a.devin",
            "dharma.a2a.devin.>",
            "dharma.agent.devin-roaming-2987d222.inbox",
            "dharma.agent.devin-roaming-2987d222.inbox.>",
            "dharma.a2a.fleet",
            "_INBOX.>"
          ]
        }
      }
    }

    # ----------------------------------------------------------------- gateway
    # The mailbox-gateway service account (scripts/runtime/a2a_gateway_server.py).
    # It publishes AND drains ON BEHALF of token-authenticated agents, so it is
    # the one account with wide subscribe — confine it to the gateway host.
    {
      user: a2a_gateway
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_gateway"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",
            "dharma.agent.*.inbox",
            "dharma.agent.*.inbox.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_*",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_*",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_*",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_*",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.gw_*.>",
            "_INBOX.>"
          ]
        }
        subscribe: { allow: ["dharma.a2a.>", "dharma.agent.>", "dharma.a2a.fleet", "_INBOX.>"] }
      }
    }
  ]
}
