# AGNI hub — publish-to-peer authorization (FFR-D1, operator-ratified 2026-07-09)
#
# TEMPLATE to merge into the nats-server config on the AGNI droplet
# (157.245.193.15). It implements the ratified ACL model:
#
#   PUBLISH   : any peer subject (dharma.a2a.<peer>, dharma.agent.<uid>.inbox
#               and their reply/ack children) + dharma.a2a.fleet
#   SUBSCRIBE : ONLY the agent's own subjects + fleet + its request-reply inbox
#   JS API    : each user may only operate ITS OWN durable consumer(s) on DHARMA_A2A
#
# ------------------------------------------------------------------------------
# WILDCARD RULE (Codex review P1, 2026-07-09 — this template's first draft got
# it wrong): NATS `*` matches ONE WHOLE subject token. `hermes_*` is a LITERAL
# token named "hermes_*", NOT a prefix glob, and would deny every real pull
# consumer. Consumer names are a single token in JS API subjects, so per-user
# consumer scoping MUST list each durable name EXACTLY. When you add a durable,
# add its exact name to that user's allow list.
# ------------------------------------------------------------------------------
#
# HOW TO APPLY (see docs/ops/A2A_LIVE_WIRE_RUNBOOK.md step 1):
#   1. Replace the $2a$... bcrypt placeholders: nats server passwd   (per user)
#   2. CONFIRM each user's durable names below match reality first:
#        nats consumer ls DHARMA_A2A        # list live consumers on the hub
#      (hermes's bridge durable name is a placeholder — read it off that list.)
#   3. Merge the authorization block with the existing server config
#      (KEEP existing listen/websocket/jetstream/tls blocks unchanged).
#   4. nats-server --config <file> -t   # validate syntax
#   5. systemctl reload nats-server     # reload, no restart needed for authz

authorization {
  users = [
    # ------------------------------------------------------------------ hermes
    # DURABLE_HERMES: replace with the bridge's real durable from
    # `nats consumer ls DHARMA_A2A` (placeholder below: hermes_inbox).
    {
      user: hermes
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_hermes"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",            # publish-to-peer: ANY fleet subject (FFR-D1)
            "dharma.agent.*.inbox",    # spec-scheme peer inboxes
            "dharma.agent.*.inbox.>",  # their reply/ack children
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.hermes_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.hermes_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.hermes_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.hermes_inbox",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.hermes_inbox.>",
            "_INBOX.>"                 # request-reply plumbing
          ]
        }
        subscribe: {
          allow: [
            "dharma.a2a.hermes",       # OWN subjects only
            "dharma.a2a.hermes.>",
            "dharma.agent.hermes.inbox",
            "dharma.agent.hermes.inbox.>",
            "dharma.a2a.fleet",
            "_INBOX.>"
          ]
        }
      }
    }

    # --------------------------------------------------------------- rushabdev
    # FFR-D2: rushabdev gets its OWN subject; stop sharing dharma.a2a.hermes.
    # DURABLE: rushabdev_inbox (create when the bridge moves to its own subject).
    {
      user: rushabdev
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_rushabdev"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",
            "dharma.agent.*.inbox",
            "dharma.agent.*.inbox.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.rushabdev_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.rushabdev_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.rushabdev_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.rushabdev_inbox",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.rushabdev_inbox.>",
            "_INBOX.>"
          ]
        }
        subscribe: {
          allow: [
            "dharma.a2a.rushabdev",
            "dharma.a2a.rushabdev.>",
            "dharma.agent.rushabdev.inbox",
            "dharma.agent.rushabdev.inbox.>",
            "dharma.a2a.fleet",
            "_INBOX.>"
          ]
        }
      }
    }

    # ------------------------------------------------------------------- devin
    # DURABLE: devin_inbox (canonical, per examples/agents/devin.registration.json).
    {
      user: devin
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_devin"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",
            "dharma.agent.*.inbox",
            "dharma.agent.*.inbox.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.devin_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.devin_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.devin_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.devin_inbox",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            "$JS.ACK.DHARMA_A2A.devin_inbox.>",
            "_INBOX.>"
          ]
        }
        subscribe: {
          allow: [
            "dharma.a2a.devin",
            "dharma.a2a.devin.>",
            "dharma.agent.devin-roaming-2987d222.inbox",
            "dharma.agent.devin-roaming-2987d222.inbox.>",
            "dharma.a2a.fleet",
            "_INBOX.>"
          ]
        }
      }
    }

    # ----------------------------------------------------------------- gateway
    # The mailbox-gateway service account (scripts/runtime/a2a_gateway_server.py).
    # It publishes AND drains ON BEHALF of token-authenticated agents, so it is
    # the one account with wide subscribe — confine it to the gateway host.
    #
    # Gateway durables are gw_<uid>_<route> with '-' mapped to '_' (see
    # mailbox_gateway.inbox). One MSG.NEXT/INFO/CREATE/DURABLE.CREATE/ACK set
    # per durable, listed EXACTLY (no prefix globs — see WILDCARD RULE above).
    # Add four lines + one ACK line per new (agent, route) pair.
    {
      user: a2a_gateway
      password: "$2a$11$REPLACE_WITH_BCRYPT_HASH_gateway"
      permissions: {
        publish: {
          allow: [
            "dharma.a2a.>",
            "dharma.agent.*.inbox",
            "dharma.agent.*.inbox.>",
            "$JS.API.STREAM.INFO.DHARMA_A2A",
            # fable_claude_code
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_fable_claude_code_a2a",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_fable_claude_code_a2a",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_fable_claude_code_a2a",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_fable_claude_code_a2a",
            "$JS.ACK.DHARMA_A2A.gw_fable_claude_code_a2a.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_fable_claude_code_agent_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_fable_claude_code_agent_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_fable_claude_code_agent_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_fable_claude_code_agent_inbox",
            "$JS.ACK.DHARMA_A2A.gw_fable_claude_code_agent_inbox.>",
            # devin-roaming-2987d222
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_devin_roaming_2987d222_a2a",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_devin_roaming_2987d222_a2a",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_devin_roaming_2987d222_a2a",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_devin_roaming_2987d222_a2a",
            "$JS.ACK.DHARMA_A2A.gw_devin_roaming_2987d222_a2a.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_devin_roaming_2987d222_agent_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_devin_roaming_2987d222_agent_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_devin_roaming_2987d222_agent_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_devin_roaming_2987d222_agent_inbox",
            "$JS.ACK.DHARMA_A2A.gw_devin_roaming_2987d222_agent_inbox.>",
            # perplexity-computer
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_perplexity_computer_a2a",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_perplexity_computer_a2a",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_perplexity_computer_a2a",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_perplexity_computer_a2a",
            "$JS.ACK.DHARMA_A2A.gw_perplexity_computer_a2a.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_perplexity_computer_agent_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_perplexity_computer_agent_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_perplexity_computer_agent_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_perplexity_computer_agent_inbox",
            "$JS.ACK.DHARMA_A2A.gw_perplexity_computer_agent_inbox.>",
            # codex
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_codex_a2a",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_codex_a2a",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_codex_a2a",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_codex_a2a",
            "$JS.ACK.DHARMA_A2A.gw_codex_a2a.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_codex_agent_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_codex_agent_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_codex_agent_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_codex_agent_inbox",
            "$JS.ACK.DHARMA_A2A.gw_codex_agent_inbox.>",
            # hermes (gateway lane in addition to its native hermes user above)
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_hermes_a2a",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_hermes_a2a",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_hermes_a2a",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_hermes_a2a",
            "$JS.ACK.DHARMA_A2A.gw_hermes_a2a.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_hermes_agent_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_hermes_agent_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_hermes_agent_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_hermes_agent_inbox",
            "$JS.ACK.DHARMA_A2A.gw_hermes_agent_inbox.>",
            # rushabdev (gateway lane in addition to its native rushabdev user above)
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_rushabdev_a2a",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_rushabdev_a2a",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_rushabdev_a2a",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_rushabdev_a2a",
            "$JS.ACK.DHARMA_A2A.gw_rushabdev_a2a.>",
            "$JS.API.CONSUMER.MSG.NEXT.DHARMA_A2A.gw_rushabdev_agent_inbox",
            "$JS.API.CONSUMER.INFO.DHARMA_A2A.gw_rushabdev_agent_inbox",
            "$JS.API.CONSUMER.CREATE.DHARMA_A2A.gw_rushabdev_agent_inbox",
            "$JS.API.CONSUMER.DURABLE.CREATE.DHARMA_A2A.gw_rushabdev_agent_inbox",
            "$JS.ACK.DHARMA_A2A.gw_rushabdev_agent_inbox.>",
            "_INBOX.>"
          ]
        }
        subscribe: { allow: ["dharma.a2a.>", "dharma.agent.>", "dharma.a2a.fleet", "_INBOX.>"] }
      }
    }
  ]
}
