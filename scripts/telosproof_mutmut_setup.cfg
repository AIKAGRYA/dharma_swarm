# =====================================================================
# telosproof mutation-testing config  (mutmut 3.x [mutmut] section)
# =====================================================================
# OWNED NEW FILE (Generator 3, ADVISORY mutation-testing layer).
# This is a STANDALONE config — it is NOT the repo-root setup.cfg and
# must NEVER be merged into it. scripts/telosproof_mutation.sh copies
# this file into an ephemeral staging directory as `setup.cfg` and runs
# mutmut there, so the repo-root pyproject.toml / setup.cfg are never
# touched (HARD RULE: additive-only, no edits to existing config).
#
# WHY A STAGING DIR: mutmut 3.x reads paths_to_mutate ONLY from a config
# file in CWD (no CLI flag exists in 3.5.0 — verified). The root
# pyproject.toml has no [tool.mutmut] table and we are forbidden to add
# one, so the runner stages an isolated workdir with this config instead.
#
# TARGET THRESHOLD: >= 80% kill rate on the telosproof package.
# (Rationale: telosproof is the proof-carrying safety kernel; ADR-0003
# names mutation testing as a crossover gate. The package is small and
# heavily branched — conservative-on-doubt logic — so a high bar is both
# achievable and meaningful. A surviving mutant that flips a
# danger-default to the permissive value is the exact false-negative
# this kernel exists to prevent.)
#
# paths_to_mutate is written dynamically by the runner (it scopes to
# whichever of the 4 telosproof modules exist at run time). The keys
# below are the stable, non-path config the runner reuses verbatim.
#
# GOTCHA (verified): mutmut 3.x splits list-valued config ONLY on
# newlines. A comma-joined single line is parsed as ONE bogus path and
# silently mutates ZERO files. The runner therefore emits paths_to_mutate
# and pytest_add_cli_args_test_selection as one indented path PER LINE
# (the same multi-line form as also_copy below). Keep that form if you
# ever hand-edit a stage config.
# =====================================================================

[mutmut]
# Mutate ONLY the telosproof package. The runner REPLACES this single
# placeholder line with one indented module path per line before use
# (see GOTCHA above). Do not comma-join.
paths_to_mutate=
    dharma_swarm/telosproof/

# Tests live under tests/. The runner restricts the actual selection to
# tests/test_telosproof*.py via pytest_add_cli_args_test_selection so the
# 6-minute full suite is never invoked.
tests_dir=tests/
pytest_add_cli_args_test_selection=tests/test_telosproof.py

# Copy the full importable package + the telosproof tests into the
# mutants/ sandbox so cross-module imports
# (`from dharma_swarm.telosproof import ChangeSummary`) resolve while only
# the targeted files carry mutants. Whole-dir entries are used because
# mutmut's also_copy does not mkdir parents for nested single files.
also_copy=
    dharma_swarm/
    tests/

# Keep slow-mutant timeouts bounded; telosproof tests run in <0.3s so the
# constant dominates. Unstable mutmut keys — pinned conservatively.
timeout_constant=8.0
timeout_multiplier=4.0
